name: Publish Rust crates to crates.io

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact source tag to publish, for example v0.4.2"
        required: true
        type: string
      confirm:
        description: "Type the exact SDK release identity, for example qx-sdk@0.4.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish the qx-sdk dependency closure
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: publisher
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          path: release-source
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require a tagged release and configured publisher token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "Dispatch this workflow from the reviewed default branch." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be an exact vX.Y.Z tag." >&2
            exit 1
          fi
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "Configure CARGO_REGISTRY_TOKEN in repository Actions secrets." >&2
            exit 1
          fi
          if [[ -n "$(git -C release-source status --porcelain --untracked-files=all)" ]]; then
            echo "The release source checkout must be clean." >&2
            exit 1
          fi
          actual_tag="$(git -C release-source describe --exact-match --tags HEAD)"
          if [[ "${actual_tag}" != "${RELEASE_TAG}" ]]; then
            echo "The release source checkout is not exactly ${RELEASE_TAG}." >&2
            exit 1
          fi

      - name: Publish crates in dependency order and verify a clean registry consumer
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          QX_PUBLISH_CONFIRM: ${{ inputs.confirm }}
        run: >-
          python publisher/tools/publish_rust_sdk.py qx-sdk
          --publish
          --root release-source
          --confirm "$QX_PUBLISH_CONFIRM"
