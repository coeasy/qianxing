name: One-shot runtime Postgres guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-postgres-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal RuntimeConfig production storage guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/qx-runtime/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          needle = '''        if self.storage.data_dir.trim().is_empty() {
              return Err("storage.data_dir 不能为空".into());
          }
          if self
              .storage
              .event_log_segment_events
          '''
          replacement = '''        if self.storage.data_dir.trim().is_empty() {
              return Err("storage.data_dir 不能为空".into());
          }
          if self.environment.eq_ignore_ascii_case("production")
              && self.storage.backend != StorageBackend::Postgres
          {
              return Err(
                  "production 环境 EventLog/Outbox 必须使用 PostgreSQL transactional backend"
                      .into(),
              );
          }
          if self
              .storage
              .event_log_segment_events
          '''
          if text.count(needle) != 1:
              raise SystemExit(f"expected exactly one RuntimeConfig storage guard anchor, found {text.count(needle)}")
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY

      - name: Verify patch is formatting-clean
        run: cargo fmt --all -- --check

      - name: Commit minimal patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/qx-runtime/src/lib.rs
          git diff --cached --check
          git commit -m "fix: require transactional postgres storage in production"
          git push origin HEAD:main
