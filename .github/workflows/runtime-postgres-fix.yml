name: One-shot runtime Postgres guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-postgres-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply minimal RuntimeConfig production storage guard
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("crates/qx-runtime/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          marker = 'production 环境 EventLog/Outbox 必须使用 PostgreSQL transactional backend'
          if marker in text:
              raise SystemExit("production storage guard already exists; refusing duplicate patch")

          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)if self\.storage\.data_dir\.trim\(\)\.is_empty\(\) \{\n'
              r'(?P=indent)    return Err\("storage\.data_dir 不能为空"\.into\(\)\);\n'
              r'(?P=indent)\}\n'
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one RuntimeConfig storage guard anchor, found {len(matches)}"
              )

          match = matches[0]
          indent = match.group("indent")
          guard = (
              f'{indent}if self.environment.eq_ignore_ascii_case("production")\n'
              f'{indent}    && self.storage.backend != StorageBackend::Postgres\n'
              f'{indent}{{\n'
              f'{indent}    return Err(\n'
              f'{indent}        "{marker}".into(),\n'
              f'{indent}    );\n'
              f'{indent}}}\n'
          )
          updated = text[: match.end()] + guard + text[match.end() :]
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Verify exact diff shape
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "crates/qx-runtime/src/lib.rs"
          git diff --numstat crates/qx-runtime/src/lib.rs | awk '$1 <= 12 && $2 == 0 {ok=1} END {exit ok ? 0 : 1}'

      - name: Verify patch is formatting-clean
        run: cargo fmt --all -- --check

      - name: Verify production safety contract
        run: cargo test -p qx-runtime --test production_safety

      - name: Commit minimal patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/qx-runtime/src/lib.rs
          git diff --cached --check
          git commit -m "fix: require transactional postgres storage in production"
          git push origin HEAD:main
