name: One-shot hedge-aware risk refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hedge-risk-refactor.yml

permissions:
  contents: write

jobs:
  patch-hedge-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply hedge-aware risk refactor
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) qx-zhenlu: make PositionSnapshot hedge-aware and enforce reduce-only as an invariant.
          path = Path("crates/qx-zhenlu/src/lib.rs")
          source = path.read_text(encoding="utf-8")

          old_struct = '''pub struct PositionSnapshot {
              pub net_qty: i128,
              pub gross_notional: i128,
              pub multiplier: i128,
          }'''
          new_struct = '''pub struct PositionSnapshot {
              /// One-way/net position only. Hedge-mode long/short legs are stored separately.
              pub net_qty: i128,
              /// Gross notional across one-way and both hedge legs at the risk snapshot mark.
              pub gross_notional: i128,
              pub multiplier: i128,
              pub long_qty: i128,
              pub short_qty: i128,
          }'''
          if source.count(old_struct) != 1:
              raise SystemExit("PositionSnapshot struct block not found uniquely")
          source = source.replace(old_struct, new_struct, 1)

          old_impl = '''impl PositionSnapshot {
              pub fn new(net_qty: i128, gross_notional: i128) -> Self {
                  Self {
                      net_qty,
                      gross_notional,
                      multiplier: 1,
                  }
              }

              pub fn new_with_multiplier(net_qty: i128, gross_notional: i128, multiplier: i128) -> Self {
                  Self {
                      net_qty,
                      gross_notional,
                      multiplier: multiplier.max(1),
                  }
              }
          }'''
          new_impl = '''impl PositionSnapshot {
              pub fn new(net_qty: i128, gross_notional: i128) -> Self {
                  Self {
                      net_qty,
                      gross_notional,
                      multiplier: 1,
                      long_qty: 0,
                      short_qty: 0,
                  }
              }

              pub fn new_with_multiplier(net_qty: i128, gross_notional: i128, multiplier: i128) -> Self {
                  Self {
                      net_qty,
                      gross_notional,
                      multiplier: multiplier.max(1),
                      long_qty: 0,
                      short_qty: 0,
                  }
              }

              pub fn with_hedge_legs(mut self, long_qty: i128, short_qty: i128) -> Self {
                  self.long_qty = long_qty;
                  self.short_qty = short_qty;
                  self
              }

              pub fn active_qty_for(&self, order: &Order) -> i128 {
                  let policy = order.policy.unwrap_or_default();
                  if policy.position_mode == qx_core::PositionMode::Hedge {
                      match policy.position_side {
                          qx_core::PositionSide::Long => self.long_qty,
                          qx_core::PositionSide::Short => self.short_qty,
                          qx_core::PositionSide::Net => self.net_qty,
                      }
                  } else {
                      self.net_qty
                  }
              }
          }

          fn validate_reduce_only(order: &Order, position: &PositionSnapshot) -> QxResult<()> {
              let policy = order.policy.unwrap_or_default();
              if !policy.reduce_only {
                  return Ok(());
              }
              let current = position.active_qty_for(order);
              let current_abs = current
                  .checked_abs()
                  .ok_or_else(|| QxError::Invariant("当前持仓绝对值溢出".into()))?;
              let reduces_direction = (current > 0 && order.side == Side::Sell)
                  || (current < 0 && order.side == Side::Buy);
              if current_abs == 0 || !reduces_direction || order.qty.raw() > current_abs {
                  return Err(QxError::BusinessViolation(
                      "reduce_only 订单必须只减少目标持仓腿且不得反向穿仓".into(),
                  ));
              }
              Ok(())
          }'''
          if source.count(old_impl) != 1:
              raise SystemExit("PositionSnapshot impl block not found uniquely")
          source = source.replace(old_impl, new_impl, 1)

          # Replace the one-way projected exposure section in RiskContext.
          start = source.index("        let signed_delta = match order.side {")
          end = source.index("        if let Some(available) = self.available_margin_raw {", start)
          old_block = source[start:end]
          new_block = '''        validate_reduce_only(order, position)?;
                  let current_qty = position.active_qty_for(order);
                  let signed_delta = match order.side {
                      Side::Buy => order.qty.raw(),
                      Side::Sell => order
                          .qty
                          .raw()
                          .checked_neg()
                          .ok_or_else(|| QxError::Invariant("订单数量取反溢出".into()))?,
                  };
                  let projected_qty = current_qty
                      .checked_add(signed_delta)
                      .ok_or_else(|| QxError::Invariant("投影持仓数量溢出".into()))?;

                  if let Some(limit) = self.max_position_notional_raw {
                      let current_abs = current_qty
                          .checked_abs()
                          .ok_or_else(|| QxError::Invariant("当前持仓绝对值溢出".into()))?;
                      let projected_abs = projected_qty
                          .checked_abs()
                          .ok_or_else(|| QxError::Invariant("投影持仓绝对值溢出".into()))?;
                      let current_leg_notional = spec.notional(current_abs, price.raw())?;
                      let projected_leg_notional = spec.notional(projected_abs, price.raw())?;
                      let other_notional = position
                          .gross_notional
                          .saturating_sub(current_leg_notional);
                      let projected_gross_notional = other_notional
                          .checked_add(projected_leg_notional)
                          .ok_or_else(|| QxError::Invariant("投影持仓名义额溢出".into()))?;
                      if projected_gross_notional > limit {
                          return Err(QxError::BusinessViolation(
                              "投影持仓名义额超过账户限额".into(),
                          ));
                      }
                  }
          '''
          source = source[:start] + new_block + source[end:]

          old_rule_prefix = '''        let signed_delta = match o.side {
                      Side::Buy => o.qty.raw(),
                      Side::Sell => o.qty.raw().saturating_neg(),
                  };
                  let projected_qty = pos.net_qty.saturating_add(signed_delta);
                  let current_abs = pos.net_qty.saturating_abs();'''
          new_rule_prefix = '''        let current_qty = pos.active_qty_for(o);
                  let signed_delta = match o.side {
                      Side::Buy => o.qty.raw(),
                      Side::Sell => o.qty.raw().saturating_neg(),
                  };
                  let projected_qty = current_qty.saturating_add(signed_delta);
                  let current_abs = current_qty.saturating_abs();'''
          if source.count(old_rule_prefix) != 1:
              raise SystemExit("MaxNotionalRule projected block not found uniquely")
          source = source.replace(old_rule_prefix, new_rule_prefix, 1)

          old_gate = '''    pub fn check_with_price(
                  &self,
                  o: &Order,
                  pos: &PositionSnapshot,
                  reference_price: Option<Price>,
              ) -> QxResult<()> {
                  let mut errs = Vec::new();
                  for r in &self.rules {
                      if let Err(e) = r.check_with_price(o, pos, reference_price) {
                          errs.push(format!("{}: {}", r.name(), e));
                      }
                  }
                  if errs.is_empty() {
                      Ok(())
                  } else {
                      Err(QxError::BusinessViolation(errs.join("; ")))
                  }
              }'''
          new_gate = '''    pub fn check_with_price(
                  &self,
                  o: &Order,
                  pos: &PositionSnapshot,
                  reference_price: Option<Price>,
              ) -> QxResult<()> {
                  let mut errs = Vec::new();
                  if let Err(error) = validate_reduce_only(o, pos) {
                      errs.push(format!("ReduceOnly: {error}"));
                  }
                  for r in &self.rules {
                      if let Err(e) = r.check_with_price(o, pos, reference_price) {
                          errs.push(format!("{}: {}", r.name(), e));
                      }
                  }
                  if errs.is_empty() {
                      Ok(())
                  } else {
                      Err(QxError::BusinessViolation(errs.join("; ")))
                  }
              }'''
          if source.count(old_gate) != 1:
              raise SystemExit("RiskGate::check_with_price block not found uniquely")
          source = source.replace(old_gate, new_gate, 1)
          path.write_text(source, encoding="utf-8")

          # 2) qx-cli live worker: derive one-way + Long + Short and true gross exposure.
          path = Path("crates/qx-cli/src/main.rs")
          source = path.read_text(encoding="utf-8")
          old_live = '''    let state = pipeline
                  .ledger()
                  .position_for(account_id, &order.instrument);
              let position_qty = state
                  .quantity
                  .raw()
                  .checked_abs()
                  .ok_or_else(|| "当前持仓数量绝对值溢出".to_string())?;
              let gross_notional = reference_price
                  .map(|price| spec.notional(position_qty, price.raw()))
                  .transpose()
                  .map_err(|error| format!("计算当前持仓名义额失败: {error:?}"))?
                  .unwrap_or(0);
              let position = PositionSnapshot::new(state.quantity.raw(), gross_notional);'''
          new_live = '''    let aggregate = pipeline
                  .ledger()
                  .position_for(account_id, &order.instrument);
              let long_qty = pipeline
                  .ledger()
                  .position_for_side(account_id, &order.instrument, qx_core::PositionSide::Long)
                  .quantity
                  .raw();
              let short_qty = pipeline
                  .ledger()
                  .position_for_side(account_id, &order.instrument, qx_core::PositionSide::Short)
                  .quantity
                  .raw();
              let one_way_qty = aggregate
                  .quantity
                  .raw()
                  .checked_sub(long_qty)
                  .and_then(|value| value.checked_sub(short_qty))
                  .ok_or_else(|| "拆分 one-way/hedge 持仓数量溢出".to_string())?;
              let gross_notional = reference_price
                  .map(|price| {
                      let one_way = spec.notional(one_way_qty.saturating_abs(), price.raw())?;
                      let long = spec.notional(long_qty.saturating_abs(), price.raw())?;
                      let short = spec.notional(short_qty.saturating_abs(), price.raw())?;
                      one_way
                          .checked_add(long)
                          .and_then(|value| value.checked_add(short))
                          .ok_or_else(|| qx_core::QxError::Invariant("当前 gross notional 溢出".into()))
                  })
                  .transpose()
                  .map_err(|error| format!("计算当前持仓名义额失败: {error:?}"))?
                  .unwrap_or(0);
              let position = PositionSnapshot::new_with_multiplier(
                  one_way_qty,
                  gross_notional,
                  spec.contract_size,
              )
              .with_hedge_legs(long_qty, short_qty);'''
          if source.count(old_live) != 1:
              raise SystemExit("live worker position snapshot block not found uniquely")
          path.write_text(source.replace(old_live, new_live, 1), encoding="utf-8")

          # 3) Bar backtest: risk snapshot must preserve separate hedge legs and gross exposure.
          path = Path("crates/qx-xingban/src/backtest.rs")
          source = path.read_text(encoding="utf-8")
          old_bar = '''                            let gross_notional = notional_for(
                                  derivative_spec,
                                  checked_abs(position)?,
                                  checked_abs(visible_close)?,
                                  multiplier,
                              )?;
                              if matches!(order.status, OrderStatus::PendingSubmit) {
                                  // Protocol-level strategy orders enter the same
                                  // submit transition as live execution before OMS.
                                  order.status = OrderStatus::Submitted;
                              }
                              let risk_result = risk.check_with_price(
                                  &order,
                                  &PositionSnapshot::new_with_multiplier(
                                      position,
                                      gross_notional,
                                      multiplier,
                                  ),
                                  Some(Price::from_raw(reference_price)),
                              );'''
          new_bar = '''                            let long_qty = ledger
                                  .position_for_side(
                                      &account_id,
                                      &instrument,
                                      qx_core::PositionSide::Long,
                                  )
                                  .quantity
                                  .raw();
                              let short_qty = ledger
                                  .position_for_side(
                                      &account_id,
                                      &instrument,
                                      qx_core::PositionSide::Short,
                                  )
                                  .quantity
                                  .raw();
                              let one_way_qty = position
                                  .checked_sub(long_qty)
                                  .and_then(|value| value.checked_sub(short_qty))
                                  .ok_or_else(|| {
                                      qx_core::QxError::Invariant(
                                          "拆分回测 one-way/hedge 持仓数量溢出".into(),
                                      )
                                  })?;
                              let gross_notional = notional_for(
                                  derivative_spec,
                                  checked_abs(one_way_qty)?,
                                  checked_abs(visible_close)?,
                                  multiplier,
                              )?
                              .checked_add(notional_for(
                                  derivative_spec,
                                  checked_abs(long_qty)?,
                                  checked_abs(visible_close)?,
                                  multiplier,
                              )?)
                              .and_then(|value| {
                                  value.checked_add(
                                      notional_for(
                                          derivative_spec,
                                          checked_abs(short_qty).ok()?,
                                          checked_abs(visible_close).ok()?,
                                          multiplier,
                                      )
                                      .ok()?,
                                  )
                              })
                              .ok_or_else(|| {
                                  qx_core::QxError::Invariant(
                                      "回测 hedge gross notional 溢出".into(),
                                  )
                              })?;
                              if matches!(order.status, OrderStatus::PendingSubmit) {
                                  // Protocol-level strategy orders enter the same
                                  // submit transition as live execution before OMS.
                                  order.status = OrderStatus::Submitted;
                              }
                              let risk_position = PositionSnapshot::new_with_multiplier(
                                  one_way_qty,
                                  gross_notional,
                                  multiplier,
                              )
                              .with_hedge_legs(long_qty, short_qty);
                              let risk_result = risk.check_with_price(
                                  &order,
                                  &risk_position,
                                  Some(Price::from_raw(reference_price)),
                              );'''
          if source.count(old_bar) != 1:
              raise SystemExit("bar backtest risk snapshot block not found uniquely")
          source = source.replace(old_bar, new_bar, 1)
          # Simplify the generated checked-add expression into normal intermediate values before rustfmt.
          needle = '''                              let gross_notional = notional_for(
                                  derivative_spec,
                                  checked_abs(one_way_qty)?,
                                  checked_abs(visible_close)?,
                                  multiplier,
                              )?
                              .checked_add(notional_for(
                                  derivative_spec,
                                  checked_abs(long_qty)?,
                                  checked_abs(visible_close)?,
                                  multiplier,
                              )?)
                              .and_then(|value| {
                                  value.checked_add(
                                      notional_for(
                                          derivative_spec,
                                          checked_abs(short_qty).ok()?,
                                          checked_abs(visible_close).ok()?,
                                          multiplier,
                                      )
                                      .ok()?,
                                  )
                              })
                              .ok_or_else(|| {
                                  qx_core::QxError::Invariant(
                                      "回测 hedge gross notional 溢出".into(),
                                  )
                              })?;'''
          replacement = '''                              let mark_abs = checked_abs(visible_close)?;
                              let one_way_notional = notional_for(
                                  derivative_spec,
                                  checked_abs(one_way_qty)?,
                                  mark_abs,
                                  multiplier,
                              )?;
                              let long_notional = notional_for(
                                  derivative_spec,
                                  checked_abs(long_qty)?,
                                  mark_abs,
                                  multiplier,
                              )?;
                              let short_notional = notional_for(
                                  derivative_spec,
                                  checked_abs(short_qty)?,
                                  mark_abs,
                                  multiplier,
                              )?;
                              let gross_notional = one_way_notional
                                  .checked_add(long_notional)
                                  .and_then(|value| value.checked_add(short_notional))
                                  .ok_or_else(|| {
                                      qx_core::QxError::Invariant(
                                          "回测 hedge gross notional 溢出".into(),
                                      )
                                  })?;'''
          if source.count(needle) != 1:
              raise SystemExit("generated bar gross notional block not found uniquely")
          path.write_text(source.replace(needle, replacement, 1), encoding="utf-8")

          # 4) OrderBook/Tick backtest: same hedge-aware snapshot; RiskGate now owns reduce-only invariant.
          path = Path("crates/qx-xingban/src/orderbook_backtest.rs")
          source = path.read_text(encoding="utf-8")
          old_ob = '''                let position_snapshot = if let Some(spec) = instrument_spec.as_ref() {
                      PositionSnapshot::new_with_multiplier(
                          position,
                          reference_price
                              .map(|price| spec.notional(position.abs(), price.raw()).unwrap_or(0))
                              .unwrap_or(0),
                          spec.contract_size,
                      )
                  } else {
                      PositionSnapshot::new(position, 0)
                  };'''
          new_ob = '''                let long_qty = ledger
                      .position_for_side(&account_id, &instrument, qx_core::PositionSide::Long)
                      .quantity
                      .raw();
                  let short_qty = ledger
                      .position_for_side(&account_id, &instrument, qx_core::PositionSide::Short)
                      .quantity
                      .raw();
                  let one_way_qty = position
                      .checked_sub(long_qty)
                      .and_then(|value| value.checked_sub(short_qty))
                      .ok_or_else(|| {
                          qx_core::QxError::Invariant(
                              "拆分订单簿 one-way/hedge 持仓数量溢出".into(),
                          )
                      })?;
                  let position_snapshot = if let Some(spec) = instrument_spec.as_ref() {
                      let gross_notional = if let Some(price) = reference_price {
                          let one_way = spec.notional(one_way_qty.saturating_abs(), price.raw())?;
                          let long = spec.notional(long_qty.saturating_abs(), price.raw())?;
                          let short = spec.notional(short_qty.saturating_abs(), price.raw())?;
                          one_way
                              .checked_add(long)
                              .and_then(|value| value.checked_add(short))
                              .ok_or_else(|| {
                                  qx_core::QxError::Invariant(
                                      "订单簿 hedge gross notional 溢出".into(),
                                  )
                              })?
                      } else {
                          0
                      };
                      PositionSnapshot::new_with_multiplier(
                          one_way_qty,
                          gross_notional,
                          spec.contract_size,
                      )
                      .with_hedge_legs(long_qty, short_qty)
                  } else {
                      PositionSnapshot::new(one_way_qty, 0).with_hedge_legs(long_qty, short_qty)
                  };'''
          if source.count(old_ob) != 1:
              raise SystemExit("orderbook risk snapshot block not found uniquely")
          path.write_text(source.replace(old_ob, new_ob, 1), encoding="utf-8")
      - name: Format
        run: cargo fmt --all
      - name: Verify hedge-aware risk contracts
        run: |
          cargo test -p qx-zhenlu
          cargo test -p qx-xingban
          cargo check -p qx-cli --features sqlite
      - name: Commit verified hedge-aware risk refactor
        run: |
          git config user.name "qianxing-ci"
          git config user.email "actions@users.noreply.github.com"
          git add crates/qx-zhenlu/src/lib.rs crates/qx-cli/src/main.rs crates/qx-xingban/src/backtest.rs crates/qx-xingban/src/orderbook_backtest.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: unify hedge exposure and reduce-only risk semantics [hedge-risk]"
          git push origin HEAD:main
