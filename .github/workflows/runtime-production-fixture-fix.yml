name: One-shot Runtime production fixture fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-production-fixture-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Make production unit fixtures use transactional Postgres
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/qx-runtime/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          functions = [
              "production_bound_strategy_requires_research_snapshot",
              "production_c_abi_strategy_requires_detached_signature",
              "production_external_strategy_requires_artifact_lock",
          ]
          insertion = (
              '        config.storage.backend = StorageBackend::Postgres;\n'
              '        config.storage.postgres_dsn_env = Some("QX_POSTGRES_DSN".into());\n'
          )
          for name in functions:
              function = f"    fn {name}() {{"
              start = text.find(function)
              if start < 0:
                  raise SystemExit(f"test function not found: {name}")
              end = text.find("\n    #[test]\n", start + len(function))
              if end < 0:
                  raise SystemExit(f"test function end not found: {name}")
              block = text[start:end]
              needle = '        config.environment = "production".into();\n'
              if block.count(needle) != 1:
                  raise SystemExit(f"expected one production environment anchor in {name}, found {block.count(needle)}")
              if "config.storage.backend = StorageBackend::Postgres;" in block:
                  raise SystemExit(f"fixture already has Postgres backend: {name}")
              block = block.replace(needle, needle + insertion, 1)
              text = text[:start] + block + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify exact diff shape
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "crates/qx-runtime/src/lib.rs"
          git diff --numstat crates/qx-runtime/src/lib.rs | awk '$1 == 6 && $2 == 0 {ok=1} END {exit ok ? 0 : 1}'

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Verify production runtime unit contracts
        run: cargo test -p qx-runtime --lib production_

      - name: Verify production storage safety gate
        run: cargo test -p qx-runtime --test production_safety

      - name: Commit minimal fixture correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/qx-runtime/src/lib.rs
          git diff --cached --check
          git commit -m "test: align production runtime fixtures with postgres gate"
          git push origin HEAD:main
