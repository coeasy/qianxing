name: One-shot Factor materializer wiring

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/factor-materializer-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Wire materializer into qx-factor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/qx-factor/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          if "mod materializer;" in text:
              raise SystemExit("materializer already wired")
          anchor = "mod execution_plan;\n\npub use execution_plan::{\n"
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one factor module anchor, found {text.count(anchor)}")
          replacement = "mod execution_plan;\nmod materializer;\n\npub use execution_plan::{\n"
          text = text.replace(anchor, replacement, 1)
          export_anchor = "    FACTOR_EXECUTION_PLAN_SCHEMA_VERSION,\n};\n"
          if text.count(export_anchor) != 1:
              raise SystemExit(f"expected one execution plan export anchor, found {text.count(export_anchor)}")
          materializer_exports = (
              export_anchor
              + "pub use materializer::{\n"
              + "    FactorArtifactCache, FactorDirtyRange, FactorEvaluationRequest, FactorEvaluator,\n"
              + "    FactorMaterializationResult, FactorMaterializer,\n"
              + "};\n"
          )
          path.write_text(text.replace(export_anchor, materializer_exports, 1), encoding="utf-8")
          PY

      - name: Format workspace
        run: cargo fmt --all

      - name: Verify bounded diff
        shell: bash
        run: |
          git diff --check
          test -n "$(git diff --name-only)"
          unexpected="$(git diff --name-only | grep -Ev '^crates/qx-factor/src/(lib.rs|materializer.rs)$' || true)"
          test -z "$unexpected"
          git diff --numstat crates/qx-factor/src/lib.rs | awk '$1 <= 8 && $2 == 0 {ok=1} END {exit ok ? 0 : 1}'

      - name: Clippy qx-factor
        run: cargo clippy -p qx-factor --all-targets -- -D warnings

      - name: Test qx-factor
        run: cargo test -p qx-factor

      - name: Commit verified materializer wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/qx-factor/src/lib.rs crates/qx-factor/src/materializer.rs
          git diff --cached --check
          git commit -m "feat: wire factor execution plan materializer"
          git push origin HEAD:main
