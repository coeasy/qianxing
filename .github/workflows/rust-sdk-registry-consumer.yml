name: Rust SDK crates.io consumer matrix

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact published qx-sdk version, for example 0.4.1"
        required: true
        default: "0.4.1"
        type: string

permissions:
  contents: read

jobs:
  consumer:
    name: Clean crates.io consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and run the published SDK from a clean Cargo home
        shell: bash
        env:
          QX_SDK_VERSION: ${{ inputs.version }}
        run: python tools/check_rust_sdk_registry_consumer.py --version "$QX_SDK_VERSION"
