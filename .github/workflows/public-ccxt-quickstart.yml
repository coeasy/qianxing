name: Public CCXT quickstart acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/public-ccxt-quickstart.yml"
      - "crates/qx-cli/src/quickstart.rs"
      - "crates/qx-cli/src/cli_args.rs"
      - "crates/qx-cli/src/cli.rs"
      - "crates/qx-cli/src/cli/project_command.rs"
      - "crates/qx-cli/src/cli_help.rs"
      - "crates/qx-cli/src/backtests/ccxt_builtin.rs"
      - "crates/qx-cli/src/init_project.rs"
      - "crates/qx-cli/src/project_manifest.rs"
      - "crates/qx-cli/src/report_command.rs"
      - "crates/qx-cli/src/report_html.rs"
      - "crates/qx-cli/src/worker_entry.rs"
      - "crates/qx-xingban/src/backtest/**"
      - "crates/qx-risk/src/**"
      - "crates/qx-adapter/src/ccxt.rs"
      - "python/qianxing/cli.py"
      - "python/qianxing_ccxt/**"
      - "python/tests/test_project_runs.py"
      - "python/tests/test_ccxt.py"
      - "python/tests/test_ccxt_worker.py"
      - "docs/first-run.md"
      - "tools/check_architecture.py"
      - "tools/build_python_wheel.sh"
      - "python/pyproject.toml"
      - "deploy/qianxing.runtime.ccxt.example.json"
  workflow_dispatch:
    inputs:
      public_profile:
        description: "Use the release profile (OKX/Bitget swaps + Binance Spot public data)"
        required: true
        type: choice
        options:
          - full
          - release
        default: full
  workflow_call:
    inputs:
      release_sha:
        description: Exact source commit verified by the calling release workflow
        required: false
        type: string
      public_profile:
        description: "Release profile checks OKX/Bitget swaps and Binance Spot; full profile also checks Binance perpetuals."
        required: false
        type: string
        default: full

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"

jobs:
  build-linux-release:
    name: Build shared Linux release artifacts
    # Keep the standalone CLI compatible with Debian 12 / Ubuntu 22.04.
    # ubuntu-latest can move to a newer glibc and silently raise the runtime baseline.
    runs-on: ubuntu-22.04
    outputs:
      as_of_ms: ${{ steps.acceptance-window.outputs.as_of_ms }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04-glibc-2.35-${{ runner.arch }}
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture one UTC cutoff for all exchanges
        id: acceptance-window
        shell: bash
        run: |
          set -euo pipefail
          printf 'as_of_ms=%s\n' "$(date -u +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Build the Linux release wheel and bundled CLI once
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check maturin==1.15.0
          PYTHON=python bash tools/build_python_wheel.sh
          target/release/qx-cli version
          max_glibc="$(objdump -T target/release/qx-cli | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu | tail -n 1 | sed 's/^GLIBC_//')"
          test -n "$max_glibc"
          if [[ "$(printf '2.35\n%s\n' "$max_glibc" | sort -V | tail -n 1)" != "2.35" ]]; then
            echo "Linux CLI requires GLIBC_$max_glibc; release baseline is GLIBC_2.35 (Debian 12 / Ubuntu 22.04)" >&2
            exit 1
          fi
          echo "Linux CLI maximum GLIBC requirement: $max_glibc"
          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/target/release/qx-cli:/qx-cli:ro" \
            debian:12-slim /qx-cli version
          mkdir -p "$RUNNER_TEMP/qianxing-wheel-linux"
          python -c 'import glob, os, zipfile; zipfile.ZipFile(glob.glob("dist/*.whl")[0]).extractall(os.path.join(os.environ["RUNNER_TEMP"], "qianxing-wheel-linux"))'
          chmod +x "$RUNNER_TEMP/qianxing-wheel-linux/qianxing/_bin/qx-cli"
          cmp --silent target/release/qx-cli "$RUNNER_TEMP/qianxing-wheel-linux/qianxing/_bin/qx-cli"
          docker run --rm \
            --volume "$RUNNER_TEMP/qianxing-wheel-linux:/wheel:ro" \
            debian:12-slim /wheel/qianxing/_bin/qx-cli version
          tar -czf "$RUNNER_TEMP/qianxing-linux-release.tar.gz" dist/*.whl target/release/qx-cli
          tar -tzf "$RUNNER_TEMP/qianxing-linux-release.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: qianxing-linux-release
          path: ${{ runner.temp }}/qianxing-linux-release.tar.gz
          if-no-files-found: error
          retention-days: 2

  public-market-data-quickstart:
    name: Real public-data quickstart (${{ matrix.exchange }} ${{ matrix.market_type }})
    runs-on: ubuntu-22.04
    needs: build-linux-release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request' || inputs.public_profile == 'release') && '[{"exchange":"okx","market_type":"swap","instrument":"BTC/USDT:USDT.OKX","days":180},{"exchange":"bitget","market_type":"swap","instrument":"BTC/USDT:USDT.BITGET","days":180},{"exchange":"binance","market_type":"spot","instrument":"BTC/USDT.BINANCE","days":180}]' || '[{"exchange":"okx","market_type":"swap","instrument":"BTC/USDT:USDT.OKX","days":180},{"exchange":"binance","market_type":"swap","instrument":"BTC/USDT:USDT.BINANCE","days":180},{"exchange":"binance","market_type":"spot","instrument":"BTC/USDT.BINANCE","days":180},{"exchange":"bitget","market_type":"swap","instrument":"BTC/USDT:USDT.BITGET","days":180}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: qianxing-linux-release
          path: ${{ runner.temp }}/linux-release
      - name: Restore the shared Linux release artifacts
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/linux-release/qianxing-linux-release.tar.gz" -C "$GITHUB_WORKSPACE"
          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          target/release/qx-cli version
          mkdir -p "$RUNNER_TEMP/public-ccxt-acceptance"
      - name: Run the installed Python wheel through real public data and render a report
        env:
          EXCHANGE: ${{ matrix.exchange }}
          MARKET_TYPE: ${{ matrix.market_type }}
          INSTRUMENT: ${{ matrix.instrument }}
          ACCEPTANCE_DAYS: ${{ matrix.days }}
          AS_OF_MS: ${{ needs.build-linux-release.outputs.as_of_ms }}
          ACCEPTANCE_ROOT: ${{ runner.temp }}/public-ccxt-acceptance
          PYTHON_BIN: ${{ runner.temp }}/python-acceptance/bin/python
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/python-acceptance"
          "$PYTHON_BIN" -m pip install --disable-pip-version-check --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          "$PYTHON_BIN" -c 'import qianxing_bridge; print("native_extension=loaded")'
          "$PYTHON_BIN" -m pip install --disable-pip-version-check ccxt==4.5.89
          project="$ACCEPTANCE_ROOT/$EXCHANGE-$MARKET_TYPE/project"
          home="$ACCEPTANCE_ROOT/$EXCHANGE-$MARKET_TYPE/home"
          mkdir -p "$home"
          export HOME="$home"
          export XDG_DATA_HOME="$home/.local/share"
          export QX_PYTHON="$PYTHON_BIN"
          log="$ACCEPTANCE_ROOT/$EXCHANGE-$MARKET_TYPE/quickstart.log"
          mkdir -p "$(dirname "$log")"
          "$PYTHON_BIN" -m qianxing.cli quickstart "$project" \
            --profile ccxt --days "$ACCEPTANCE_DAYS" --timeframe 15m --as-of-ms "$AS_OF_MS" \
            --exchange "$EXCHANGE" --market-type "$MARKET_TYPE" --instrument "$INSTRUMENT" \
            2>&1 | tee "$log"
          test -s "$project/qianxing.project.json"
          test -s "$project/qianxing.ccxt.public.json"
          python - "$project/qianxing.ccxt.public.json" "$EXCHANGE" "$MARKET_TYPE" "$INSTRUMENT" <<'PY'
          import json
          import sys
          from pathlib import Path

          config = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert config["exchange_id"] == sys.argv[2], config
          assert config["default_type"] == sys.argv[3], config
          assert sys.argv[4] in config["instruments"], config
          assert config["sandbox"] is False, config
          forbidden = {"apiKey", "secret", "password", "uid", "token"}
          assert not (forbidden & config.keys()), config
          if sys.argv[3] == "spot":
              assert config["public_market_data_endpoint"] == "binance_spot_data_api", config
              assert config["options"]["fetchMarkets"]["types"] == ["spot"], config
          else:
              assert "public_market_data_endpoint" not in config, config
          PY
          report="$(find "$project" "$home" -type f -name '*.report.html' -size +0c -print -quit)"
          test -n "$report"
          summary="$(find "$project" -type f -name '*.summary.json' -size +0c -print -quit)"
          test -n "$summary"
          python - "$summary" "$ACCEPTANCE_DAYS" "$MARKET_TYPE" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          days = int(sys.argv[2])
          market_type = sys.argv[3]
          expected_bars = days * 24 * 4
          assert int(summary["bars"]) == expected_bars, {
              "expected_bars": expected_bars,
              "summary": summary,
          }
          rejected_orders = int(summary["rejected_orders"])
          rejection_reasons = summary.get("rejection_reasons") or []
          if isinstance(rejection_reasons, dict):
              rejection_reasons = [rejection_reasons]
          if market_type == "spot":
              # Cash-only Spot can leave exchange-minimum dust after fills. Accept only
              # a small, fully explained tail; short/oversell rejections are never valid.
              fills = int(summary["fills"])
              assert fills > 0, summary
              assert rejected_orders <= max(1, fills // 20), {
                  "fills": fills,
                  "rejected_orders": rejected_orders,
                  "rejection_reasons": rejection_reasons,
              }
              assert sum(int(item["count"]) for item in rejection_reasons) == rejected_orders, {
                  "rejected_orders": rejected_orders,
                  "rejection_reasons": rejection_reasons,
              }
              assert all(
                  "订单名义金额低于交易所最小限制" in str(item["reason"])
                  for item in rejection_reasons
              ), rejection_reasons
          else:
              assert rejected_orders == 0, rejection_reasons
          quality = summary["dataset_quality"]["quality_report"]
          assert int(quality["missing_intervals"]) == 0, quality
          PY
          printf 'exchange=%s\nmarket_type=%s\ninstrument=%s\nreport=%s\n' "$EXCHANGE" "$MARKET_TYPE" "$INSTRUMENT" "$report" \
            > "$ACCEPTANCE_ROOT/$EXCHANGE-$MARKET_TYPE/result.txt"
          sha256sum "$GITHUB_WORKSPACE/target/release/qx-cli" > "$ACCEPTANCE_ROOT/$EXCHANGE-$MARKET_TYPE/qx-cli.sha256"
          python --version > "$ACCEPTANCE_ROOT/$EXCHANGE-$MARKET_TYPE/python-version.txt" 2>&1
          "$PYTHON_BIN" -c 'import ccxt; print(ccxt.__version__)' > "$ACCEPTANCE_ROOT/$EXCHANGE-$MARKET_TYPE/ccxt-version.txt"
      - name: Upload quickstart project, real-data lineage, report, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ccxt-quickstart-${{ matrix.exchange }}-${{ matrix.market_type }}
          path: ${{ runner.temp }}/public-ccxt-acceptance/${{ matrix.exchange }}-${{ matrix.market_type }}
          if-no-files-found: warn
          retention-days: 30
