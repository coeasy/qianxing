name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Tracked runtime fixtures contain long deterministic artifact names. Keep Windows
# checkouts working without making the generated files part of any acceptance gate.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub Actions workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Check tracked Markdown links and path casing
        run: python tools/check_markdown_links.py
      - name: Validate strategy refactor work-package ledger
        run: python tools/check_strategy_refactor_ledger.py

  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Production unwrap and expect lint
        run: |
          cargo clippy --workspace --lib --bins -- -D clippy::unwrap_used -D clippy::expect_used
          ! rg -n '\.(unwrap|expect)[[:space:]]*\(' crates/qx-app/build.rs crates/qx-cli/build.rs crates/qx-python/build.rs
      - name: Build Python native extension for workspace parity tests
        env:
          QX_PYTHON: python3
        run: cargo build -p qx-python
      # 显式钉住解释器：`e2e_and_python_contract` 的两条 worker 契约用例在缺 QX_PYTHON 时
      # 回落 PATH 上的 `python`，于是「Python 链在 CI 绿」可能只是碰巧有个能跑的解释器，
      # 而不是真的跑在 CI 声明的那一版上（V13 R26）。
      - name: Workspace tests
        env:
          QX_PYTHON: python3
        run: cargo test --workspace
      - name: Linux strategy host capability dispatch (R08)
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R08-AC01
          --input crates/qx-cli/src/workers/strategy_worker.rs
          --input crates/qx-strategy/src/capabilities.rs
          --notes "Linux built-in Strategy host accepts supported requirements and rejects unsupported or algorithm-missing capabilities before dispatch"
          -- cargo test -p qx-cli --bin qx-cli -- --test-threads=1
          builtin_worker_validates_declared_and_algorithm_capabilities_before_dispatch
      - name: Linux legacy C ABI capability compatibility (R08)
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R08-AC01
          --input crates/qx-strategy/tests/legacy_c_abi_capability_load.rs
          --input crates/qx-strategy/src/capabilities.rs
          --notes "Linux legacy C ABI plugin without the optional capability export remains compatible with empty requirements and rejects unsupported requirements before create"
          -- cargo test -p qx-strategy --test legacy_c_abi_capability_load
      - name: Linux backtest metrics and report contract (R17)
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R17-AC01
          --input tools/accept_backtest_metrics_contract.py
          --input crates/qx-core/src/performance.rs
          --input crates/qx-app/src/artifact_store/backtest_summary.rs
          --input crates/qx-cli/src/report_html.rs
          --input crates/qx-cli/src/report_xlsx/rows.rs
          --notes "Linux focused Rust metric and report projections preserve daily labels and exact large-value precision"
          -- python3 tools/accept_backtest_metrics_contract.py
      - name: Linux qx-cli behavior and ownership tests (R19)
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R19-AC01
          --input crates/qx-cli/src/cli.rs
          --input crates/qx-cli/src/cli_command_manifest.json
          --input crates/qx-cli/tests/cli_behavior_parity.rs
          --input crates/qx-cli/tests/cli_behavior_parity/report_metrics_projection.rs
          --notes "Linux qx-cli unit suite verifies CLI facade routing and compatibility"
          -- cargo test -p qx-cli --bin qx-cli
      - name: Linux qx-cli behavior parity (R19)
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R19-AC01
          --input crates/qx-cli/tests/cli_behavior_parity.rs
          --input crates/qx-cli/tests/cli_behavior_parity/report_metrics_projection.rs
          --notes "Linux CLI behavior-parity integration target preserves report and facade compatibility"
          -- cargo test -p qx-cli --test cli_behavior_parity -- --test-threads=1
      - name: Verify CLI tests leave runtime data isolated
        run: python3 tools/check_cli_test_data_isolation.py
      - name: Upload Linux Rust host-capability acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-capability-acceptance-linux
          path: |
            maturity/strategy-run-acceptance-v1.json
            maturity/acceptance-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Capability unverified register
        run: python3 tools/generate_unverified.py --check
      - name: Sandbox evidence gate tests
        run: python3 -m unittest tools.test_binance_testnet_acceptance
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web console syntax and interaction contracts
        run: |
          node --check web/console/app.js
          node --test web/console/*.test.js

  architecture-shards:
    name: Architecture invariants (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run architecture gate shard
        run: python3 tools/check_architecture.py --shard "${{ matrix.shard }}/4" --report "target/architecture-shards/shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-shard-${{ matrix.shard }}
          path: target/architecture-shards/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  architecture-aggregate:
    name: Architecture invariants aggregate
    runs-on: ubuntu-latest
    needs: architecture-shards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: architecture-shard-*
          path: target/architecture-shards
          merge-multiple: true
      - name: Verify complete architecture gate coverage
        run: python3 tools/verify_architecture_shards.py target/architecture-shards 4

  performance-trend:
    name: Blocking registered performance regressions
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: performance-${{ runner.os }}-${{ runner.arch }}
      - name: Build release CLI
        run: cargo build --release -p qx-cli
      - name: Measure frozen real-data backtest under Linux resource quotas
        shell: bash
        run: |
          mkdir -p benchmarks/results
          image=ubuntu:24.04
          docker pull "$image"
          image_id=$(docker image inspect --format='{{.Id}}' "$image")
          docker run --rm \
            --cpus=2 \
            --memory=8g \
            --memory-swap=8g \
            --env CONTAINER_RUNTIME=docker \
            --env "CONTAINER_IMAGE=$image@$image_id" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace \
            "$image" \
            bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-psutil ca-certificates
              python3 benchmarks/run_real_data_backtest.py \
                --binary target/release/qx-cli \
                --bars maturity/fixtures/binance-btcusdt-spot-15m-180d-2026-11-11.json \
                --spec-template benchmarks/fixtures/binance-btcusdt-spot-15m-backtest.json \
                --repeats 7 \
                --out benchmarks/results/linux-resource-bounded-real-data.json
            '
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("benchmarks/results/linux-resource-bounded-real-data.json").read_text())
          context = report["runtime_context"]
          assert context["cgroup_cpu_limit_count"] == 2.0, context
          assert context["cgroup_memory_limit_bytes"] == 8 * 1024**3, context
          assert report["deterministic_across_repeats"] is True, report
          print("Observed 2 CPU quota, 8 GiB memory quota, and stable real-data results.")
          PY
      - name: Measure end-to-end and kernel performance
        run: |
          python3 benchmarks/run_baseline.py \
            --binary target/release/qx-cli \
            --out benchmarks/results/end-to-end.json --json --repeats 7
          python3 benchmarks/run_rust_bench.py \
            --out benchmarks/results/rust-micro.json
          python3 benchmarks/run_ashare_profile_backtest.py \
            --binary target/release/qx-cli \
            --out benchmarks/results/ashare-rules-on.json --repeats 7
          python3 benchmarks/run_crypto_paper_e2e.py \
            --binary target/release/qx-cli \
            --out benchmarks/results/crypto-paper-e2e.json --repeats 7
      - name: Find the latest successful main benchmark artifact
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for branch in main "$BASELINE_BRANCH"; do
            run_ids=$(gh run list --branch "$branch" --workflow ci.yml --limit 20 \
              --json databaseId,conclusion \
              --jq '.[] | select(.conclusion == "success") | .databaseId')
            for run_id in $run_ids; do
              artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
                --jq '[.artifacts[] | select(.name == "performance-baseline" and .expired == false)][0].id // empty')
              if [[ -n "$artifact_id" ]]; then
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "Selected retained performance baseline from $branch run $run_id."
                exit 0
              fi
            done
          done
          echo "run_id=" >> "$GITHUB_OUTPUT"
          echo "No successful main run has a retained performance-baseline artifact; this run will seed one."
      - name: Download the previous benchmark artifact
        if: steps.previous.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.previous.outputs.run_id }}" \
            --name performance-baseline --dir benchmarks/results/previous
      - name: Block registered regressions above ledger thresholds
        run: |
          if [[ -f benchmarks/results/previous/end-to-end.json ]]; then
            python3 benchmarks/compare_baseline.py \
              benchmarks/results/previous/end-to-end.json \
              benchmarks/results/end-to-end.json \
              --targets maturity/targets.yaml
          else
            echo "No previous compatible end-to-end baseline; recording first sample."
          fi
          if [[ -f benchmarks/results/previous/rust-micro.json ]]; then
            python3 benchmarks/compare_baseline.py \
              benchmarks/results/previous/rust-micro.json \
              benchmarks/results/rust-micro.json \
              --targets maturity/targets.yaml
          else
            echo "No previous compatible Rust microbenchmark baseline; recording first sample."
          fi
          if [[ -f benchmarks/results/previous/ashare-rules-on.json ]]; then
            python3 benchmarks/compare_baseline.py \
              benchmarks/results/previous/ashare-rules-on.json \
              benchmarks/results/ashare-rules-on.json \
              --targets maturity/targets.yaml
          else
            echo "No previous compatible A-share rules-on baseline; recording first sample."
          fi
          if [[ -f benchmarks/results/previous/crypto-paper-e2e.json ]]; then
            python3 benchmarks/compare_baseline.py \
              benchmarks/results/previous/crypto-paper-e2e.json \
              benchmarks/results/crypto-paper-e2e.json \
              --targets maturity/targets.yaml
          else
            echo "No previous compatible crypto Paper E2E baseline; recording first sample."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: |
            benchmarks/results/end-to-end.json
            benchmarks/results/rust-micro.json
            benchmarks/results/ashare-rules-on.json
            benchmarks/results/crypto-paper-e2e.json
            benchmarks/results/linux-resource-bounded-real-data.json
          if-no-files-found: error
          retention-days: 30

  python-wheel:
    name: Python wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 腿补齐 V10 §4.16：`tools/build_python_wheel.sh` 早已按 Darwin 走
        # `.so` 导入后缀，缺的只是 CI 从没在这条平台上跑过 wheel。
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: wheel-${{ matrix.os }}-py${{ matrix.python }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install TOML parser for Python 3.10 tests
        if: matrix.python == '3.10'
        run: python -m pip install tomli
      - name: Build native extension and wheel
        shell: bash
        env:
          PYTHON: python
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel maturin
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File tools/build_python_wheel.ps1 -Python python
          else
            bash tools/build_python_wheel.sh
          fi
          python -m pip install --quiet dist/*.whl
      - name: Check stable-ABI wheel tag and native payload
        run: python tools/check_python_wheel.py dist
      - name: Import the installed wheel outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          python - <<'PY'
          import qianxing_bridge
          from qianxing_bridge import native
          import qianxing

          assert qianxing_bridge.__file__.startswith("site-packages") or "site-packages" in qianxing_bridge.__file__, (
              f"wheel import resolved outside site-packages: {qianxing_bridge.__file__}"
          )
          assert native.available(), "native extension missing from the installed wheel"
          assert "backtest.bar.v1" in qianxing.doctor()["implemented_use_cases"]
          payload = (
              '{"instrument":"BTCUSDT.BINANCE","source":"native","ts":[1,2],'
              '"open_raw":[100,101],"high_raw":[102,103],"low_raw":[99,100],'
              '"close_raw":[101,102],"volume_raw":[10,11]}'
          )
          assert native.frame_digest(payload) > 0
          from qianxing_bridge import BarFrame

          frame = BarFrame(
              "BTCUSDT.BINANCE",
              "native",
              (1, 2),
              (100, 101),
              (102, 103),
              (99, 100),
              (101, 102),
              (10, 11),
          )
          assert native.frame_digest(payload) == frame.digest(), "wheel native diverges from pure Python digest"
          PY
      - name: Expose the installed native module to source contract tests
        shell: bash
        run: |
          python - <<'PY'
          import importlib.machinery
          import shutil
          import sysconfig
          from pathlib import Path

          installed_roots = {
              Path(sysconfig.get_paths()[key]) / "qianxing_bridge"
              for key in ("purelib", "platlib")
          }
          suffixes = tuple(importlib.machinery.EXTENSION_SUFFIXES)
          extensions = [
              candidate
              for root in installed_roots
              if root.is_dir()
              for candidate in root.glob("_qianxing_native*")
              if candidate.name.endswith(suffixes)
          ]
          if len(extensions) != 1:
              raise SystemExit(f"expected one installed native extension, found {extensions}")
          shutil.copy2(extensions[0], Path("python/qianxing_bridge") / extensions[0].name)
          PY
      - name: Python suite against the built extension
        shell: bash
        run: |
          python -m pip install --quiet jsonschema tomli tzdata pytest
          python -m unittest discover -s python/tests -q
      - name: POSIX strategy preflight descendant cleanup (R04)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R04-AC01
          --input tools/accept_strategy_process_tree.py
          --input python/qianxing/process_tree.py
          --notes "Linux preflight cleanup after normal return and timeout, plus explicit verification that a new-session child escapes process-group ownership and is then reaped by the acceptance fixture"
          -- python3 tools/accept_strategy_process_tree.py
          --output maturity/evidence/strategy-preflight-process-tree-linux.json
      - name: Linux project-run PID identity and stale-owner detection (R07)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R07-AC01
          --input tools/accept_project_run_identity.py
          --input python/qianxing/project_runs.py
          --notes "Native Linux /proc identity is stable for a live PID, rejects a stale process-start identity, and reports the reaped owner as dead"
          -- python3 tools/accept_project_run_identity.py
          maturity/evidence/project-run-identity-linux.json
      - name: Linux Python host capability negotiation (R08)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R08-AC01
          --input python/qianxing_strategy/worker.py
          --input python/tests/test_strategy_capabilities.py
          --notes "Linux Python strategy host accepts compatible manifests and rejects malformed, duplicate, unknown, or unsupported capability requirements before construction"
          -- python3 -m unittest discover -s python/tests -p test_strategy_capabilities.py
      - name: macOS proc_pidinfo and ps fallback acceptance (R07)
        if: matrix.os == 'macos-latest' && matrix.python == '3.12'
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R07-AC01
          --input tools/accept_project_run_identity.py
          --input python/qianxing/project_runs.py
          --notes "Native macOS proc_pidinfo verifies microsecond process-start precision, the real ps fallback reports one-second precision, and both paths reject stale process identities"
          -- python3 tools/accept_project_run_identity.py
          maturity/evidence/project-run-identity-macos.json
      - name: macOS backtest metrics and report contract (R17)
        if: matrix.os == 'macos-latest' && matrix.python == '3.12'
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R17-AC01
          --input tools/accept_backtest_metrics_contract.py
          --input crates/qx-core/src/performance.rs
          --input crates/qx-app/src/artifact_store/backtest_summary.rs
          --input crates/qx-cli/src/report_html.rs
          --input crates/qx-cli/src/report_xlsx/rows.rs
          --notes "macOS focused Rust metric and report projections preserve daily labels and exact large-value precision"
          -- python3 tools/accept_backtest_metrics_contract.py
      - name: macOS qx-cli behavior and ownership tests (R19)
        if: matrix.os == 'macos-latest' && matrix.python == '3.12'
        run: |
          cargo clean -p qx-cli
          cargo build --locked -p qx-cli
          python3 tools/record_strategy_acceptance.py \
            --acceptance-id R19-AC01 \
            --input crates/qx-cli/src/cli.rs \
            --input crates/qx-cli/src/cli_command_manifest.json \
            --input crates/qx-cli/tests/cli_behavior_parity.rs \
            --input crates/qx-cli/tests/cli_behavior_parity/report_metrics_projection.rs \
            --notes "macOS qx-cli unit suite verifies CLI facade routing and compatibility" \
            -- cargo test -p qx-cli --bin qx-cli -- --test-threads=1
      - name: macOS qx-cli behavior parity (R19)
        if: matrix.os == 'macos-latest' && matrix.python == '3.12'
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R19-AC01
          --input crates/qx-cli/tests/cli_behavior_parity.rs
          --input crates/qx-cli/tests/cli_behavior_parity/report_metrics_projection.rs
          --notes "macOS CLI behavior-parity integration target preserves report and facade compatibility"
          -- cargo test -p qx-cli --test cli_behavior_parity -- --test-threads=1
      - name: Clean Linux wheel and CLI acceptance (R01 + R20)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -type f -name 'qianxing-*.whl' -print -quit)"
          test -n "$wheel"
          cargo fetch --locked
          python3 tools/record_strategy_acceptance.py \
            --acceptance-id R01-AC01 \
            --input tools/accept_clean_install.py \
            --input python/tests/test_app_use_cases.py \
            --notes "Clean Linux Python 3.12 wheel/CLI install; doctor verifies native/CLI schema match and quickstart/example execution" \
            -- python3 tools/accept_clean_install.py \
            --python "$(command -v python)" \
            --work-dir "${RUNNER_TEMP}/qx-clean-install-r01" \
            --wheel "$wheel"
          python3 tools/record_strategy_acceptance.py \
            --acceptance-id R20-AC01 \
            --input tools/accept_clean_install.py \
            --input docs/installation.md \
            --notes "Clean Linux Python 3.12 wheel/CLI install; package imports, capability catalog, schemas, documented examples, and quickstart" \
            -- python3 tools/accept_clean_install.py \
            --python "$(command -v python)" \
            --work-dir "${RUNNER_TEMP}/qx-clean-install-r20" \
            --wheel "$wheel"
      - name: Upload Linux clean-install acceptance evidence
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: clean-install-acceptance-linux-py312
          path: |
            maturity/strategy-run-acceptance-v1.json
            maturity/acceptance-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Linux process-tree acceptance evidence
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: process-tree-acceptance-linux-py312
          path: |
            maturity/strategy-run-acceptance-v1.json
            maturity/acceptance-artifacts/
            maturity/evidence/strategy-preflight-process-tree-linux.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Linux process-identity acceptance evidence
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: process-identity-acceptance-linux-py312
          path: |
            maturity/strategy-run-acceptance-v1.json
            maturity/acceptance-artifacts/
            maturity/evidence/project-run-identity-linux.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload macOS process-identity acceptance evidence
        if: always() && matrix.os == 'macos-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: process-identity-acceptance-macos-py312
          path: |
            maturity/strategy-run-acceptance-v1.json
            maturity/acceptance-artifacts/
            maturity/evidence/project-run-identity-macos.json
          if-no-files-found: error
          retention-days: 30

  feature-matrix:
    name: qx-cli features (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - sqlite
          - postgres
          - nats
          - postgres,nats
          - sqlite,bench-prepared-evaluation
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-${{ runner.os }}-${{ strategy.job-index }}
      # 只在某些 feature 分支里才存在的代码不会被默认特性的 Clippy 看到，
      # 因此每个特性组合都要单独跑一次 lint，而不是只做 check/test。
      - name: Lint feature build
        run: cargo clippy -p qx-cli --no-default-features --features "${{ matrix.features }}" --all-targets -- -D warnings
      - name: Check feature build
        run: cargo check -p qx-cli --no-default-features --features "${{ matrix.features }}"
      - name: Test feature build
        run: cargo test -p qx-cli --no-default-features --features "${{ matrix.features }}"

  feature-off:
    name: Feature-off lint (no backend features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-off
      # 与上面那条矩阵互补：矩阵逐组合点亮「特性打开」的分支，这里补上「特性全关」的另一半。
      # `#[cfg(not(feature = "sqlite"))]` 那半边的代码在 workspace 构建里从不被 clippy 看到
      # （`qx-cli` 的 `default = ["sqlite"]` 经转发把 `qx-runtime/sqlite` 一并打开），
      # 于是那几行改坏只会在运行期才炸。§17.11 把这缺口登记为「未擅自改流水线」，
      # V13 R28 按登记补上：本机四条腿现跑各 rc 0 / 诊断 0 行。
      - name: Clippy with no backend features
        run: >-
          cargo clippy -p qx-runtime -p qx-storage -p qx-api -p qx-service -p qx-cli -p qx-python
          --no-default-features --all-targets -- -D warnings
      - name: Check with no backend features
        run: >-
          cargo check -p qx-runtime -p qx-storage -p qx-api -p qx-service -p qx-cli -p qx-python
          --no-default-features --all-targets

  service-backends:
    name: Backend service contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qianxing
          POSTGRES_DB: qianxing_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qianxing_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QX_TEST_POSTGRES_DSN: postgres://postgres:qianxing@127.0.0.1:5432/qianxing_contract
      QX_TEST_NATS_URL: nats://127.0.0.1:4222
      QX_TEST_NATS_SUBJECT_PREFIX: qianxing.acceptance
    steps:
      - uses: actions/checkout@v4
      - name: Start JetStream NATS service
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name qx-nats -p 4222:4222 nats:2.10-alpine -js -sd /tmp/jetstream
          python3 - <<'PY'
          import json
          import socket
          import time

          for attempt in range(30):
              try:
                  with socket.create_connection(("127.0.0.1", 4222), timeout=1) as connection:
                      connection.settimeout(1)
                      greeting = connection.makefile("rb").readline()
                  if not greeting.startswith(b"INFO "):
                      raise OSError("NATS did not return its protocol greeting")
                  if json.loads(greeting[5:]).get("jetstream") is True:
                      break
                  raise OSError("NATS is ready without JetStream")
              except (OSError, json.JSONDecodeError):
                  if attempt == 29:
                      raise SystemExit("JetStream NATS did not become ready within 30 attempts")
                  time.sleep(1)
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: service-backends
      - name: Ignored storage contracts (PostgreSQL + NATS JetStream)
        run: >-
          cargo test -p qx-storage --features sqlite,postgres,nats --
          --ignored --test-threads=1 --nocapture
      - name: Live Unknown recovery across file, SQLite, and PostgreSQL process restarts
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R12-AC01
          --input crates/qx-cli/src/workers/strategy_worker/prepared_command_replay.rs
          --input crates/qx-service/src/configured_backends.rs
          --input crates/qx-storage/src/postgres.rs
          --notes "Linux worker recovery after durable Unknown across file, SQLite, and PostgreSQL; cursor remains fixed until venue facts and fresh reconciliation resolve the command"
          -- cargo test -p qx-cli --features sqlite,postgres --bin qx-cli
          workers::strategy_worker::prepared_command_replay::tests::live_unknown_recovery_survives_real_file_sqlite_and_postgres_process_restarts
          -- --nocapture
      - name: PostgreSQL strategy cursor import and fencing
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R13-AC01
          --input crates/qx-cli/src/workers/strategy_worker/execution_updates/cursor_state.rs
          --input crates/qx-storage/src/postgres.rs
          --notes "PostgreSQL strategy cursor imports a legacy file cursor, persists sequence advancement transactionally, reloads it, and rejects stale progress"
          -- cargo test -p qx-cli --features sqlite,postgres --bin qx-cli
          workers::strategy_worker::execution_updates::cursor_state::postgres_tests::postgres_cursor_imports_legacy_file_and_fences_stale_progress
          -- --ignored --exact --nocapture
      - name: PostgreSQL immutable deployment blob contract
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R13-AC01
          --input crates/qx-storage/src/postgres.rs
          --input crates/qx-storage/migrations/postgres/0004_schema.sql
          --input crates/qx-runtime/src/strategy_deployment_store.rs
          --notes "PostgreSQL deployment blobs verify SHA-256 keys, persist and reload immutable BYTEA content, and reject a conflicting rewrite"
          -- cargo test -p qx-storage --features postgres --lib
          postgres::json_state_tests::postgres_deployment_blobs_are_immutable_and_content_addressable
          -- --ignored --exact --nocapture
      - name: PostgreSQL deployment blob runtime cache recovery
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R13-AC01
          --input crates/qx-runtime/src/strategy_deployment_store.rs
          --input crates/qx-storage/src/postgres.rs
          --notes "PostgreSQL deployment blobs are hash-verified and rehydrated into an immutable runtime cache"
          -- cargo test -p qx-runtime --features postgres
          strategy_deployment_store::artifact_cache_tests::postgres_deployment_blob_rehydrates_into_verified_runtime_cache
          -- --ignored --exact --nocapture
      # 上一条腿只跑 `--ignored`，而这 8 颗 NATS 用例没有 `#[ignore]`：默认腿 `cargo test --workspace`
      # 走默认特性（`qx-cli` 的 default 只有 sqlite），整段 `#[cfg(feature = "nats")]` 被 cfg 掉；
      # 特性矩阵那条腿是 `-p qx-cli`，cargo 不会为依赖 crate 构建它自己的测试目标。
      # 三者相加，这批「有界等待 / 预算 / 空配置拒连」的判据在 CI 里一个执行者都没有——
      # 改回裸 `block_on` 会一路绿到生产。这条腿就是它们唯一的执行者。
      - name: NATS adapter contracts (non-ignored)
        run: >-
          cargo test -p qx-storage --features sqlite,postgres,nats --no-fail-fast
          --test nats_jetstream --test nats_wait_budget

  strategy-storage-recovery:
    name: Strategy durable storage and recovery (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qianxing
          POSTGRES_DB: qianxing_strategy_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qianxing_strategy_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QX_BENCH_POSTGRES_DSN: postgres://postgres:qianxing@127.0.0.1:5432/qianxing_strategy_acceptance
      QX_TEST_POSTGRES_DSN: postgres://postgres:qianxing@127.0.0.1:5432/qianxing_strategy_acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: strategy-storage-recovery-${{ runner.os }}-${{ runner.arch }}
      - name: Install PostgreSQL client and OpenSSL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client openssl
      - name: Build CLI with all durable backends and recovery hooks
        run: cargo build -p qx-cli --no-default-features --features sqlite,postgres,bench-prepared-evaluation
      - name: PostgreSQL Paper deployment lifecycle on Linux
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R13-AC01
          --input tools/accept_strategy_deployment_lifecycle.py
          --input tools/check_strategy_deployment_lifecycle_evidence.py
          --input crates/qx-orchestrator/src/strategy_deployment.rs
          --input crates/qx-storage/src/postgres.rs
          --input crates/qx-runtime/src/strategy_deployment_store.rs
          --notes "Linux PostgreSQL Paper lifecycle: deploy, pause/resume, rollback, failed replacement restoration, and stop through the authenticated console and real supervisor"
          -- python3 tools/accept_strategy_deployment_lifecycle.py
          --binary target/debug/qx-cli
          --runtime-template deploy/qianxing.runtime.paper-strategy.example.json
          --openssl /usr/bin/openssl
          --storage-backend postgres
          --evidence-out maturity/evidence/r13-strategy-deployment-lifecycle-linux-postgres.json
      - name: Validate PostgreSQL deployment lifecycle evidence
        run: >-
          python3 tools/check_strategy_deployment_lifecycle_evidence.py
          maturity/evidence/r13-strategy-deployment-lifecycle-linux-postgres.json
          --storage-backend postgres
      - name: PostgreSQL Paper supervisor restart with Python checkpoint on Linux
        run: >-
          python3 tools/record_strategy_acceptance.py
          --acceptance-id R13-AC01
          --input tools/accept_strategy_deployment_lifecycle.py
          --input tools/check_strategy_deployment_lifecycle_evidence.py
          --input crates/qx-orchestrator/src/lib.rs
          --input crates/qx-runtime/src/supervision/shutdown.rs
          --input python/tests/fixtures/runtime_checkpoint_process_strategy.py
          --notes "Linux PostgreSQL Paper supervisor restart commits and restores a Python strategy checkpoint across supervisor and worker PID changes with clean stdin EOF shutdown"
          -- python3 tools/accept_strategy_deployment_lifecycle.py
          --binary target/debug/qx-cli
          --runtime-template deploy/qianxing.runtime.paper-strategy.example.json
          --openssl /usr/bin/openssl
          --storage-backend postgres
          --evidence-out maturity/evidence/r13-strategy-deployment-lifecycle-linux-postgres-checkpoint-restart.json
      - name: Validate Linux supervisor checkpoint restart evidence
        run: >-
          python3 tools/check_strategy_deployment_lifecycle_evidence.py
          maturity/evidence/r13-strategy-deployment-lifecycle-linux-postgres-checkpoint-restart.json
          --storage-backend postgres
      - name: Verify 4,096-entry JobQueue capacity on file, SQLite, and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for backend in file sqlite postgres; do
            python3 tools/record_strategy_acceptance.py \
              --acceptance-id R21-AC01 \
              --input benchmarks/run_prepared_evaluation_capacity.py \
              --input crates/qx-storage/src/postgres.rs \
              --notes "Linux durable JobQueue capacity: ${backend}; 4096 pending limit, overflow rejection, owner batch and acknowledgement" \
              -- python3 benchmarks/run_prepared_evaluation_capacity.py \
              --binary target/debug/qx-cli \
              --queue-only --queue-backend "$backend" --queue-capacity 4096 \
              --out "maturity/evidence/job-queue-capacity-linux-${backend}.json"
          done
      - name: Verify 4,096-entry ControlCommandQueue capacity on file, SQLite, and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for backend in file sqlite postgres; do
            python3 tools/record_strategy_acceptance.py \
              --acceptance-id R21-AC01 \
              --input benchmarks/run_prepared_evaluation_capacity.py \
              --input crates/qx-storage/src/postgres.rs \
              --input crates/qx-storage/src/control_queue.rs \
              --notes "Linux ControlCommandQueue capacity: ${backend}; 4096 pending limit, overflow and oversized rejection, acknowledgement" \
              -- python3 benchmarks/run_prepared_evaluation_capacity.py \
              --binary target/debug/qx-cli \
              --control-queue-only --queue-backend "$backend" --queue-capacity 4096 \
              --out "maturity/evidence/control-command-queue-capacity-linux-${backend}.json"
          done
      - name: Verify six worker crash boundaries on file, SQLite, and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for backend in file sqlite postgres; do
            python3 tools/record_strategy_acceptance.py \
              --acceptance-id R21-AC01 \
              --input benchmarks/run_strategy_worker_crash_recovery.py \
              --input crates/qx-cli/src/workers/strategy_worker.rs \
              --input crates/qx-storage/src/postgres.rs \
              --notes "Linux Paper Strategy worker crash/restart: ${backend}; six persistence boundaries and idempotent recovery" \
              -- python3 benchmarks/run_strategy_worker_crash_recovery.py \
              --backend "$backend" \
              --runtime deploy/qianxing.runtime.paper-strategy.example.json \
              --binary target/debug/qx-cli \
              --output "maturity/evidence/strategy-worker-crash-recovery-linux-${backend}.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-storage-recovery-linux
          path: |
            maturity/evidence/*-linux-*.json
            maturity/strategy-run-acceptance-v1.json
            maturity/acceptance-artifacts/
          if-no-files-found: error
          retention-days: 30

  runtime-contracts:
    name: Runtime and Paper contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate baseline runtime config
        run: cargo run -p qx-cli --features sqlite,postgres -- runtime-check deploy/qianxing.runtime.example.json
      - name: Validate user-facing CLI diagnostics
        run: |
          cargo run -p qx-cli --features sqlite,postgres -- doctor deploy/qianxing.runtime.example.json
          cargo run -p qx-cli --features sqlite,postgres -- config validate deploy/qianxing.runtime.example.json
          cargo run -p qx-cli --features sqlite,postgres -- config explain deploy/qianxing.runtime.example.json --json > /tmp/qianxing-config.json
          python3 -c "import json; json.load(open('/tmp/qianxing-config.json'))"
          cargo run -p qx-cli --features sqlite,postgres -- status deploy/qianxing.runtime.example.json --json > /tmp/qianxing-status.json
          python3 -c "import json; json.load(open('/tmp/qianxing-status.json'))"
          cargo run -p qx-cli --features sqlite,postgres -- runtime-check deploy/qianxing.runtime.example.json --json > /tmp/qianxing-runtime-check.json
          python3 -c "import json; value=json.load(open('/tmp/qianxing-runtime-check.json')); assert value['ok']; assert value['network_accessed'] is False; assert value['orders_sent'] is False"
          set +e
          cargo run -p qx-cli --features sqlite,postgres -- live-check deploy/qianxing.runtime.production.example.json --json > /tmp/qianxing-live-check.json
          status=$?
          set -e
          test "$status" -ne 0
          python3 -c "import json; value=json.load(open('/tmp/qianxing-live-check.json')); assert value['ok'] is False; assert value['network_accessed'] is False; assert value['orders_sent'] is False; assert value['failures']"
      - name: Validate Paper strategy runtime config
        run: cargo run -p qx-cli --features sqlite,postgres -- runtime-check deploy/qianxing.runtime.paper-strategy.example.json
      - name: Validate all non-production runtime examples
        shell: bash
        run: |
          set -euo pipefail
          for config in deploy/qianxing.runtime*.json; do
            case "$config" in
              *production.example.json|*binance-testnet.example.json|*ccxt.example.json|*multi-venue-arbitrage.example.json|*multi-venue-contract.example.json)
                continue
                ;;
            esac
            cargo run -p qx-cli --features sqlite,postgres -- runtime-check "$config"
          done
      - name: Verify unprovisioned venue examples remain fail closed
        shell: bash
        run: |
          set -euo pipefail
          for example in binance-testnet ccxt multi-venue-arbitrage multi-venue-contract; do
            report="/tmp/qianxing-${example}-runtime-check.json"
            set +e
            cargo run -p qx-cli --features sqlite,postgres -- \
              runtime-check "deploy/qianxing.runtime.${example}.example.json" --json > "$report"
            status=$?
            set -e
            test "$status" -ne 0
            python3 - "$report" "$example" <<'PY'
          import json
          import sys

          expected_signer_failure_counts = {
              "binance-testnet": 1,
              "ccxt": 1,
              "multi-venue-arbitrage": 2,
              "multi-venue-contract": 2,
          }
          expected_capability_failure_counts = {
              "binance-testnet": 0,
              "ccxt": 0,
              "multi-venue-arbitrage": 1,
              "multi-venue-contract": 0,
          }
          with open(sys.argv[1], encoding="utf-8") as report_file:
              report = json.load(report_file)
          failures = report["failures"]
          signer_failures = [
              failure for failure in failures
              if "FAIL_CLOSED" in failure and "签名角色目录" in failure
          ]
          capability_failures = [
              failure for failure in failures
              if "multi_instrument" in failure
          ]
          assert report["ok"] is False
          assert len(signer_failures) == expected_signer_failure_counts[sys.argv[2]], failures
          assert len(capability_failures) == expected_capability_failure_counts[sys.argv[2]], failures
          assert len(failures) == len(signer_failures) + len(capability_failures), failures
          assert report.get("network_accessed", False) is False
          assert report.get("orders_sent", False) is False
          PY
          done
      - name: Verify production config remains fail closed
        shell: bash
        run: |
          set -euo pipefail
          if cargo run -p qx-cli --features sqlite,postgres -- runtime-check deploy/qianxing.runtime.production.example.json; then
            echo "production placeholder config unexpectedly passed runtime-check"
            exit 1
          fi
      - name: Paper process-boundary E2E
        run: cargo run -p qx-cli --features sqlite,postgres -- paper-e2e deploy/qianxing.runtime.paper-strategy.example.json

  cpp-sdk:
    name: C++ SDK smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install C++ JSON dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
      - name: Configure C++ SDK
        run: cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release -DQX_BUILD_JSONL_EXAMPLE=ON
      - name: Build C++ SDK smoke
        run: cmake --build build/cpp --config Release --parallel
      - name: Run C++ SDK contract tests
        run: ctest --test-dir build/cpp -C Release --output-on-failure
      - name: Install and consume the exported CMake package
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build/cpp --prefix "$PWD/build/cpp-sdk-install"
          cmake -S cpp/tests/consumer -B build/cpp-consumer \
            -DCMAKE_PREFIX_PATH="$PWD/build/cpp-sdk-install"
          cmake --build build/cpp-consumer --config Release --parallel
          ctest --test-dir build/cpp-consumer -C Release --output-on-failure
      - name: Locate built binaries
        id: binaries
        shell: bash
        run: |
          set -euo pipefail
          find_binary() {
            local found
            found="$(find build/cpp -type f \( -name "$1" -o -name "$1.exe" \) -print -quit)"
            if [[ -z "${found}" ]]; then
              echo "expected binary $1 was not produced" >&2
              exit 1
            fi
            printf '%s\n' "${GITHUB_WORKSPACE}/${found}"
          }
          find_plugin() {
            local found
            found="$(find build/cpp -type f \( -name 'libqianxing_strategy_example.so' -o -name 'libqianxing_strategy_example.dylib' -o -name 'qianxing_strategy_example.dll' \) -print -quit)"
            if [[ -z "${found}" ]]; then
              echo "expected C ABI strategy plugin was not produced" >&2
              exit 1
            fi
            printf '%s\n' "${GITHUB_WORKSPACE}/${found}"
          }
          {
            echo "smoke=$(find_binary qianxing_ring_smoke)"
            echo "app_client=$(find_binary qianxing_app_client_smoke)"
            echo "strategy=$(find_binary qianxing_strategy_jsonl)"
            echo "plugin=$(find_plugin)"
          } >> "${GITHUB_OUTPUT}"
      - name: Run C++ ring smoke
        shell: bash
        env:
          SMOKE: ${{ steps.binaries.outputs.smoke }}
        run: '"${SMOKE}"'
      - name: Run C++ application client smoke
        shell: bash
        env:
          APP_CLIENT: ${{ steps.binaries.outputs.app_client }}
        run: '"${APP_CLIENT}"'
      - name: Load C++ strategy in the Rust C ABI host
        shell: bash
        env:
          QX_CPP_STRATEGY_LIBRARY: ${{ steps.binaries.outputs.plugin }}
        run: cargo test -p qx-strategy --test cpp_plugin_host -- --ignored --exact loads_and_runs_cpp_strategy_through_the_rust_c_abi_host --nocapture
      - name: Run C++ JSONL strategy contract smoke
        shell: bash
        env:
          STRATEGY: ${{ steps.binaries.outputs.strategy }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"schema_version":1,"request_id":"ci-request-1","strategy_id":"ci-strategy","strategy_version":"v1","data_fingerprint":"bars-ci","as_of":10,"instrument":"BTCUSDT.BINANCE","research_targets":{"BTCUSDT.BINANCE":3}}' \
            | "${STRATEGY}" > response.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('response.jsonl').read_text(encoding='utf-8'))
          assert value['ok'] is True
          output = value['output']
          assert output['request_id'] == 'ci-request-1'
          assert output['strategy_id'] == 'ci-strategy'
          assert output['instrument'] == 'BTCUSDT.BINANCE'
          assert output['target_qty'] == 3
          PY
      - name: Run C++ worker through the shared-memory ring (JSON and columnar)
        shell: bash
        env:
          STRATEGY: ${{ steps.binaries.outputs.strategy }}
        run: |
          set -euo pipefail
          for protocol in shared_memory_json shared_memory_columnar; do
            echo "== ${protocol} =="
            python tools/verify_cpp_worker.py "${STRATEGY}" "${protocol}"
          done

  venue-acceptance:
    name: Venue acceptance (Binance testnet)
    runs-on: ubuntu-latest
    env:
      QX_BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
      QX_BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: venue-acceptance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build qx-cli
        run: cargo build -p qx-cli --features sqlite,postgres
      - name: Fail-closed offline checks (always run)
        run: python tools/binance_testnet_acceptance.py --binary target/debug/qx-cli --allow-skip
      - name: Full testnet acceptance (only when credentials exist)
        if: env.QX_BINANCE_TESTNET_API_KEY != ''
        run: python tools/binance_testnet_acceptance.py --binary target/debug/qx-cli
