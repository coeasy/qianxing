name: One-shot projected risk refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/risk-refactor.yml

permissions:
  contents: write

jobs:
  patch-risk-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact risk refactor
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/qx-zhenlu/src/lib.rs")
          source = path.read_text(encoding="utf-8")

          old_context = '''impl RiskContext {
              pub fn validate_order(&self, order: &Order, position: &PositionSnapshot) -> QxResult<()> {
                  order.validate().map_err(QxError::BusinessViolation)?;
                  let Some(spec) = self.instrument_spec.as_ref() else {
                      if self.available_margin_raw.is_some()
                          || self.max_order_notional_raw.is_some()
                          || self.max_position_notional_raw.is_some()
                      {
                          return Err(QxError::BusinessViolation(
                              "账户级 RiskContext 缺少 TradingInstrumentSpec".into(),
                          ));
                      }
                      return Ok(());
                  };
                  if order.instrument != spec.instrument {
                      return Err(QxError::BusinessViolation(
                          "订单标的与 RiskContext TradingInstrumentSpec 不一致".into(),
                      ));
                  }
                  let policy = order.policy.unwrap_or_default();
                  policy.validate_for(spec)?;
                  spec.validate_order(order.qty.raw(), order.limit.map(|price| price.raw()))?;
                  let price = order
                      .limit
                      .or(self.reference_price)
                      .ok_or_else(|| QxError::BusinessViolation("账户级风控缺少市价参考价".into()))?;
                  let notional = spec.notional(order.qty.raw(), price.raw())?;
                  if self
                      .max_order_notional_raw
                      .is_some_and(|limit| notional > limit)
                  {
                      return Err(QxError::BusinessViolation("订单名义额超过账户限额".into()));
                  }
                  if self
                      .max_position_notional_raw
                      .is_some_and(|limit| position.gross_notional.saturating_add(notional) > limit)
                  {
                      return Err(QxError::BusinessViolation("持仓名义额超过账户限额".into()));
                  }
                  if let Some(available) = self.available_margin_raw {
                      if available < 0 {
                          return Err(QxError::BusinessViolation("可用保证金不能为负".into()));
                      }
                      if !policy.reduce_only {
                          let required =
                              spec.initial_margin(order.qty.raw(), price.raw(), policy.leverage)?;
                          if required > available {
                              return Err(QxError::BusinessViolation(
                                  "订单初始保证金超过账户可用保证金".into(),
                              ));
                          }
                      }
                  }
                  Ok(())
              }
          }'''

          new_context = '''impl RiskContext {
              pub fn validate_order(&self, order: &Order, position: &PositionSnapshot) -> QxResult<()> {
                  order.validate().map_err(QxError::BusinessViolation)?;
                  let Some(spec) = self.instrument_spec.as_ref() else {
                      if self.available_margin_raw.is_some()
                          || self.max_order_notional_raw.is_some()
                          || self.max_position_notional_raw.is_some()
                      {
                          return Err(QxError::BusinessViolation(
                              "账户级 RiskContext 缺少 TradingInstrumentSpec".into(),
                          ));
                      }
                      return Ok(());
                  };
                  if order.instrument != spec.instrument {
                      return Err(QxError::BusinessViolation(
                          "订单标的与 RiskContext TradingInstrumentSpec 不一致".into(),
                      ));
                  }
                  let policy = order.policy.unwrap_or_default();
                  policy.validate_for(spec)?;
                  spec.validate_order(order.qty.raw(), order.limit.map(|price| price.raw()))?;
                  let price = order
                      .limit
                      .or(self.reference_price)
                      .ok_or_else(|| QxError::BusinessViolation("账户级风控缺少市价参考价".into()))?;
                  let notional = spec.notional(order.qty.raw(), price.raw())?;
                  if self
                      .max_order_notional_raw
                      .is_some_and(|limit| notional > limit)
                  {
                      return Err(QxError::BusinessViolation("订单名义额超过账户限额".into()));
                  }

                  let signed_delta = match order.side {
                      Side::Buy => order.qty.raw(),
                      Side::Sell => order
                          .qty
                          .raw()
                          .checked_neg()
                          .ok_or_else(|| QxError::Invariant("订单数量取反溢出".into()))?,
                  };
                  let projected_net_qty = position
                      .net_qty
                      .checked_add(signed_delta)
                      .ok_or_else(|| QxError::Invariant("投影持仓数量溢出".into()))?;

                  if policy.reduce_only {
                      let current_abs = position
                          .net_qty
                          .checked_abs()
                          .ok_or_else(|| QxError::Invariant("当前持仓绝对值溢出".into()))?;
                      let reduces_direction = (position.net_qty > 0 && order.side == Side::Sell)
                          || (position.net_qty < 0 && order.side == Side::Buy);
                      if current_abs == 0 || !reduces_direction || order.qty.raw() > current_abs {
                          return Err(QxError::BusinessViolation(
                              "reduce_only 订单必须只减少现有持仓且不得反向穿仓".into(),
                          ));
                      }
                  }

                  if let Some(limit) = self.max_position_notional_raw {
                      let current_abs = position
                          .net_qty
                          .checked_abs()
                          .ok_or_else(|| QxError::Invariant("当前持仓绝对值溢出".into()))?;
                      let projected_abs = projected_net_qty
                          .checked_abs()
                          .ok_or_else(|| QxError::Invariant("投影持仓绝对值溢出".into()))?;
                      let current_instrument_notional = spec.notional(current_abs, price.raw())?;
                      let projected_instrument_notional = spec.notional(projected_abs, price.raw())?;
                      let other_notional = position
                          .gross_notional
                          .saturating_sub(current_instrument_notional);
                      let projected_gross_notional = other_notional
                          .checked_add(projected_instrument_notional)
                          .ok_or_else(|| QxError::Invariant("投影持仓名义额溢出".into()))?;
                      if projected_gross_notional > limit {
                          return Err(QxError::BusinessViolation("投影持仓名义额超过账户限额".into()));
                      }
                  }
                  if let Some(available) = self.available_margin_raw {
                      if available < 0 {
                          return Err(QxError::BusinessViolation("可用保证金不能为负".into()));
                      }
                      if !policy.reduce_only {
                          let required =
                              spec.initial_margin(order.qty.raw(), price.raw(), policy.leverage)?;
                          if required > available {
                              return Err(QxError::BusinessViolation(
                                  "订单初始保证金超过账户可用保证金".into(),
                              ));
                          }
                      }
                  }
                  Ok(())
              }
          }'''

          old_rule = '''        let add = (o.qty.raw().saturating_mul(px.raw()) / 1_000_000_000)
                      .saturating_mul(pos.multiplier.max(1));
                  if pos.gross_notional + add > self.max_notional {
                      return Err(QxError::BusinessViolation("超过最大名义额".into()));
                  }'''
          new_rule = '''        let signed_delta = match o.side {
                      Side::Buy => o.qty.raw(),
                      Side::Sell => o.qty.raw().saturating_neg(),
                  };
                  let projected_qty = pos.net_qty.saturating_add(signed_delta);
                  let current_abs = pos.net_qty.saturating_abs();
                  let projected_abs = projected_qty.saturating_abs();
                  let multiplier = pos.multiplier.max(1);
                  let current_notional = (current_abs.saturating_mul(px.raw()) / 1_000_000_000)
                      .saturating_mul(multiplier);
                  let projected_notional =
                      (projected_abs.saturating_mul(px.raw()) / 1_000_000_000)
                          .saturating_mul(multiplier);
                  let other_notional = pos.gross_notional.saturating_sub(current_notional);
                  if other_notional.saturating_add(projected_notional) > self.max_notional {
                      return Err(QxError::BusinessViolation("投影持仓超过最大名义额".into()));
                  }'''

          for old, new, label in [
              (old_context, new_context, "RiskContext::validate_order"),
              (old_rule, new_rule, "MaxNotionalRule"),
          ]:
              if source.count(old) != 1:
                  raise SystemExit(f"expected unique source block not found: {label}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
      - name: Format
        run: cargo fmt --all
      - name: Verify risk contracts
        run: cargo test -p qx-zhenlu
      - name: Commit verified risk refactor
        run: |
          git config user.name "qianxing-ci"
          git config user.email "actions@users.noreply.github.com"
          git add crates/qx-zhenlu/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: enforce projected exposure and reduce-only semantics [risk-refactor]"
          git push origin HEAD:main
