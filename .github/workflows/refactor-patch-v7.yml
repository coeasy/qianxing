name: refactor-patch-v7

on:
  push:
    branches:
      - refactor/trading-core-v7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply guarded source edits
        run: python tools/refactor_patch_v7.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Targeted safety tests
        run: cargo test -p qx-runtime -p qx-zhenlu -p qx-cli
      - name: Commit guarded patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/qx-cli/src/main.rs crates/qx-runtime/src/lib.rs crates/qx-zhenlu/src/lib.rs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: fail closed across Paper execution [v7-patch]"
          git push origin HEAD:refactor/trading-core-v7
