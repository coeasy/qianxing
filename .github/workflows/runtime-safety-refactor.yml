name: One-shot production execution safety refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-safety-refactor.yml

permissions:
  contents: write

jobs:
  patch-production-execution-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact runtime safety refactor
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/qx-runtime/src/lib.rs")
          source = path.read_text(encoding="utf-8")
          old = '''            if worker.role == WorkerRole::Execution
                          && !worker
                              .venue_id
                              .as_deref()
                              .is_some_and(|venue| venue.eq_ignore_ascii_case("paper"))
                          && worker.instrument_spec_path.is_none()
                      {
                          return Err(format!(
                              "{} 非 Paper Execution worker 必须配置 instrument_spec_path",
                              worker.id
                          ));
                      }'''
          new = '''            if worker.role == WorkerRole::Execution
                          && worker.instrument_spec_path.is_none()
                          && (self.environment.eq_ignore_ascii_case("production")
                              || !worker
                                  .venue_id
                                  .as_deref()
                                  .is_some_and(|venue| venue.eq_ignore_ascii_case("paper")))
                      {
                          return Err(format!(
                              "{} Execution worker 必须配置 instrument_spec_path；仅非 production 的 Paper smoke 允许兼容省略",
                              worker.id
                          ));
                      }'''
          if source.count(old) != 1:
              raise SystemExit("expected unique production execution validation block not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
      - name: Format
        run: cargo fmt --all
      - name: Verify production safety contract
        run: cargo test -p qx-runtime production_execution_requires_frozen_instrument_spec_even_for_paper_venue
      - name: Commit verified runtime safety refactor
        run: |
          git config user.name "qianxing-ci"
          git config user.email "actions@users.noreply.github.com"
          git add crates/qx-runtime/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: fail closed on missing production instrument spec [runtime-safety]"
          git push origin HEAD:main
