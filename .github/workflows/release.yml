# 牵星 Qianxing · 发布供应链（M0 冻结 → P2-4 落地）
#
# 口径：一个 tag 必须产出可复现的 binary / wheel / C++ SDK，并携带身份字段与 SHA256 清单，
# 附 SBOM（依赖清单）与构建来源证明（build provenance），最后挂到 GitHub Release。
# 身份字段清单与 maturity/baseline.yaml 的 artifact_identity 一致，由
# tools/check_architecture.py 的 release_supply_chain_check 常驻核对（缺一项即红）。
#
# 触发：推送 `v*` tag（如 v0.1.0）。tag 必须与 Cargo.toml / python/pyproject.toml /
# maturity/baseline.yaml 三处版本及 C++ SDK CMake project version 一致。

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version-consistency:
    name: 版本三处一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches the frozen release version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo_v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          py_v="$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -n1)"
          base_v="$(sed -n 's/^release_version: "\(.*\)"/\1/p' maturity/baseline.yaml)"
          echo "tag=${tag} cargo=${cargo_v} pyproject=${py_v} baseline=${base_v}"
          if [[ "${tag}" != "${cargo_v}" || "${tag}" != "${py_v}" || "${tag}" != "${base_v}" ]]; then
            echo "tag 与冻结版本不一致：先同步三处再打 tag" >&2
            exit 1
          fi

      - name: Verify C++ SDK version matches the release tag
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          line = next(line for line in Path("cpp/CMakeLists.txt").read_text().splitlines()
                      if line.startswith("project(qianxing_strategy_sdk VERSION "))
          cpp_version = line.split("VERSION ", 1)[1].split()[0]
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if cpp_version != tag_version:
              raise SystemExit(f"C++ SDK version {cpp_version} does not match tag {tag_version}")
          PY

  binary:
    name: binary (${{ matrix.os }})
    needs: version-consistency
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build qx-cli (release, locked)
        run: cargo build --release --locked -p qx-cli
      - name: Prove build identity
        shell: bash
        run: |
          set -euo pipefail
          bin="target/release/qx-cli"
          if [[ -f "${bin}.exe" ]]; then bin="${bin}.exe"; fi
          "${bin}" version
      - name: Package and hash
        shell: bash
        run: |
          set -euo pipefail
          bin="target/release/qx-cli"
          if [[ -f "${bin}.exe" ]]; then bin="${bin}.exe"; fi
          ext=""
          if [[ "${bin}" == *.exe ]]; then ext=".exe"; fi
          out="qx-cli-${GITHUB_REF_NAME}-${{ runner.os }}-${{ runner.arch }}${ext}"
          mkdir -p dist
          cp "${bin}" "dist/${out}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${out}" > "${out}.sha256")
          else
            (cd dist && shasum -a 256 "${out}" > "${out}.sha256")
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  wheel:
    name: python wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: version-consistency
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel (native extension included)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File tools/build_python_wheel.ps1 -Python python
          else
            export PYTHON=python3
            bash tools/build_python_wheel.sh
          fi
      - name: Confirm this matrix leg produced a wheel
        shell: bash
        run: test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
      - name: Clean-install and exercise the published Python surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          python - <<'PY'
          import os
          from pathlib import Path
          import qianxing

          bars = Path(os.environ["GITHUB_WORKSPACE"]) / "deploy" / "qianxing.bar-frame.example.json"
          assert "backtest.bar.v1" in qianxing.doctor()["implemented_use_cases"]
          verdict = qianxing.validate_dataset(qianxing.DatasetSpec("release-smoke-data", str(bars)))
          assert verdict.usable and verdict.rows == 70
          outcome = qianxing.run_backtest(qianxing.BacktestSpec(
              run_id="release-smoke-run",
              instrument="BTCUSDT.BINANCE",
              bars_path=str(bars),
              settlement_currency="USDT",
              initial_cash_raw=100_000_000_000_000,
              output_dir=str(Path.cwd() / "runs"),
              strategy=qianxing.BuiltinStrategySpec(kind="sma_cross", strategy_id="release-smoke-sma", fast_window=2, slow_window=3),
          ))
          verification = qianxing.verify_run(outcome)
          assert verification.verified, verification.mismatches
          print(f"wheel e2e rows={verdict.rows} fills={outcome.fills} verified={verification.verified}")
          PY
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  publish-python:
    name: Publish Python wheels to PyPI
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    needs: [version-consistency, wheel]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/qianxing/
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  cpp-sdk:
    name: C++ SDK
    needs: version-consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ JSON dependency
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
      - name: Configure and build
        run: |
          cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release -DQX_BUILD_JSONL_EXAMPLE=ON
          cmake --build build/cpp --config Release --parallel
      - name: Install SDK CMake package and archive it
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build/cpp --prefix "$PWD/dist/sdk"
          cmake -S cpp/tests/consumer -B build/cpp-consumer \
            -DCMAKE_PREFIX_PATH="$PWD/dist/sdk"
          cmake --build build/cpp-consumer --config Release --parallel
          tar -czf "dist/qianxing-cpp-sdk-${GITHUB_REF_NAME}.tar.gz" -C dist sdk
          (cd dist && sha256sum qianxing-cpp-sdk-*.tar.gz > cpp-sdk.sha256 2>/dev/null \
            || shasum -a 256 qianxing-cpp-sdk-*.tar.gz > cpp-sdk.sha256)
      - name: Attest C++ SDK build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/qianxing-cpp-sdk-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cpp-sdk
          path: |
            dist/qianxing-cpp-sdk-*.tar.gz
            dist/cpp-sdk.sha256

  web-console:
    name: Static Web console bundle
    needs: version-consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Package the versioned Web console
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/package_web_console.py \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "${GITHUB_SHA}" \
            --output "dist/qianxing-web-console-${GITHUB_REF_NAME}.tar.gz"
      - name: Attest Web console build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: web-console
          path: dist/*.tar.gz

  sbom:
    name: SBOM (dependency inventory)
    needs: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Emit dependency inventory from Cargo metadata
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --locked > sbom-cargo.json
          python3 - <<'PY'
          import json
          meta = json.load(open("sbom-cargo.json", encoding="utf-8"))
          components = [
              {
                  "name": pkg["name"],
                  "version": pkg["version"],
                  "source": (pkg.get("source") or "workspace"),
                  "license": pkg.get("license"),
              }
              for pkg in sorted(meta["packages"], key=lambda p: (p["name"], p["version"]))
          ]
          doc = {
              "bomFormat": "QianxingDependencyInventory",
              "specVersion": "1",
              "components": components,
          }
          json.dump(doc, open("sbom.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2, sort_keys=True)
          print(f"components={len(components)}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  release:
    name: GitHub Release
    needs: [binary, wheel, cpp-sdk, web-console, sbom]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Assemble hash manifest and identity file
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -type f ! -name 'SHA256SUMS' ! -name 'release-identity.json' -printf '%P\0' \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          python3 - <<'PY'
          import json, os
          identity = {
              "version": os.environ["GITHUB_REF_NAME"].lstrip("v"),
              "git_commit": os.environ["GITHUB_SHA"],
              "target_triple": "multi",
              "profile": "release",
              "schema_registry_version": "1",
              "sha256": "see SHA256SUMS",
              "sbom": "sbom.json",
          }
          json.dump(identity, open("release-identity.json", "w", encoding="utf-8"), indent=2, sort_keys=True)
          print(json.dumps(identity, ensure_ascii=False))
          PY
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "牵星 ${GITHUB_REF_NAME}" \
            --notes "可复现发布件：binary / wheel / C++ SDK / Web 控制台 + SHA256SUMS + sbom.json + release-identity.json（build provenance 见 Release 附件证明）。" \
            dist/*
