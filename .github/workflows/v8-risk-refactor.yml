name: V8 Projected Exposure Refactor

on:
  push:
    branches:
      - refactor/quant-system-v8
    paths:
      - .github/workflows/v8-risk-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/quant-system-v8
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Reuse audited refactor and close zero-crossing hole
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          old = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/v8-risk-refactor.yml'],
              text=True,
          )
          # HEAD^ is the short retry workflow; its parent contains the full audited
          # refactor script. Walk one more parent when necessary.
          if 'Refactor risk projection semantics' not in old:
              old = subprocess.check_output(
                  ['git', 'show', 'HEAD^^:.github/workflows/v8-risk-refactor.yml'],
                  text=True,
              )
          start_marker = '      - name: Refactor risk projection semantics\n        shell: python\n        run: |\n'
          end_marker = '      - name: Format workspace\n'
          if start_marker not in old or end_marker not in old:
              raise SystemExit('cannot recover previous audited refactor script')
          block = old.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          needle = '|| projected_abs >= current_abs'
          replacement = '''|| projected_abs >= current_abs
                      || (projected != 0
                          && projected.signum() != position.net_qty.signum())'''
          if script.count(needle) != 1:
              raise SystemExit(f'expected one reduce-only guard, got {script.count(needle)}')
          script = script.replace(needle, replacement, 1)
          Path('/tmp/refactor_risk.py').write_text(script, encoding='utf-8')
          subprocess.run(['python', '/tmp/refactor_risk.py'], check=True)
      - name: Format workspace
        run: cargo fmt --all
      - name: Test risk and execution contracts
        run: cargo test -p qx-zhenlu -p qx-execution -p qx-xingban
      - name: Commit risk refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/qx-zhenlu/src/lib.rs
          git commit -m "fix(risk): evaluate projected exposure and fail closed"
          git push origin HEAD:refactor/quant-system-v8
