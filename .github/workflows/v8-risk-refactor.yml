name: V8 Projected Exposure Refactor

on:
  push:
    branches:
      - refactor/quant-system-v8
    paths:
      - .github/workflows/v8-risk-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/quant-system-v8
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Replay audited refactor and close zero crossing
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          audited = subprocess.check_output(
              ['git', 'show', 'ee53b0e157bf19be1ef8cd3246b785183a173a04:.github/workflows/v8-risk-refactor.yml'],
              text=True,
          )
          start = '      - name: Refactor risk projection semantics\n        shell: python\n        run: |\n'
          end = '      - name: Format workspace\n'
          if start not in audited or end not in audited:
              raise SystemExit('audited transform markers not found')
          block = audited.split(start, 1)[1].split(end, 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          needle = '|| projected_abs >= current_abs'
          replacement = '''|| projected_abs >= current_abs
                      || (projected != 0
                          && projected.signum() != position.net_qty.signum())'''
          if script.count(needle) != 1:
              raise SystemExit(f'expected one reduce-only guard, got {script.count(needle)}')
          script = script.replace(needle, replacement, 1)
          Path('/tmp/refactor_risk.py').write_text(script, encoding='utf-8')
          subprocess.run(['python', '/tmp/refactor_risk.py'], check=True)
      - name: Format workspace
        run: cargo fmt --all
      - name: Test risk and execution contracts
        run: cargo test -p qx-zhenlu -p qx-execution -p qx-xingban
      - name: Commit risk refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/qx-zhenlu/src/lib.rs
          git commit -m "fix(risk): evaluate projected exposure and fail closed"
          git push origin HEAD:refactor/quant-system-v8
