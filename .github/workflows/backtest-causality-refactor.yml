name: One-shot backtest causality refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/backtest-causality-refactor.yml

permissions:
  contents: write

jobs:
  patch-backtest-causality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact pre-trade causality refactor
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/qx-xingban/src/backtest.rs")
          source = path.read_text(encoding="utf-8")

          reference = "let reference_price = order.limit.map(|p| p.raw()).unwrap_or(bar.close);"
          if source.count(reference) != 1:
              raise SystemExit(f"expected exactly one market-order reference-price line, found {source.count(reference)}")
          source = source.replace(
              reference,
              "// Strategy decisions at Bar(t) only observe data through Bar(t-1).\n"
              "                        // Pre-trade risk and margin therefore use the last visible mark,\n"
              "                        // never the current bar close, which is future information here.\n"
              "                        let visible_close = bars[i - 1].close;\n"
              "                        let reference_price = order.limit.map(|p| p.raw()).unwrap_or(visible_close);",
              1,
          )

          anchor = source.index("let visible_close = bars[i - 1].close;")
          mark = "Price::from_raw(bar.close)"
          mark_pos = source.find(mark, anchor)
          if mark_pos < 0:
              raise SystemExit("pre-trade equity mark not found after visible-close anchor")
          source = source[:mark_pos] + "Price::from_raw(visible_close)" + source[mark_pos + len(mark):]

          gross = "checked_abs(bar.close)?"
          gross_pos = source.find(gross, mark_pos)
          if gross_pos < 0:
              raise SystemExit("pre-trade gross-notional mark not found after equity mark")
          status_pos = source.find("if matches!(order.status, OrderStatus::PendingSubmit)", gross_pos)
          if status_pos < 0 or gross_pos > status_pos:
              raise SystemExit("gross-notional mark is not inside the pre-trade order block")
          source = source[:gross_pos] + "checked_abs(visible_close)?" + source[gross_pos + len(gross):]

          path.write_text(source, encoding="utf-8")
      - name: Format
        run: cargo fmt --all
      - name: Verify backtest causality and regression suite
        run: |
          cargo test -p qx-xingban --test no_lookahead
          cargo test -p qx-xingban
      - name: Commit verified backtest causality refactor
        run: |
          git config user.name "qianxing-ci"
          git config user.email "actions@users.noreply.github.com"
          git add crates/qx-xingban/src/backtest.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove current-bar close lookahead from pre-trade risk [backtest-causality]"
          git push origin HEAD:main
