name: trading-ci

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: trading-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-features

  feature-matrix:
    name: feature-${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - sqlite
          - postgres
          - nats
          - postgres,nats
          - sqlite,postgres,nats
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile qx-cli feature set
        run: cargo check -p qx-cli --all-targets --features "${{ matrix.features }}"

  runtime-contracts:
    name: runtime-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate every runtime config
        shell: bash
        run: |
          set -euo pipefail
          for file in deploy/qianxing.runtime*.json; do
            echo "checking ${file}"
            cargo run -p qx-cli --features sqlite,postgres,nats -- runtime-check "${file}"
          done
      - name: Deterministic ecosystem smoke
        run: cargo run -p qx-cli -- ecosystem
      - name: Paper smoke
        run: cargo run -p qx-cli -- paper
      - name: Scheduler to strategy to Paper E2E
        run: cargo run -p qx-cli -- paper-e2e deploy/qianxing.runtime.paper-strategy.example.json
      - name: Cross-process lease recovery
        run: cargo test -p qx-cli --test process_recovery

  python-contracts:
    name: python-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Python bridge tests
        run: python -m pip install --upgrade pip pytest pytest-asyncio -e ./python
      - name: Python contracts
        run: >-
          python -m pytest -q
          python/tests/test_bridge.py
          python/tests/test_ccxt.py
          python/tests/test_ccxt_worker.py
          python/tests/test_strategy_contract.py

  cpp-contracts:
    name: cpp-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++ SDK
        run: cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ SDK
        run: cmake --build build/cpp --config Release --parallel
      - name: Shared-ring smoke
        run: ./build/cpp/qianxing_ring_smoke
