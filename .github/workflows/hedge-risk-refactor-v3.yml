name: One-shot hedge-aware risk refactor v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hedge-risk-refactor-v3.yml

permissions:
  contents: write

jobs:
  patch-hedge-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply staged hedge-risk refactor
        run: python3 tools/refactor_hedge_risk.py
      - name: Format
        run: cargo fmt --all
      - name: Verify hedge-aware risk contracts
        run: |
          cargo test -p qx-zhenlu
          cargo test -p qx-xingban
          cargo check -p qx-cli --features sqlite
      - name: Commit verified hedge-aware risk refactor
        run: |
          git config user.name "qianxing-ci"
          git config user.email "actions@users.noreply.github.com"
          git add crates/qx-zhenlu/src/lib.rs crates/qx-cli/src/main.rs crates/qx-xingban/src/backtest.rs crates/qx-xingban/src/orderbook_backtest.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: unify hedge exposure and reduce-only risk semantics [hedge-risk]"
          git push origin HEAD:main
