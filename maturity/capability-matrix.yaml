# 能力矩阵（方案 §2「基线复核产物」/ §4.2「能力发现与限制表达」）
#
# 为什么要有这一份，而不是复用 `maturity/capabilities.yaml`：两者是**两条不同的轴**。
#   * `capabilities.yaml` 记的是**内部子系统的成熟度阶梯**（implementation / code_tested /
#     sandbox_tested / production_approved），回答"这套代码本身走到哪一档了"。
#   * 本表记的是**方案 §2 那张基线表的缺口评估**，回答"方案点名的每一个领域/Provider/Venue
#     现在是什么状态、限制是什么、下一个闸门在哪"。方案 §2 的原话是「每个缺口标记为
#     implemented-and-verified、implemented-unverified、partial、unsupported 或 blocked，
#     **不得用布尔值 supported=true 掩盖限制**」——一个布尔位分不出"做完了且验过""做完了没验过"
#     "只做了一半""根本不做""被外部条件卡住"这五种，而它们对应的下一步动作完全不同。
#
# 机读口径（由 `tools/check_architecture.py` 的 `capability_matrix_check` 逐格对账）：
#   * `levels` 是闭集，顺序即从强到弱；任何记录的档位取值必须落在这一集里。
#   * `domains` 的名册必须与方案 §2 那张表的八个领域逐一对应（少一个就是有人把缺口藏起来了）。
#   * `venues` / `providers` 的名册必须与**生产代码里真实存在的 `impl Venue for X` /
#     `impl DataProvider for X`** 逐一相等，且每条记录的 `impl` 指向真正含该实现的那个文件。
#     多一个 = 凭空声明一个不存在的 venue；少一个 = 有 venue 在代码里活着却没人给它评档。
#   * 每格必须给档位而不是布尔值；每条必须写限制；每个 `evidence` 里的仓库路径必须在盘。
schema_version: 1
kind: capability-matrix
updated_at: "2026-10-13"
plan_doc: "docs/牵星Qianxing-多语言SDK全能力升级与重构实施方案-2026-10-11.md"
plan_sections: "方案 §2 基线复核 / §4.2 能力发现与限制表达"

levels:
  - implemented-and-verified
  - implemented-unverified
  - partial
  - unsupported
  - blocked

# 方案 §4.2 的字段名册（"细到市场和操作"）。venue 记录逐格给档位。
capability_fields:
  - market
  - history
  - realtime
  - frequency
  - depth
  - order_type
  - account_model
  - fee
  - cancel
  - query
  - idempotency
  - rate_limit
  - sandbox
  - precision

# 数据面的字段名册：订单类字段（order_type / cancel / idempotency …）对 Provider 不成立，
# 硬套会逼出一堆无意义的档位；Provider 只回答"数据能不能拿到、多密、多深、多准"。
provider_fields:
  - market
  - history
  - realtime
  - frequency
  - depth
  - precision

