# 能力矩阵（方案 §2「基线复核产物」/ §4.2「能力发现与限制表达」）
#
# 为什么要有这一份，而不是复用 `maturity/capabilities.yaml`：两者是**两条不同的轴**。
#   * `capabilities.yaml` 记的是**内部子系统的成熟度阶梯**（implementation / code_tested /
#     sandbox_tested / production_approved），回答"这套代码本身走到哪一档了"。
#   * 本表记的是**方案 §2 那张基线表的缺口评估**，回答"方案点名的每一个领域/Provider/Venue
#     现在是什么状态、限制是什么、下一个闸门在哪"。方案 §2 的原话是「每个缺口标记为
#     implemented-and-verified、implemented-unverified、partial、unsupported 或 blocked，
#     **不得用布尔值 supported=true 掩盖限制**」——一个布尔位分不出"做完了且验过""做完了没验过"
#     "只做了一半""根本不做""被外部条件卡住"这五种，而它们对应的下一步动作完全不同。
#
# 机读口径（由 `tools/check_architecture.py` 的 `capability_matrix_check` 逐格对账）：
#   * `levels` 是闭集，顺序即从强到弱；任何记录的档位取值必须落在这一集里。
#   * `domains` 的名册必须与方案 §2 那张表的八个领域逐一对应（少一个就是有人把缺口藏起来了）。
#   * `venues` / `providers` 的名册必须与**生产代码里真实存在的 `impl Venue for X` /
#     `impl DataProvider for X`** 逐一相等，且每条记录的 `impl` 指向真正含该实现的那个文件。
#     多一个 = 凭空声明一个不存在的 venue；少一个 = 有 venue 在代码里活着却没人给它评档。
#   * 每格必须给档位而不是布尔值；每条必须写限制；每个 `evidence` 里的仓库路径必须在盘。
schema_version: 1
kind: capability-matrix
updated_at: "2026-10-12"
plan_doc: "docs/牵星Qianxing-多语言SDK全能力升级与重构实施方案-2026-10-11.md"
plan_sections: "方案 §2 基线复核 / §4.2 能力发现与限制表达"

levels:
  - implemented-and-verified
  - implemented-unverified
  - partial
  - unsupported
  - blocked

# 方案 §4.2 的字段名册（"细到市场和操作"）。venue 记录逐格给档位。
capability_fields:
  - market
  - history
  - realtime
  - frequency
  - depth
  - order_type
  - account_model
  - fee
  - cancel
  - query
  - idempotency
  - rate_limit
  - sandbox
  - precision

# 数据面的字段名册：订单类字段（order_type / cancel / idempotency …）对 Provider 不成立，
# 硬套会逼出一堆无意义的档位；Provider 只回答"数据能不能拿到、多密、多深、多准"。
provider_fields:
  - market
  - history
  - realtime
  - frequency
  - depth
  - precision

domains:
  - name: rust_kernel
    level: implemented-and-verified
    evidence: [crates/qx-core, maturity/capabilities.yaml, maturity/backtest_acceptance.yaml]
    limitations: ["实盘轨的两档只对需要外部 venue 的能力有意义，对回测/Paper 主用法是不适用而不是待补（见 maturity/evidence/README.md）"]
    next_gate: "保持 tools/check_architecture.py 与 cargo test --workspace 全绿；内核不得长出对 UI/HTTP/CLI/Python/C++ 的依赖"

  - name: python_sdk
    level: implemented-unverified
    evidence: [python/qianxing, python/tests/test_sdk_layering.py, maturity/language_api_contract.yaml, maturity/quant_scenarios.yaml, crates/qx-cli/src/tests/strategy_order_identity_round_scope.rs]
    limitations: ["Bar、Tick/OrderBook 与多腿回测现支持显式账户归属，但仍按 leg/run 独立账簿；组合级资金竞争/风险聚合与多策略调度未闭环。统一 Provider 导入、多交易所费率与撮合、用户策略选择与完整 Paper/Live 执行验收也未闭环", "Kelly fraction 已在 Rust Bar 单腿回测和 Paper worker→Risk→OMS→Paper Venue→Ledger 路径验证；Tick/OrderBook、多腿 sizing 未接入，Live sizing 未经 testnet 验收", "Rust 风险平价用例已提供确定性研究规划，并经 Python native/remote、C++ remote 和 Rust SDK 接入；它要求调用方提供冻结对齐收益与标记价，不自动读取 Provider 数据，也不提交 Paper/Live 订单", "接口分层已落（方案 §6.2：core/client/data/strategy/paper/live/experiments/reports 八个子层；顶层稳定名单与 qianxing.app 的公开面逐一双向相等；本地 AsyncCoreClient/AsyncRunHandle 与远端 AppClient/RemoteRunHandle 均以同步实现为唯一契约源，Paper/Live 提交亦有 asyncio 委托）；本地 RunHandle.events 来自 Rust worker 的内存事件序列；HTTP /app/runs/{run_id}/events 将生命周期事件并入运行快照并支持 after_seq，Python/Rust/C++ 远端可按 Run 读取。它仍是快照持久化而非逐事件事务日志，未提供 occurred_at/订单成交事实、跨进程强一致追加或游标过期恢复语义", "CPython 3.10+ 乘操作系统与架构的支持矩阵未建立", "不带 Rust 工具链的干净环境安装冒烟未建立：发布验收目前只在带仓库源码的环境里跑过"]
    next_gate: "打通持久化的按 Run 事件/订单流与游标恢复；建立 CPython 3.10+ 乘操作系统与架构的支持矩阵，并在不带 Rust 工具链的干净环境完成安装冒烟"

  - name: cpp_sdk
    level: partial
    evidence: [cpp/include/qianxing_app.hpp, cpp/tests/consumer, maturity/language_api_contract.yaml]
    limitations: ["C++ 客户端依赖集成方自带 HTTP transport：默认传输（TLS 认证、keep-alive、截止时间、重试、SSE/WS、取消）未落地", "尚不是独立交易运行时——header-only client 不得被描述成本地交易引擎", "CMake 包、工具链矩阵与 ABI 版本检查未建立"]
    next_gate: "落方案 §6.3 的默认 HTTP transport 与异步生命周期，并补安装后全链路测试与 ABI 版本检查"

  - name: rust_sdk
    level: implemented-unverified
    evidence: [crates/qx-sdk, crates/qx-sdk/tests/independent_consumer.rs, crates/qx-execution/src/algo_execution.rs, docs/qx-sdk-migration.md]
    limitations: ["门面 crate qx-sdk 已落（方案 §6.1）：Client/Engine、capabilities、spec 构造校验、同步与句柄式异步 Run、RunHandle、取消等待取结果、report/verify、Provider/Venue 扩展端口与统一错误都在公开面上；Bar 回测 Kelly sizing 通过 BuiltinStrategySpec 可用；Rust SDK 已暴露可序列化 AlgoExecutionState 与共享 ExecutionGateway 端口，qx-runtime 提供原子父单 checkpoint 与单飞 step/cancel 存储；qx-cli 已接 Paper worker、API start/get/list/cancel 与父单成交聚合，Python/C++ 已接远端生命周期方法；qx-sdk RemoteApiClient 已接入服务端 Paper 生命周期、/events/live 序号游标和按 Run 读取生命周期快照事件，宿主需实现 RemoteTransport；本地 RunHandle.events 来自 Rust worker 内存事件序列。按 Run 快照仍非逐事件事务日志，不含订单/成交事实及跨进程强一致游标恢复", "Kelly fraction 已在 Rust Bar 单腿回测和 Paper worker→Risk→OMS→Paper Venue→Ledger 路径验证；深度/多腿 sizing 未接入，Live sizing 未经 testnet 验收", "门面的『异步』是句柄式不是 Future 式：qx-app 的引擎是线程加通道，没有 executor，硬套 Future 只会让 poll 里出现阻塞等待", "Git 固定提交的 workspace 外消费者已构建并执行数据校验、回测、结果复核；crates.io 发布仍未通过：`cargo package -p qx-sdk --allow-dirty --offline` 因内部 `qx-app` 尚未发布至配置 registry 而失败，临时 registry consumer 未建立", "通用 §4.2 能力预检仍未闭环；market-aware Bar 已要求显式费用/tick/lot 和时间有效期，但 Provider/Venue、Tick/OrderBook 与实盘订阅/身份/风险权限的启动前统一匹配尚未落地"]
    next_gate: "若要求 crates.io 发布，先按依赖拓扑发布内部 crate 并完成临时 registry 消费；补齐持久化按 Run 事件/订单流与游标恢复；补 §4.2 启动前能力预检 fail-closed；Live 仍需 testnet conformance 才能谈 GA"

  - name: data_and_venues
    level: implemented-unverified
    evidence: [crates/qx-provider, crates/qx-adapter, maturity/capabilities.yaml]
    limitations: ["Rust/Python 高层 Bar BacktestSpec 现要求冻结 TradingInstrumentSpec 同时显式提供固定 MakerTakerFeeSchedule，并校验标的/结算币种/有效期及成交 tick/lot；费用尚不由 Provider/Venue 自动解析，不含分层费率、返佣、税费或按时间生效的规则", "统一接入流程（能力探测、下载或订阅、质量校验、数据冻结、下单、回报、账簿、复核）未端到端证明", "数据源与 venue 是两种能力，不得互相顶替；无 testnet 记录的 venue 一律 unsupported 或 implemented-unverified"]
    next_gate: "落方案 §4.2 的能力预检 fail-closed 与 §5.x 的 Provider/Venue 一致性套件"

  - name: accounts_and_strategies
    level: partial
    evidence: [crates/qx-runtime/src/runtime_config/schema.rs, crates/qx-runtime/src/runtime_config/topology_validation.rs, crates/qx-cli/src/backtests/account_base.rs, crates/qx-cli/src/venue_runtime/paper_submit.rs, crates/qx-app, crates/qx-zhenlu, maturity/app_use_cases.yaml]
    limitations: ["RuntimeConfig.accounts 已统一账户身份、结算币种与初始本金来源；多策略 Bar 回测和 Paper 账户入账可按 account_id 选择独立本金，旧配置无 accounts 时仍保持兼容", "Bar、Tick/OrderBook 和多腿回测均可显式指定账户，账户身份进入策略上下文、summary/归因事实和复核；多腿两侧仍分别开账，目前未有组合规格", "多账户资金竞争、组合限额聚合、多策略调度和退出语义未端到端验证"]
    next_gate: "落方案 §5.3 的组合/策略/Run 所有权、跨账户限额聚合与确定性资金分配"

  - name: web_api
    level: implemented-unverified
    evidence: [crates/qx-api, web/console, deploy/README.md]
    limitations: ["路由存在不等于 UI 链路可用：研究工作流与 Paper/Live 操作页需逐屏逐操作验收同一资源契约"]
    next_gate: "落方案 §5.x 的逐操作可追溯验收与 Web/桌面 E2E"

  - name: release
    level: partial
    evidence: [.github/workflows, maturity/gate_snapshot.json]
    limitations: ["当前 Windows 本地包不能代表全平台：跨平台消费者安装验证、实盘认证矩阵与产品能力清单需要补足", "SBOM、构建来源证明与三操作系统支持矩阵未建立"]
    next_gate: "落方案 §7 的发布工程（SBOM、来源证明、支持矩阵、三操作系统）"

