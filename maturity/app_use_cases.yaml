# 应用层用例登记面（QX-DEV-PLAN-2026-10-10 阶段 2 / 路线图 §2「每个用例必须定义九项」）
#
# 目的：把「qx-app 有哪些用例、每个用例的九项是什么」从 `crates/qx-app/src/cases/mod.rs` 的
# 一张文档表，升级为**机读**登记面。门禁 `qx_app_check` 把本表与三处事实逐条对账：
#   ① 用例集合 == `cases/mod.rs` 的 `pub use`；
#   ② 每个用例在 `crates/qx-app/src/cases/` 下都有 `pub fn <name>(`；
#   ③ 九项键名与顺序 == `cases/mod.rs` 模块文档那张表的九行（同一份口径的两种写法）。
#
# 为什么九项要**逐项**登记而不是写一句"见文档"：路线图 §2 点名这九项是每个用例的**契约**，
# 而契约里最容易漏的是"取消行为"与"幂等键"——它们不写下来时，读者的默认假设是"应该会取消"
# 与"应该幂等"，两者都可能错。写成一格就必须有人回答它。
#
# 取值口径：
#   input_schema / output_schema  —— 类型名 + 版本；`qx-app` 的 spec 都带 schema_version。
#   capability                    —— 调用方能力档（路线图 §5 R/P/O/L）；`none` 表示不设闸。
#   idempotency_key               —— 同一把钥匙重跑必须逐字节同结果；不幂等就写 `无`。
#   cancellation                  —— 今天是否有取消点；同步用例写清"没有取消点"。
#   progress                      —— 事件/进度面；同步用例写 `无`。
#   artifacts                     —— 落盘产物清单；不落盘写 `无`。
#   error_categories              —— 失败面的类别来源（唯一映射表在哪）。
#   capability_level              —— 该用例自身的能力等级（R/P/O/L）。
schema_version: 1
kind: app-use-case-registry
updated_at: "2026-10-15"

error_categories:
  - InvalidInput
  - DataUnavailable
  - FidelityInsufficient
  - PermissionDenied
  - Conflict
  - Timeout
  - StorageFailure
  - InternalInvariant

use_cases:
  - name: validate_dataset
    input_schema: "DatasetSpec v1（crates/qx-app/src/spec.rs）"
    output_schema: "DatasetVerdict v1（schemas/dataset-verdict-v1.json）"
    capability: "RESEARCH"
    idempotency_key: "dataset_id + 内容指纹（纯读，无副作用）"
    cancellation: "无取消点（同步纯读，不阻塞等待）"
    progress: "无"
    artifacts: "无"
    error_categories: "AppErrorCategory 八类；领域码→类别走 category_of_domain_code"
    capability_level: "R"
  - name: run_backtest
    input_schema: "BacktestSpec v1（可选冻结 TradingInstrumentSpec；可选 margin_model 显式绑定 NoMargin/Leverage/交易所 TieredMargin；market_spec 需显式声明费用来源（MakerTakerFeeSchedule、ExecutionCostRules 或启用的 AShareRuleConfig）；可选 ExecutionCostRules 同时绑定费用与延迟，可选预加载 AshareRuleConfig 绑定 A 股制度并由其费率覆盖 maker/taker；可选 OHLCV 撮合模型 next_bar_open/best_price/one_tick_slippage（one_tick_slippage 要求 price_tick）；可选 BacktestRiskRules 静态规则集（max_qty_raw/max_notional_raw/no_short，产品派生禁空规则仍自动应用）；四类信号旋钮 fast_window/slow_window/period/threshold_bps；省略 period/threshold 时取兼容默认值 14/100；可选同账户单标的单腿策略组合 portfolio（多个 Rust/Python 自定义 callback 可占策略槽，剩余槽使用内置策略），按优先级共享资金并要求预算合计不超过 initial_cash_raw；组合不接受账户净持仓 protective_exit）"
    output_schema: "BacktestOutcome v1（schemas/backtest-outcome-v1.json）"
    capability: "RESEARCH"
    idempotency_key: "run_id + config_hash + data_fingerprint（三者全同才允许重写；任一不同即 Conflict）"
    cancellation: "同步 run_backtest 不取消；BacktestSpec::start 通过 Rust 引擎逐 Bar 协作取消，取消不返回部分报告或产物"
    progress: "RunHandle 提供 run_id、状态、取消、等待和一次性结果读取；无百分比进度"
    artifacts: "<run_id>.run.json / <run_id>.summary.json / <run_id>.equity.csv / <run_id>.fills.csv"
    error_categories: "AppErrorCategory 八类；领域码→类别走 category_of_domain_code"
    capability_level: "R"
  - name: verify_run
    input_schema: "BacktestOutcome（crates/qx-app/src/spec.rs）"
    output_schema: "VerificationResult v1（schemas/verification-result-v1.json）"
    capability: "none"
    idempotency_key: "run_id（纯读产物，无副作用）"
    cancellation: "无取消点（同步纯读）"
    progress: "无"
    artifacts: "无（只读上面四份）"
    error_categories: "AppErrorCategory 八类；产物缺失/不一致是 Ok(verified=false) 不是 Err"
    capability_level: "R"
  - name: compare_runs
    input_schema: "CompareRunsSpec v1（crates/qx-app/src/cases/compare_runs.rs）"
    output_schema: "CompareRunsResult v1（schemas/compare-runs-result-v1.json；稳定排序：收益降序、回撤升序、run_id 升序）"
    capability: "none"
    idempotency_key: "完整输入文档（纯计算，无副作用）"
    cancellation: "无取消点；输入最多 10000 份已完成运行的有限摘要"
    progress: "无"
    artifacts: "无（返回确定性排序结果）"
    error_categories: "AppErrorCategory 八类；数据指纹或标的不一致为 Conflict"
    capability_level: "R"
  - name: run_experiment
    input_schema: "RunExperimentSpec v1（Bar BacktestSpec + fast_window/slow_window/period/threshold_bps/quantity_raw 参数笛卡尔网格；可选 strategy_kinds 快速选择单腿内置策略，或本地 Rust/Python StrategyArtifactIdentity + factory 为每个候选提供新自定义策略；两种选择方式互斥；可与 split_plan 组合，由训练窗选择策略和参数并报告 OOS；可选 seeded random 或 categorical TPE 搜索，需 split_plan 且搜索预算不超过 256）"
    output_schema: "run-experiment-result-v1（逐候选结果/错误/策略 kind + CompareRunsResult + 可选 OOS/基准结果；schemas/run-experiment-result-v1.json）"
    capability: "RESEARCH"
    idempotency_key: "experiment_id + 规格指纹；自定义策略身份另绑定 ID/version/SHA-256；不匹配的既有实验在启动候选前拒绝"
    cancellation: "同步用例无取消点；RunExperimentSpec::start 与 start_with_strategy_factory 在候选之间及候选 Bar 撮合循环协作取消，不发布部分实验报告"
    progress: "逐候选记载成功与稳定 AppError JSON；RunHandle 提供状态/取消/等待/一次性结果读取，无百分比进度"
    artifacts: "各成功候选的四份标准回测产物 + <experiment_id>.experiment.json"
    error_categories: "AppErrorCategory 八类；候选失败隔离，整体规格/存储错误由用例返回"
    capability_level: "R"
  - name: run_depth_experiment
    input_schema: "RunDepthExperimentSpec v1（DepthBacktestSpec + 内置信号参数网格，可选 strategy_kinds 与参数网格笛卡尔组合；或 market_making_* 做市参数网格；本地 Rust/Python 可用 StrategyArtifactIdentity + strategy factory 为每个 Tick/OrderBook 候选创建新策略，不能与 strategy_kinds 混用；最多 256 候选）"
    output_schema: "run-depth-experiment-result-v1（逐候选策略 kind/参数/结果/错误 + 收益降序、回撤升序确定性排名；schemas/run-depth-experiment-result-v1.json）"
    capability: "RESEARCH"
    idempotency_key: "experiment_id + 完整规格指纹；自定义策略实验另绑定 StrategyArtifactIdentity ID/version/SHA-256；不同规格/源码在启动候选前拒绝"
    cancellation: "RunDepthExperimentSpec::start 与 start_with_strategy_factory 在候选间及 Tick/快照内核循环协作取消，不发布部分实验报告"
    progress: "逐候选记录结果与错误；RunHandle 提供状态/取消/等待/一次性结果读取，无百分比进度"
    artifacts: "各成功候选的四份深度回测产物 + <experiment_id>.depth-experiment.json"
    error_categories: "AppErrorCategory 八类；候选错误隔离，整体规格/存储错误由用例返回"
    capability_level: "R"
  - name: run_multi_leg_experiment
    input_schema: "RunMultiLegExperimentSpec v1（MultiLegBacktestSpec + 双腿策略 kind 选择及 fast_window/slow_window/period/threshold_bps/quantity_raw 参数网格笛卡尔组合；最多 256 候选；本地 Rust/Python 可用 StrategyArtifactIdentity + strategy factory 为每个候选创建自定义策略，不能与 strategy_kinds 混用）"
    output_schema: "run-multi-leg-experiment-result-v1（逐候选策略 kind/参数/结果/错误 + 按组合收益确定性排名；schemas/run-multi-leg-experiment-result-v1.json）"
    capability: "RESEARCH"
    idempotency_key: "experiment_id + 完整规格指纹；自定义策略实验再绑定 StrategyArtifactIdentity；不同规格/源码在启动候选前拒绝"
    cancellation: "RunMultiLegExperimentSpec::start 与 start_with_strategy_factory 在候选之间和候选双腿撮合循环协作取消，不发布部分实验报告"
    progress: "逐候选记载成功与稳定 AppError JSON；RunHandle 提供状态/取消/等待/一次性结果读取，无百分比进度"
    artifacts: "各成功候选的多腿归因产物 + <experiment_id>.multi-leg-experiment.json"
    error_categories: "AppErrorCategory 八类；候选失败隔离，整体规格/存储错误由用例返回"
    capability_level: "R"
  - name: run_depth_backtest
    input_schema: "DepthBacktestSpec v1（L1 Tick 或 L2/L3 OrderBook + Rust 内置策略或本地 Rust/Python 自定义回调；同账户 portfolio 槽位支持多个回调与内置策略混合，回调身份排序进入配置指纹；spot 内置策略支持固定名义、现金比例、ATR 波动预算和 Kelly sizing，逐快照使用已结算现金；衍生品动态 sizing 在 free-margin 模型认证前拒绝；可选 TradingInstrumentSpec；L2 可选双边做市配置；衍生品要求 OrderPolicy）"
    output_schema: "DepthBacktestOutcome v1（schemas/depth-backtest-outcome-v1.json；统一回测哈希、权益/成交摘要与四份产物路径）"
    capability: "RESEARCH"
    idempotency_key: "run_id + 规格指纹 + 盘口内容指纹；异身份或不一致产物拒绝覆盖"
    cancellation: "同步 run_depth_backtest 不取消；DepthBacktestSpec::start 与 start_depth_backtest_with_strategy_slots 通过 Rust Tick/快照循环协作取消，取消不返回部分报告或产物"
    progress: "RunHandle 提供 run_id、状态、取消、等待和一次性结果读取；无百分比进度；结果绑定 Rust 撮合报告和 ReplayVerifier 重放证据"
    artifacts: "<run_id>.run.json / <run_id>.summary.json / <run_id>.equity.csv / <run_id>.fills.csv"
    error_categories: "AppErrorCategory 八类；档位不匹配为 FidelityInsufficient，产物冲突为 Conflict"
    capability_level: "R"
  - name: verify_depth_run
    input_schema: "DepthBacktestOutcome v1（crates/qx-app/src/spec/depth.rs）"
    output_schema: "VerificationResult v1（schemas/verification-result-v1.json）"
    capability: "none"
    idempotency_key: "run_id（纯读四份产物，无副作用）"
    cancellation: "无取消点（同步纯读）"
    progress: "无"
    artifacts: "无（只读 run.json / summary.json / equity.csv / fills.csv）"
    error_categories: "AppErrorCategory 八类；产物缺失/不一致为 verified=false"
    capability_level: "R"
  - name: validate_trade_control
    input_schema: "TradeControlSpec v1（Paper/Live + 现有 ControlCommand）"
    output_schema: "经认证授权和现有执行者清单校验的 ControlCommand"
    capability: "PAPER_OR_LIVE"
    idempotency_key: "command_id + request_id；实际去重由 Rust ControlPlane 完成"
    cancellation: "无取消点；用例只在原有队列持久化之前验证"
    progress: "API 返回 Accepted 审计回执；worker 终态继续走现有审计读面"
    artifacts: "Rust ControlPlane 审计链、原有 EventLog 与 Ledger"
    error_categories: "AppErrorCategory 八类；无执行者、权限不足、订单载荷非法均在入队前拒绝"
    capability_level: "P/L"
  - name: run_multi_account_backtest
    input_schema: "MultiAccountBacktestSpec v1 或 MultiAccountDepthBacktestSpec v1（2..=32 个独立账户；Bar 或 L1 Tick/L2 OrderBook；须同结算币种；不做跨账户净额）"
    output_schema: "MultiAccountBacktestResult v1 或 MultiAccountDepthBacktestResult v1（每账户独立 outcome/error + 成功账户本金加权收益摘要，部分失败显式 complete=false；schemas/multi-account-backtest-result-v1.json / schemas/multi-account-depth-backtest-result-v1.json）"
    capability: "RESEARCH"
    idempotency_key: "batch_id + 按 account_id 排序的规格指纹（忽略本地数据/产物路径）；数据内容由子结果指纹标识，成员 run_id 唯一"
    cancellation: "同步入口不取消；两种规格的 start 均返回 RunHandle，在账户间检查取消，并将取消令牌传入当前 Rust Bar 或 Tick/OrderBook 内核；取消不返回部分批次结果"
    progress: "RunHandle 提供 run_id、状态、取消、等待和一次性结果读取；终态结果包含每账户 outcome/error，无百分比进度"
    artifacts: "每个成功账户各自的 run.json / summary.json / equity.csv / fills.csv；无跨账户共享账本产物"
    error_categories: "AppErrorCategory 八类；规格、权限及批次聚合溢出整体失败，账户级回测错误隔离返回"
    capability_level: "R"
  - name: run_multi_account_depth_backtest
    input_schema: "MultiAccountDepthBacktestSpec v1（2..=32 个独立账户 DepthBacktestSpec；L1 Tick 或 L2 OrderBook 可跨市场但须同结算币种；不做跨账户净额）"
    output_schema: "MultiAccountDepthBacktestResult v1（每账户独立 DepthBacktestOutcome/error + 成功账户本金加权收益摘要，部分失败显式 complete=false；schemas/multi-account-depth-backtest-result-v1.json）"
    capability: "RESEARCH"
    idempotency_key: "batch_id + 按 account_id 排序的深度规格指纹（忽略本地数据/产物路径）；成员 run_id 唯一，数据内容由子结果指纹标识"
    cancellation: "同步入口不取消；MultiAccountDepthBacktestSpec::start 在账户间检查取消，并将取消令牌传入当前 Rust Tick/OrderBook 内核；取消不返回部分批次结果"
    progress: "RunHandle 提供 run_id、状态、取消、等待和一次性结果读取；终态结果包含每账户 outcome/error，无百分比进度"
    artifacts: "每个成功账户各自的 run.json / summary.json / equity.csv / fills.csv；无跨账户共享账本产物"
    error_categories: "AppErrorCategory 八类；规格、权限及批次聚合溢出整体失败，账户级深度回测错误隔离返回"
    capability_level: "R"
  - name: run_multi_leg_backtest
    input_schema: "MultiLegBacktestSpec v1（两条可非对齐时间戳 BarFrame + 双腿内置或本地 Rust/Python 自定义策略、可选两侧 TradingInstrumentSpec、共享费率默认值与腿级覆盖、常量 funding_bps、调用方 FundingRateEvent 或 Rust ProviderRegistry 的 Financial/funding_8h/funding_rate_bps 历史查询、撮合模型；同一账户和共享购买力池；固定名义金额 sizing 支持显式永续/交割规格，动态资金 sizing 与现货空腿在规格校验期拒绝，调用方须设置 quantity_raw）"
    output_schema: "MultiLegBacktestOutcome v1（schemas/multi-leg-backtest-result-v1.json；两腿哈希、组合收益、成交归因产物）"
    capability: "RESEARCH"
    idempotency_key: "run_id + 规格指纹 + 双 BarFrame 内容指纹；异内容拒绝覆盖"
    cancellation: "同步入口不取消；MultiLegBacktestSpec::start 在共享事件时间线和撮合循环协作取消，不发布部分归因产物"
    progress: "RunHandle 提供 run_id、状态、取消、等待和一次性结果读取；统一 OMS/Ledger/EventLog 通过 Rust ReplayVerifier"
    artifacts: "<run_id>.multi-leg.json（策略、数据与配置身份、共享 EventLog/账簿回放、两腿成交哈希与归因、裸腿待对账事实）"
    error_categories: "AppErrorCategory 八类；重复标的或非法时间序列为 InvalidInput，样本不足为 FidelityInsufficient，异身份覆盖为 Conflict"
    capability_level: "R"
  - name: run_multi_builtin_backtest
    input_schema: "MultiBuiltinBacktestSpec v1（两份对齐 BarFrame、双腿内置策略参数、两份独立 BacktestSpec；逐腿显式账户/本金/market spec/保证金/成本/撮合/风控；共享校验声明产品与资金费的规格前置条件）"
    output_schema: "MultiBuiltinBacktestRun（两腿 BacktestOutcome + 已验证 BacktestReport + 虚拟仓位目标时间表 + 组合收益/分组归因/费用闭合/裸腿与逐腿成交完整性/成本和保证金口径）；CLI 持久化组合产物 MultiBuiltinCompositionSummary v7（schemas/multi-builtin-composition-summary-v7.json）"
    capability: "RESEARCH"
    idempotency_key: "每腿 run_id + config_hash + data_fingerprint；信号目标由双帧内容与策略规格确定性推导"
    cancellation: "同步用例，无取消点；信号预计算后逐腿复用标准 BacktestEngine 与 ReplayVerifier"
    progress: "无"
    artifacts: "每条腿各自的 run.json / summary.json / equity.csv / fills.csv；qx-app 返回组合归因事实，CLI 兼容适配层生成历史组合摘要与证据文件"
    error_categories: "AppErrorCategory 八类；两帧标的/时间戳不对齐为 InvalidInput，样本不足为 FidelityInsufficient，子回测错误按标准用例返回"
    capability_level: "R"
  - name: plan_risk_parity
    input_schema: "RiskParitySpec v1（冻结的对齐收益率序列、标记价、资金和换手预算）"
    output_schema: "RiskParityResult v1（确定性等风险贡献权重、目标名义金额、调仓增量和计划指纹；schemas/risk-parity-result-v1.json）"
    capability: "RESEARCH"
    idempotency_key: "portfolio_id + 完整规格；纯计算，同一输入返回同一计划指纹"
    cancellation: "无取消点（输入最多 64 个资产、10000 个收益观测，求解最多 10000 轮）"
    progress: "无（同步有界求解，返回迭代轮数）"
    artifacts: "无；仅返回规划结果，不提交订单"
    error_categories: "AppErrorCategory 八类；无风险历史/未收敛为 FidelityInsufficient，非法输入或溢出为 InvalidInput"
    capability_level: "R"
  - name: plan_algo_execution
    input_schema: "AlgoExecutionSpec v1（TWAP child_count 或冻结 VWAP volume_profile）"
    output_schema: "AlgoExecutionPlan v1（parent-linked 子单数量与调度时间；schemas/algo-execution-plan-v1.json）"
    capability: "RESEARCH"
    idempotency_key: "parent_id + 完整规格；纯计算，同一输入返回同一计划"
    cancellation: "无取消点（最多 10000 个子单，有限纯计算）"
    progress: "无"
    artifacts: "无；仅返回计划，不提交订单"
    error_categories: "AppErrorCategory 八类；非法范围、profile 或算术溢出为 InvalidInput"
    capability_level: "R"
  - name: plan_capital_allocation
    input_schema: "CapitalAllocationSpec v1（组合预算、账户现金上限、策略资金申请与显式优先级）"
    output_schema: "CapitalAllocationResult v1（按优先级与 strategy_id 确定性排序的资金分配；schemas/capital-allocation-result-v1.json）"
    capability: "RESEARCH"
    idempotency_key: "portfolio_id + 完整规格；纯计算，同一输入返回同一分配"
