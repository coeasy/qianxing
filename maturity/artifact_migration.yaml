# 显式迁移表：venue/run v1 与统一 EvidenceBundle v2 均迁到 v3。未知版本仍在读入口具名拒绝
# （fail-closed）；`artifact_migration_check` 会核「登记了迁移就必须有在盘的迁移函数」。
migrations:
  - from_version: "multi-account-joint-backtest-result-json@1"
    to_version: "multi-account-joint-backtest-envelope-json@2"
    migration_fn: normalize_legacy_joint_portfolio_artifact_ref
    reader: crates/qx-app/src/artifact_store/run_record.rs
  - from_version: "run-evidence-v1@1"
    to_version: "evidence-bundle-v3@3"
    migration_fn: migrate_legacy_evidence_bundle
    reader: crates/qx-spec/src/evidence.rs
  - from_version: "evidence-bundle-v1@1"
    to_version: "evidence-bundle-v3@3"
    migration_fn: migrate_legacy_evidence_bundle
    reader: crates/qx-spec/src/evidence.rs
  - from_version: "evidence-bundle-v2@2"
    to_version: "evidence-bundle-v3@3"
    migration_fn: migrate_legacy_evidence_bundle
    reader: crates/qx-spec/src/evidence.rs

# Backtest summaries are a versioned report artifact rather than a FoundationDocument in
# schema-registry.json. Keep their writer/readability matrix here so a schema bump cannot silently
# strand persisted runs or make an old generation look current.
backtest_summary_contract:
  writer_file: crates/qx-app/src/artifact_store/backtest_summary.rs
  writer_const: BACKTEST_SUMMARY_SCHEMA_VERSION
  current_version: 7
  report_reader_file: crates/qx-cli/src/report_command.rs
  report_accepts: "5,6,7"
  acceptance_case: backtest_summary_reader_compatibility_matches_matrix
  refusal_case: legacy_summary_refusal_precedes_html_and_evidence_side_effects
backtest_summary_versions:
  v1:
    report: refuse
  v2:
    report: refuse
  v3:
    report: refuse
  v4:
    report: refuse
  v5:
    report: read
  v6:
    report: read
  v7:
    report: read_write
  v8:
    report: refuse
  future:
    report: refuse
backtest_summary_features:
  replay:
    introduced_in: 2
  input_identity:
    introduced_in: 3
  account:
    introduced_in: 4
  run_record:
    introduced_in: 5
  ashare_analysis:
    introduced_in: 6
  execution_attempts:
    introduced_in: 7
