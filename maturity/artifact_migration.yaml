# T1-2（QX-DEV-PLAN-2026-10-10 阶段 1 / 关键路径节点）：产物 schema/version 关系图与迁移表。
#
# 口径（校准 C3）：一份旧产物读进来时**必须**走「显式迁移」或「具名拒绝」二选一 —— 不许静默
# 按新版本解析，也不许把「读到的版本」吞掉只报一句泛泛的解析失败。本表把每份在册契约的这一格
# 收成一行可核对的事实：读侧是谁、版本字段叫什么、只认哪个常量、读到未知版本怎么办、拒绝文案
# 长什么样、哪条常驻用例钉住它。
#
# 本表只补「读侧版本处置」这一格，不复制 `maturity/schema-registry.json` 的内容 —— 那份仍是
# 「谁产谁消 + golden fixture」的唯一来源，两边按 `schema_id` 逐一对齐（少登记一份在册契约、
# 或多登记一份不存在的产物，都红）。
schema_version: 1
kind: artifact-migration
updated_at: "2026-10-26"
registry: maturity/schema-registry.json
# 关系图的边：一行 = 一份产物 → 一个读侧文件 → 一个版本常量 → 一条版本处置 → 一条常驻用例。
# `on_unknown_version` 当前只有 `refuse` 一态：本仓 11 份现行契约都有版本号，读侧都在解析
# 之前显式比对常量。将来若出现没有版本号的契约（只靠字段集合拒绝未知键），要**同时**扩这里与
# `artifact_migration_check` 的允许集 —— 两处一起改，不许只改表（只改表会让那一态没有任何牙齿）。
artifacts:
  - schema_id: account-snapshot-v1
    reader: crates/qx-protocol/src/lib.rs
    version_field: schema_version
    version_const: ACCOUNT_SNAPSHOT_V1_SCHEMA_VERSION
    on_unknown_version: refuse
    refusal_reason: "账户快照 schema_version={top_schema} 不受支持（本构建支持 {}..={}）"
    refusal_case: future_version_that_cannot_be_deserialized_is_still_refused_as_a_version_problem
  - schema_id: account-snapshot-v2
    reader: crates/qx-protocol/src/lib.rs
    version_field: schema_version
    version_const: ACCOUNT_SNAPSHOT_SCHEMA_VERSION
    on_unknown_version: refuse
    refusal_reason: "账户快照 schema_version={top_schema} 不受支持（本构建支持 {}..={}）"
    refusal_case: future_version_that_cannot_be_deserialized_is_still_refused_as_a_version_problem
  - schema_id: account-snapshot-v3
    reader: crates/qx-protocol/src/lib.rs
    version_field: schema_version
    version_const: ACCOUNT_SNAPSHOT_SCHEMA_VERSION
    on_unknown_version: refuse
    refusal_reason: "账户快照 schema_version={top_schema} 不受支持（本构建支持 {}..={}）"
    refusal_case: future_version_that_cannot_be_deserialized_is_still_refused_as_a_version_problem
  - schema_id: strategy-api-v1
    reader: crates/qx-strategy/src/contract.rs
    version_field: schema_version
    version_const: STRATEGY_CONTRACT_SCHEMA_VERSION
    on_unknown_version: refuse
    refusal_reason: "StrategyContractOutput schema_version 不匹配，期望 {STRATEGY_CONTRACT_SCHEMA_VERSION} 实得 {}"
    refusal_case: strategy_output_decode_entry_rejects_foreign_schema_version
  - schema_id: strategy-api-input-v1
    reader: crates/qx-strategy/src/contract.rs
    version_field: schema_version
    version_const: STRATEGY_CONTRACT_SCHEMA_VERSION
    on_unknown_version: refuse
    refusal_reason: "策略输入契约 schema_version={version} 不受支持（本构建只认 1、2、3、4、5、6、7、8 和 9）"
    refusal_case: strategy_input_contract_refuses_an_unsupported_schema_version
