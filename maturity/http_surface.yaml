# 自研 HTTP/WS 面覆盖表（P2-2 的前置，§9 排期原则 3 / §6.4）
#
# 「要不要把 API 迁到成熟 HTTP 库」不能靠感觉答。这张表把自研面**逐格登记**：
# 每一格写清「这件事由哪个符号负责、哪条用例守着、覆盖到什么程度」。缺口是数出来的，
# 不是估出来的——`verdict.accepted_gaps` 必须逐条点名本表里所有非 covered 的行，
# 由 `tools/check_architecture.py` 的 `http_surface_check` 与真实代码逐格对账。
#
# status 四档：
#   covered   有实现、有用例
#   partial   有实现，但用例没盖到（登记为已知欠账）
#   gap       没有实现（登记为已知缺口）
#   by_design 刻意不做，并写明为什么（不是漏掉）
schema_version: 1
kind: http-surface-coverage
updated_at: "2026-10-15"
self_built_file: crates/qx-api/src/transport.rs
self_built_file: crates/qx-api/src/ws.rs
self_built_file: crates/qx-api/src/admission.rs
self_built_file: crates/qx-api/src/lib.rs

areas:
  - area: request_line_and_target
    status: covered
    anchor: crates/qx-api/src/admission.rs parse_request_line
    case: crates/qx-api/tests/browser_admission.rs every_exit_of_a_cors_deployment_carries_the_same_allow_origin
    note: 请求行按空白切出 method/target；target 再按 `?` 切 route/query（split_target）。协议版本号刻意不解析——本服务只回 HTTP/1.1，不按版本分支。
  - area: request_body_framing_content_length
    status: covered
    anchor: crates/qx-api/src/transport.rs read_request_until
    case: crates/qx-api/src/transport.rs a_request_inside_the_deadline_still_reads_through_in_one_piece
    note: 只认 Content-Length 定长正文；头尾 `\r\n\r\n` 之后按它等正文。请求总量硬上界 1 MiB。
  - area: transfer_encoding_chunked
    status: covered
    anchor: crates/qx-api/src/transport.rs read_request_until
    case: crates/qx-api/src/transport.rs chunked_request_framing_is_rejected_explicitly
    note: '不实现 chunked；任何 `Transfer-Encoding` 请求在读取正文前以 `InvalidData` 和明确的 unsupported framing 原因拒绝，不再按空正文误读。'
  - area: duplicate_content_length
    status: covered
    anchor: crates/qx-api/src/transport.rs read_request_until
    case: crates/qx-api/src/transport.rs duplicate_content_length_is_rejected_as_ambiguous_framing
    note: '头名大小写不敏感地统计全部 `Content-Length`；出现重复值立即拒绝，避免对同一请求产生两种正文边界解释。'
  - area: request_overall_deadline
    status: covered
    anchor: crates/qx-api/src/transport.rs HTTP_REQUEST_DEADLINE
    case: crates/qx-api/src/transport.rs dribbling_client_is_cut_by_the_overall_request_deadline_not_by_the_per_read_timeout
    note: 100ms 单次读超时挡不住"每 99ms 滴一字"的对端；整条请求另有一把 5 秒墙钟，到期即断，免得一条连接线程与一份连接额度被磨几十小时。
  - area: response_status_line
    status: covered
    anchor: crates/qx-api/src/transport.rs write_http_response
    case: crates/qx-api/tests/status_line_and_limiter_exit.rs the_rate_limit_exit_says_the_same_thing_in_the_status_line_and_the_body
    note: 状态行短语覆盖本构建写出的每一个状态码；落进兜底那格给 Unknown 而不是复用 500 的短语——新增没登记的状态码不该被一个听起来对的词盖住。
  - area: response_204_without_content_length
    status: covered
    anchor: crates/qx-api/src/transport.rs write_http_response
    case: crates/qx-api/tests/browser_admission.rs preflight_from_a_listed_origin_is_204_and_never_echoes_the_requested_headers
    note: 204 不写 Content-Length（RFC 9110 §15.3.5）。预检那条正是 204，写上去会被严格实现读成协议错误。
  - area: cors_preflight
    status: covered
    anchor: crates/qx-api/src/admission.rs preflight
    case: crates/qx-api/tests/browser_admission.rs preflight_from_an_unlisted_origin_says_403_with_its_own_code_name
    note: 预检按 `api.cors_allowed_origins` 逐字符比对；不在册的源回 403 并带自己的码名；没有名单时预检落到 404 且不出任何 CORS 头（不假装允许）。
  - area: query_percent_decoding
    status: covered
    anchor: crates/qx-api/src/admission.rs percent_decode
    case: crates/qx-api/src/http_contract_tests.rs percent_decode_directly_covers_encoded_text_plus_and_malformed_bytes
    note: 直接核对 %XX、加号空格、UTF-8 多字节还原，并拒绝不完整转义、非十六进制字符和非法 UTF-8。
  - area: header_lookup_case_insensitive
    status: covered
    anchor: crates/qx-api/src/admission.rs header_value
    case: crates/qx-api/src/http_contract_tests.rs header_lookup_matches_ascii_case_insensitively_and_ignores_body
    note: 直接核对混合大小写、首尾空白裁剪、查无此头，以及正文中的伪头不参与查找。
  - area: connection_budget
    status: covered
    anchor: crates/qx-api/src/admission.rs DEFAULT_MAX_CONCURRENT_CONNECTIONS
    case: crates/qx-api/tests/browser_admission.rs every_exit_of_a_cors_deployment_carries_the_same_allow_origin
    note: 在册连接额度 256；占满即拒，不排队等——一条连接线程被磨住不能变成整站 503。
  - area: refuse_drain_budget
    status: covered
    anchor: crates/qx-api/src/transport.rs refuse_connection
    case: crates/qx-api/src/transport.rs a_dribbling_refused_peer_cannot_hold_the_accept_thread_past_the_drain_budget
    note: 拒绝一条还没读过字节的连接时，排空对端已发字节有 200ms 墙钟上界；这条循环跑在唯一的 accept 线程上。
  - area: keep_alive
    status: by_design
    anchor: crates/qx-api/src/transport.rs write_http_response
    case: crates/qx-api/tests/accept_loop_shutdown.rs plaintext_accept_loop_serves_then_returns_on_the_stop
    note: '每条响应恒带 `Connection: close`，刻意不做 keep-alive/流水线。运维读面是"轮询 + WS 增量"的形态，短连接够用；不做长连接就不必处理流水线乱序与半关连接的两套边界。'
  - area: tls_and_mtls
    status: covered
    anchor: crates/qx-api/src/transport.rs tls_stream
    case: crates/qx-api/tests/accept_loop_shutdown.rs mtls_accept_loop_returns_on_the_stop
    note: TLS 走 rustls（不做自研密码学）；mTLS 客户端证书到操作员身份的映射在 lib.rs 的 TlsConfigStore 上，可热替换。
  - area: ws_handshake_accept
    status: covered
    anchor: crates/qx-api/src/transport.rs websocket_accept
    case: crates/qx-api/tests/browser_admission.rs a_request_body_cannot_hijack_the_websocket_handshake
    note: Sec-WebSocket-Accept = base64(SHA-1(key + GUID))，SHA-1 与 base64 都是本仓自带的定点实现（websocket_accept / sha1 / base64_encode）。
  - area: ws_close_frame_detection
    status: covered
    anchor: crates/qx-api/src/ws.rs WsCloseScanner
    case: crates/qx-api/src/ws/tests.rs a_complete_close_frame_is_detected
    note: Close 帧 opcode 0x8 只认帧起点的帧头；按整块缓冲逐字节扫会把 16 个字节值都命中，正常载荷被误判成断连（V13 R11 修）。
  - area: ws_frame_write_lengths
    status: covered
    anchor: crates/qx-api/src/transport.rs write_ws_text
    case: crates/qx-api/src/http_contract_tests.rs websocket_text_writer_encodes_all_three_payload_length_forms
    note: 直接断言 125/126/65,536 字节正文分别使用 7/16/64 位长度编码，并核对总帧长度。
  - area: ws_ping_pong
    status: covered
    anchor: crates/qx-api/src/ws.rs respond_to_client_frames
    case: crates/qx-api/src/ws/ping_pong_tests.rs client_ping_gets_an_unmasked_pong_with_the_same_payload
    note: 对端 Ping 按跨读帧边界解析，服务端返回载荷相同的未掩码 Pong；服务端不主动发 Ping，WS_MAX_IDLE_ROUNDS 仍作为双向静默上界。
  - area: ws_client_frame_masking
    status: covered
    anchor: crates/qx-api/src/ws.rs WsCloseScanner
    case: crates/qx-api/src/ws/tests.rs an_unmasked_client_frame_ends_the_session
    note: '所有客户端帧必须带 RFC 6455 掩码位；扫描器按协议跳过 4 字节掩码键，未掩码帧使会话立即收摊。'
  - area: accept_loop_lifecycle
    status: covered
    anchor: crates/qx-api/src/lib.rs serve
    case: crates/qx-api/tests/accept_loop_shutdown.rs plaintext_accept_loop_returns_without_any_connection
    note: 停机令牌在阻塞等待之前先读；已握手会话读到令牌即回 server_shutdown，join 回得来（V13 R13）。
  - area: route_fallback_404
    status: covered
    anchor: crates/qx-api/src/lib.rs serve_tls_mtls_with_stores
    case: crates/qx-api/tests/status_line_and_limiter_exit.rs a_broken_rate_limit_backend_says_service_unavailable_not_internal_error
    note: 未列出的路径一律 404，不静默 200；这条口径与 deploy/README 的端点表由 api_surface_doc_check 双向钉住。

verdict:
  decision: keep_self_built
  reason: 上表 21 格里 20 格 covered、0 格 gap、0 格 partial、1 格 by_design。请求 chunked framing 与重复 Content-Length 均明确 fail closed；客户端未掩码 WS 帧立即结束会话。客户端 Ping 会收到同载荷 Pong，服务端不主动发 Ping；迁库仍需改动 route/service 契约、mTLS 操作员映射、连接额度与停机令牌四处已由判据钉住的边界，当前不构成迁库理由。
  accepted_gaps:
  migration_trigger: 出现下列任一条即重新评估迁库：① 需要一个本仓读面真正要用的 HTTP 特性（keep-alive/流水线、chunked 请求体、HTTP/2、代理转发头语义）；② 需要把 API 暴露给不受控客户端，届时"重复 Content-Length 该拒""未掩码客户端帧该断"这类规矩从"本仓不用"变成"必须防"；③ WS 需要双向载荷（本通道现在是单向推送）。
