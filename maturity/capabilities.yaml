      - api_serve_tls_termination_is_pinned_by_the_static_check_only：J2-N1 实测——把 mTLS 那条生产调用点（strategy_contract.rs:824）的实参换成 `&|| false`，只有门禁红，明文侧那条常驻用例咬不到另一颗入口；给 mTLS 补同形状的终止性用例需要一套真实证书夹具，本轮没有为此新增依赖 (V11 J2)
      - accepted_socket_nonblocking_reset_has_no_teeth_on_this_platform：拿掉 `accept_polling` 里那句 `stream.set_nonblocking(false)` 复位，本机（Windows + rustc 1.98）的常驻用例与全部测试仍绿，只有「两条长驻入口都把同一个 stop 交给同一颗循环」那一项红（J2-M3 实测）——各平台对被接出的流是否继承监听套接字的非阻塞模式并不一致，这一颗在跨平台真机之前买不到更多证据，按防御性复位保留 (V11 J2)
      - websocket_event_stream_exits_only_on_client_or_bus：`/events/live` 的处理循环每 100 ms 被 `wait_after` 唤醒一次，可唤醒之后读的是客户端字节——它的出口是"客户端关掉 / 连接复位 / 总线要求 resync"，不是停机令牌。这不阻断停机：连接线程由 `spawn_connection` detach 出去，`run_runtime_api` 主线程 join 的是 accept 循环（那颗令牌 J2 已接上），进程退出时把这些线程一起带走。真正没人管的是"一条静默而不关的连接会一直占着一条线程与一个事件总线读者、且并发连接数没有上界"——M2 逐行读过 `serve_websocket` 之后按这一格登记，而不是把它写成缺陷 (V11 M2)

      - cancel_order_has_no_executor_yet：P1 拒的是「没人执行的种类」，CancelOrder 由此不可受理；「撤单该由谁执行」这条链本身仍未接，是产品口径而不是连通性缺口，本轮没有替它决定 (V11 P1 §50.6)
      - acceptance_and_recovery_are_two_different_predicates：判据搬进结构性 validate 会让已落盘的历史命令读不回来（P1-M2 实测断言红 + 门禁红两项），但「受理处与恢复读侧必须是两颗不同的判据」这一形状本身由门禁数出来，而不是由某一条用例断言 (V11 P1)
      - snapshot_history_cap_value_is_pinned_by_the_gate_only：那三条用例各自按 MAX_SNAPSHOT_HISTORY 自己填窗口，把界从 1_024 抬到 65_536 之后 3 颗仍全绿（R4-6-M-c，仅门禁红，单轮耗时 0.02 秒涨到 56.26 秒）——用例钉的是『有界、且按最近写入退场』这个形状，具体数值只有门禁的文本锁钉得住，数值飘了不会有用例红。反过来，去掉『把重装摘要挪回队尾』那一步是断言红加门禁红（R4-6-M-b）：判据原先只数 `position(...)` 与 `push_back(...)` 两颗，补上 `remove` 那一格之后才咬得住『找到了旧位置却没把它退出来』这种半修法 (V11 R4-6)
      - audit_window_rollover_turns_unknown_command_into_a_full_runtime_stop：R5-1 的有界窗口把终态命令移出主表之后，worker 若在那之后回报，控制面只能回 `UnknownCommand`；`QueuedControlCommand`（crates/qx-storage/src/lib.rs:1100）没有重试计数，worker 拿到 Err 就以非零码退出，`supervise_workers`（crates/qx-orchestrator/src/lib.rs:224）的循环在子进程退出时 `return Err`（:297，那一格的报告文字在 :298）停掉其余 worker——实测后果是一次整店停机，不是静默空转。要让控制面为窗口之外的身份作证就得留永久墓碑表，而那正好把 R5-1 收住的有界窗口重新打开；且 `UnknownCommand` 与"状态文档被回滚成旧版本"在生产里同形，改成静默跳过等于给后者开门。本轮按实测改口后只登记不修 (V11 R6-5，§54.5)
      - control_audit_summary_same_source_is_pinned_by_the_gate_only：R7-8-M5 与 M6 实测——把降级在两半各写一遍（行为等价）与摘掉常驻用例里读摘要那一半，两颗的用例档全绿，只有本轮新增的那颗同源判据红（`tools/check_architecture.py:3439`）。同族的 M4 首跑是 SURVIVED：当时的用例只读流水那一半，补上"同一请求里摘要也要跟着现读"之后重跑才落到断言红（两份日志都在 `maturity/evidence/v11-r7/` 下，mut_r7b_r78.txt 与 mut_r7b_r78b.txt）。同族形状见上面 control_audit_live_read_is_pinned_by_the_static_check_only (V11 R7-8)
