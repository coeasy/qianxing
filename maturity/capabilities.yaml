      - crates/qx-api/src/lib.rs + crates/qx-cli/src/venue_runtime/binance_reconcile.rs hold the three reconcile coverage counts as Option<usize> with serde(default)：Binance Spot 那条链没去取的项写 null 而不是 0，落盘的老报告仍可读出 (V11 Q69)
