schema_version: 1
updated_at: "2026-09-26"
default_profile: single_node

# 证据等级：
# implementation     代码/配置已存在
# code_tested        本地测试、契约测试或 Paper E2E 已通过
# sandbox_tested     真实供应商沙盒/模拟账户已通过
# production_approved 真实生产凭据、故障演练和运维审批已通过
profiles:
  single_node:
    storage: sqlite_or_files
    messaging: disabled
    intended_use: local_research_backtest_paper
  distributed:
    storage: postgres_or_files
    messaging: optional_nats
    intended_use: explicit_future_deployment

capabilities:
  deterministic_kernel:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - crates/qx-core
      - crates/qx-cli/tests/cli_dispatch.rs
      - cargo test --workspace
      - crates/qx-core/src/sourcing.rs replay is the single re-drive kernel (per-event append_checked, re-applied LedgerApplied facts, whole-log validate) and replay_facts/rebuild_ledger/verify are only its projections (V11 Q62)
      - crates/qx-core/src/sourcing.rs verify(events, &Ledger) compares the replayed ledger against the run ledger, so a mutated account with a matching digest still fails (V11 Q62)
      - tools/check_architecture.py replay_kernel_check holds 11 items over that kernel, both engine exits, the artifact choke point, the depth-chain causality slots and the named cases (V11 Q62)
      - crates/qx-protocol/src/lib.rs write_scalar_money tags presence before the value, so an uncomputed money field and a computed zero are two different state_hash inputs (V11 Q67)
      - crates/qx-protocol/tests/snapshot_single_source.rs uncomputed_money_is_not_the_same_state_as_computed_zero walks all eight account money scalars through hash, seal/validate, both wire formats and both diff directions; the eighth one is equity_raw, added to OPTIONAL_MONEY_FIELDS by V11 Q70 (V11 Q67/Q70)
      - crates/qx-protocol/src/lib.rs AccountSnapshot.equity_raw is Option<i128> and scalar_money_raw reads all eight fields straight, so no Some(...)/unwrap_or inside that fn can fold an uncomputed amount back into a legal zero (V11 Q70)
      - crates/qx-core/src/file_lock.rs FileLock 是仓库里唯一的写锁定义点，decide_lock(age, stale_after, takeover_used) 是唯一的纯判据；registry / 多腿订单簿 / 作业队列 claim / 存储信封四处各改一行委托它，内核之外不再 remove_file 别人的锁，进程被杀之后孤儿锁会被接管而不是永久阻断四条链 (V11 D1)
      - crates/qx-core/src/file_lock.rs lock_age 以 min(mtime, now) 做基准，时钟回拨时年龄不可能为负；读不到年龄一律 Wait 而不是抢 (V11 D1 L4)
      - crates/qx-core/tests/ledger.rs + crates/qx-core/src/ledger/fill.rs base_asset_of / fee_in_settlement_raw 是费用币种唯一的判定处：记账腿只记折算后的数，现货基准资产费用按该笔成交自己的价格定点折算（不引入外部汇率、只对 contract_size 乘数为 1 的口径开放），折不了算的按 ReconcileRequired 而不是把整条链挡在门外 (V11 D2/D5)
      - tools/check_architecture.py 把上面两条钉成常驻判据：「文件写锁 FileLock 只有一个定义点」「锁文件的抢占与释放不再各写一份」「四个消费方各委托 qx-core::file_lock」「锁的『同一场竞争只接管一次』住在 decide_lock 里，且抢锁循环把计数喂回判据」「成交费用腿只有一个记账点」「手续费币种判定住在唯一的折算函数里」「基准资产费用用成交自身价格折算」「折算只对乘数为 1 的现货口径开放」 (V11 D1/D2/D5)
      - crates/qx-scheduler/src/lib.rs 的 start_run_at 把 deadline 按毫秒落在 started_ts + timeout_seconds * 1_000 上：此前 30 秒超时的作业其 deadline 是启动后 30 毫秒，且 /scheduler/runs 原样外销那一格。用例两侧都钉——started+29_999 未超时、started+30_000 超时（`run_records_deadline_for_timeout_monitoring`），只钉后一半时把单位改回秒并放大预算十倍也能绿 (V11 N1)
      - sweep_timed_out(now) 是超时收口的唯一入口（判定复用 is_timed_out、改写复用 mark_timed_out），生产派发每轮先扫（crates/qx-cli/src/scheduler.rs:182）：一条卡死的 Running 不再永久占着 concurrency_key。`sweeping_a_stalled_run_gives_the_concurrency_key_back` 钉「键真的还回来」，`worker_tick_sweeps_a_run_left_running_by_a_crash` 钉「崩溃留下的那行会被收掉」 (V11 N2)
      - 窗口与交易日历的判据只有 due_jobs_with_calendar 一颗：生产派发（crates/qx-cli/src/scheduler.rs:190）与库内执行面（crates/qx-scheduler/src/lib.rs:256）共用它，`JobWindow` / `TradingCalendar` 从此不是只能被 due_jobs 绕过的装饰 (V11 N3)
      - crates/qx-scheduler/src/job_spec.rs:73 的 undispatchable_by_registry 是纯判据，装配处 crates/qx-cli/src/scheduler.rs:151 的 validate_job_triggers 在载入与新建两条路径各问一遍：注册表派不动的 `Retry` / `Event` / `Manual` 声明当场拒，而不是躺在 jobs.json 里静默不入队（用例 `undispatchable_trigger_shape_fails_closed_at_assembly`）；零引用的 retry_run 随之删除 (V11 N4)
      - 两颗零生产调用的重复写法按 J1 删除：submit_order_via_gateway_with_risk（删前在 crates/qx-execution/src/lib.rs:1329，只是 submit_command_with_risk 的转发壳，全仓连用例都没有）与 complete_reconcile（删前在 crates/qx-zhenlu/src/lib.rs:1261，而 reconcile_snapshot 自己就会把状态推到 Live——留着等于允许跳过真实比对直接改状态） (V11 N6)
      - tools/check_architecture.py 的 m4_production_text()（:3336）把「活替代仍被生产走到」从「符号出现在文件文本里」改成「符号出现在该文件第一个测试模块之前」：改之前 start_run_with_manifest 的替代被钉在 SchedulerWorker::run_cron_tick 内部，而那颗住在 #[cfg(test)] 之后、零生产调用 (V11 N7)
      - crates/qx-core/src/fenye.rs（464 行、自身文件之外零消费者）连同 lib.rs 的挂载声明一起删除，DEAD_MODULE_LANDING 钉住"分野"以模块形态复活的形状 (V11 E2)
      - crates/qx-runtime/src/pipeline.rs 的订单登记与 PostgreSQL 构造各留一颗活写法（`register_order_with_correlation`、`open_postgres_with_pool_size`），M4 删掉的十颗零调用公开写法每一颗都仍有一份被生产走到的替代；来源关联号不只钉在门禁文本上——crates/qx-execution/src/tests/gateway_port.rs 的 `control_submits_register_correlation_and_plain_submit_keeps_worker_shape` 断言两条控制面入口各自写 `control:{command_id}`、非控制面提交保持 `{worker}:submit:{client_id}`，crates/qx-execution/src/tests/recovery_and_replay.rs 断言补偿腿登记点名 worker/组/腿（`{worker}:hedge:{group}:{leg}:register`） (V11 M4)
      - crates/qx-scheduler/src/lib.rs:628 的 finish_run_with_code 只在 !success 时落 error_code：成功那条运行记录不再带着一次从没发生过的错误码外销到 /scheduler/runs，而重试判据与 NeedsIntervention 仍按同一格匹配 retryable_codes；常驻用例 a_successful_finish_refuses_an_error_code 钉住成功一侧（V11 O1）
      - crates/qx-core 不再有引擎、因果队列与时钟对象：src/engine.rs、src/queue.rs 与那份从未接线的 TestClock一并删除，src/clock.rs 只剩一句 `pub type Ts = u64;`（10 行）。时间轴口径改由两条真实推进路径承担（回测按 bar 序列推进、实盘由 crates/qx-runtime/src/pipeline.rs 的 append_at_engine 按 (ts, prio) 单调落盘），README 设计底线、crates/qx-core/Cargo.toml description、tools/validate_core.py 的「参考形状」与本方案 §1 四处来源同时改口；PRIO_* 数值仍逐项等于 qx-core/src/event.rs 的 prio（V11 P2）
      - README 对卯眼（`crates/qx-plugin`）的承诺改到与实际可达性同口径，两处（crate 表速查行、「三条容易被读过头的边界」那一节）按能力逐颗点名未接线：`sign_ed25519`（lib.rs:259）、`bootstrap_plan`（:44）、`Profile::assemble`（:438）在全部 crate 的生产文本里零调用点。接到的是另一条链：动态库字节的 detached Ed25519 由 `crates/qx-strategy/src/c_api.rs` 校验、production 配置强制公钥与签名成对，而 `qx verify` 注册的清单签名是 `fnv1a:` 自检（`crates/qx-cli/src/selfcheck.rs`）——两条口径不得混读 (V11 Q4)
      - 同一份 README 里卯眼的两颗生命周期超时改到与可达性同口径：`healthcheck_timeout_ms`（crates/qx-plugin/src/lib.rs:122）与 `shutdown_timeout_ms`（:123）只被 `validate`（:169）问非 0、被 `canonical_hash`（:240）计入指纹，仓内没有任何一处把它们换算成等待——L4 收口的是配置文件里那颗同名字段，manifest 这两颗是同一族的漏网，README 的 crate 表速查行与边界那一节各点名一颗 (V11 R4-3)
      - 常驻判据 `plugin_claim_honesty_check`（`tools/check_architecture.py:7138`）比较的是『生产文本里有没有把这两颗换算成等待的写法』与『README 引用它的那一行有没有说它走不到』，并带一颗反向排除：`config.shutdown_timeout_ms` 那条真接线不算违规——同名不同命，去掉排除之后 M4 当场红 (V11 R4-3)
      - tools/check_architecture.py plugin_claim_honesty_check 4 项：逐颗对齐（README 引用它那一行说它走不到 ⟺ 生产文本零调用点）、速查行按能力族、fnv1a 与 C ABI 不得混读、行号由判据从 README 自己印出的引用抠出来再回源码核对。把 (file, line, symbol) 硬抄进门禁只能证明门禁没写错，证不了文档没漂——Q4-M3 在第一版判据下实测 SURVIVED (V11 Q4)
      - 四份文本的行号引用共用一颗扫描器 `citation_audit`（`tools/check_architecture.py:6316`），台账侧是 `capabilities_citation_check`（`tools/check_architecture.py:6443`）、三份长文档侧是 `doc_citation_check`（`tools/check_architecture.py:6457`），逐份地板钉在 `DOC_CITATION_TARGETS`（`tools/check_architecture.py:6261`）：方案书 580 引用 / 50 带名、变更日志 220/25、白皮书 410/60、台账 90/20 (V11 R6-8)
      - 裸行号的归属由 `CAP_BARE_PATH`（`tools/check_architecture.py:6241`）扩到"同一行只点了文件名、没带行号"那一颗：R6-9 实测因此多量到 61 颗引用、当场判红 12 颗，其中一颗是"数字恰好落在误认文件长度之内"的假通过 (V11 R6-9)
      - 快照四张键表的行内自指 id 由一颗共用判据约束：`state_hash`（`crates/qx-protocol/src/lib.rs:293`）只吃 map 的键，行内那一份 `order_id`/`fill_id`/`transfer_id` 从不进摘要，"写侧恰好一致"因此不可能是契约。约束收在一处而不是四句 `if`：`validate`（`crates/qx-protocol/src/lib.rs:198`）里四张表共用一颗 `check_keys`（同文件 :203，四表共用的理由写在 :199 那行注释），三处调用点在 :228、:232、:236，键与行内 id 不等就抛 `ProtocolError::Invalid`（同文件 :742）。反例用例 `key_tables_reject_rows_whose_inline_id_disagrees_with_their_key`（`crates/qx-protocol/tests/snapshot_single_source.rs:775`）逐表钉两层：先断篡改之后哈希一字未动（证明这一格哈希校验抓不到），再要求报错点名自己的表与那一对键/行内 id——三张表的夹具在 :781 那份 `cases` 数组里（order 77 / fill 9 / transfer 3），逐颗改坏的循环在 :798 (V11 R7-3)
      - 抢锁循环不再自己量年龄：`decide_lock`（`crates/qx-core/src/file_lock.rs:51`）把 `age` 随判定一起交出，`Takeover` 支（`crates/qx-core/src/file_lock.rs:148`）与 `Wait` 支（同文件 :162）只按交出的年龄说话（含 `Retry::after_ms` 的回填）。"这把锁这一刻多老"在一次抢锁里因此只有一个来源，两条常驻用例分别钉两侧：`second_stale_sighting_in_one_competition_waits_instead_of_deleting`（同文件 :339）与`takeover_happens_at_most_once_per_competition`（:444） (V11 R7-9)
      - `JobSpec`（`crates/qx-scheduler/src/job_spec.rs:98`）不再收三格只有写侧没有读侧的必填声明：`input_refs` / `output_refs` / `permission_scope` 从结构里删掉，"每一格都必须有读者"这条口径写在它上面的注释里（同文件 :92），未知字段不再被拒所以升级前落盘的调度状态与队列信封照旧读得动（`retired_job_spec_keys_are_ignored_by_the_loader`，`crates/qx-scheduler/src/lib.rs:830`）。`permission_scope` 那个名字替一种并不存在的授权作保过：控制面问的是 `has_permission`（`crates/qx-control/src/lib.rs:575`）与那颗 `required_permission`（同文件 :38），作业声明里那一格从未被读过。两颗门禁钉住退场：字段名单可解析且不含那三格（`tools/check_architecture.py:6973`）、deploy 里 3 份作业清单示例的顶层键逐颗在名单里（同文件 :6985，只删代码不删示例，下一个人会照示例抄回来） (V11 R7-4)
    limitations:
      - three_kernel_invariants_are_pinned_by_text_only：log.validate() inside the kernel, the deposit's Priority::TIMER slot and the engines' `)?;` propagation all stay green when mutated, because the negative cases call the kernel directly instead of driving run() (V11 Q62 §25.3)
      - takeover_count_feedback_is_pinned_by_the_gate_only：把 `acquire` 循环喂给 `decide_lock` 的自家接管计数改成不喂，`crates/qx-core/src/file_lock.rs` 那 8 条单元用例全绿——`takeover_happens_at_most_once_per_competition` 问的是纯判据本身，不驱动循环；只有门禁「锁的『同一场竞争只接管一次』住在 decide_lock 里，且抢锁循环把计数喂回判据」红（V11 D1 L3b，§41.7 第 3 条）
      - derivative_fee_conversion_stays_closed_by_the_gate_only：把 `apply_fill_with_spec` 传给折算函数的那颗 `None` 换成"衍生也认基准资产"，`crates/qx-core/tests/ledger.rs` 8 条费用用例全绿——衍生侧唯一的异币种反例用的是第三种币种（FDUSD），既不是基准资产也不是结算币种，改坏之后照样 `ReconcileRequired`；只有门禁「折算只对乘数为 1 的现货口径开放，衍生条款严格认结算币种」红（V11 D2 M2，§41.7 第 3 条）
      - account_snapshot_qifi_export_is_taken_by_a_test_only：`to_qifi()`（crates/qx-protocol/src/lib.rs:390）在仓内只有同文件 `mod tests`（:797 起）的一处调用（:854），QIFI 导出的真实消费者在仓库之外；J1 按"某条能力的唯一实现留着并登记"处置 (V11 J1)
      - runtime_check_health_clock_is_taken_by_the_gate_only：把体检那条 `snapshot(runtime_timestamp_ms(), config.shutdown_timeout_ms)`（runtime_check.rs:15，L4 修掉的正是一格恒为假的过期判定）换成 `snapshot(0, …)`，`crates/qx-runtime/src/supervision/tests.rs` 的 `health_snapshot_detects_stale_ready_service` 仍绿——那条用例问的是 `snapshot(now, stale)` 这颗纯判据本身，不驱动体检那条调用；而 `runtime-check` 跑在任何 worker 启动之前，注册表里只有 `Starting` 行（`health_observed` 因此恒为 false），取 0 与取真实现在那条路上印出同一份 JSON。这一格的天花板是 L4 那四项门禁判据，不是用例 (V11 L4)
      - account_reconcile_verdicts_are_crate_local：`qx-genglu/src/reconcile/account.rs` 的四颗账户维度判据（`reconcile_cash` account.rs:16、`reconcile_fees` account.rs:57、`reconcile_funding` account.rs:65、`reconcile_fills` account.rs:141）只有本模块 `reconcile/tests.rs` 走过——仓内 `qx_genglu::` 唯一的外部消费者是 reconcile.rs:12 的订单维度 `reconcile_order_facts`。其中 `reconcile_cash` 与生产现金对账 pipeline.rs:699 的 `settlement_balance_discrepancies`（ccxt_reconcile_worker.rs 与 binance_reconcile.rs 各走一次、喂账户快照的 discrepancy_count）判据重叠而形状不同（多币种 map 对结算币种单格），接谁是唯一真相源是一处待裁决，发布前不单方面删掉一整维对账；`reconcile_fees`/`reconcile_funding` 缺的是 venue 侧 cashflow/funding 取数器（同 paper_execution 那条 binance_reconcile_still_fetches_only_balances_and_orders 限制），不是比较逻辑本身 (V11 M4)
      - zero_caller_library_surface_kept_by_design：qx-plugin 的扩展点词表 `POINT_*`（lib.rs:17 起十颗）里只有 MATCHER/FEE_MODEL 两颗被 `crates/qx-cli/src/selfcheck.rs` 走到，其余 8 颗零引用——`Provides.point` 是自由字符串，`Manifest::validate` 不按词表拒，拒了要连带仓外插件 manifest 一起收口；同一形状还覆盖 `feature_keys`（qx-factor/src/lib.rs:1345）、`requested_artifacts`（materializer.rs:138）、`with_registry_capability`（provider.rs:73）、`is_negative`（numeric.rs:133，宏生成的对称谓词之一）、`bars_as_of`（qx-guanxing/src/lib.rs:364，README 把 as_of 点时可见性写成观星能力）与 `register_order` 那颗 2 参写法（pipeline.rs:750，只有用例读）。同一形状还覆盖 qx-scheduler 的库内执行面（V11 N4b）：`JobExecutor`（scheduler/src/lib.rs:206，全仓唯一实现是同文件 `mod tests` 里的 RecordingExecutor）、`WorkerOutcome`（scheduler/src/lib.rs:211）、`SchedulerWorker`（scheduler/src/lib.rs:217）的四颗派发入口 `run_cron_tick_with_calendar_and_manifest`（scheduler/src/lib.rs:222）、`run_cron_tick_with_calendar`（scheduler/src/lib.rs:245）、`run_event_with_manifest`（scheduler/src/lib.rs:270）、`run_manual_with_manifest`（scheduler/src/lib.rs:298），它们背后的两条到期判据 `due_event_jobs`（scheduler/src/lib.rs:436）与 `due_manual_jobs`（scheduler/src/lib.rs:458），以及 `retry_run_at`（scheduler/src/lib.rs:656，唯一把 `retry_policy` 的退避判定变成一次真实重投的入口，`finish_run_with_code` 只写 `next_retry_ts`）——生产派发走 crates/qx-cli/src/scheduler.rs 的持久作业队列，这十颗一颗都没有生产调用者，但 `run_event_with_manifest`/`run_manual_with_manifest` 是 `Trigger::Event`/`Trigger::Manual` 在仓内唯一的派发者：删掉就等于把两条触发声明变成只能被装配处当场拒绝。留下这一批的代价由守卫付：`undispatchable_by_registry` 必须在装配时就拒掉注册表派不动的声明，否则一份 jobs.json 里的 Manual 作业会静默不入队。两条未决问题随之登记在 §48：`qx_scheduler::TradingCalendar` 在仓内没有任何写入者（只有 `default()` 与用例里的 `insert`），作业队列按 `run_id` 落盘而不携带 `attempt`，所以重试既无派发者也无法重投；V11 P3 以同一形状登记 `qx-runtime/src/data_binding.rs`（333 行，「数据集 → 因子计划 → 策略上下文 → RunManifest 同源血缘」这条判据在仓内唯一的一份实现）：`RuntimeDatasetBinding`（data_binding.rs:13）、`RuntimeResearchBinding`（data_binding.rs:78）与给 `StrategyContext` 加上的 `validate_research_binding`（data_binding.rs:165）——三颗都没有生产调用者，只有同文件 `mod tests` 走过；回测与实盘各在链上核自己那半的 `data_fingerprint`，所以这一格是「有实现、没接线」而不是「有接线、没实现」。接成装配处的必经过点要先定