      - backtest_csv_artifacts_are_export_face_only：`.equity.csv` 与 `.fills.csv` 是给人和仓库外工具按位置取数的出口，不是第二处事实源——生产链上没有任何解析器（`qx report`/`qx verify` 读的是 `.summary.json` 与 `.run.json`），所以"形状漂了没人知道"这一格改由读者承担：常驻用例整串比对两份表头、逐行核对列数、把成交明细的行数对回摘要声明的笔数，门禁那三行钉住"写侧唯一 + 读侧在场"。同一格里另一条仍未收口，且是有意的边界：**回测产物不进 HTTP 读模型**——`/scheduler/runs` 是调度作业的运行记录，与回测无关，只读端点上今天读不到某一轮回测的权益曲线；接它要新增端点加一份产物→读模型的投影，属发布后的决定，本轮只登记 (V12 R7-h)
      - four_backtest_provenance_keys_stay_json_only：A6 补的是三格，另四格仍在册未接——`rejection_reasons`（`crates/qx-cli/src/backtests/artifacts.rs:358`）与 `assumptions`、`model_descriptors`（:382/:383）、`signal` 块（:405-415）在 `report_readout.rs`、`config_commands.rs`、`crates/qx-api/src` 三处生产文本面实测各零命中，今天只有 `qx report --json` 整份外销与 `*.spread-attribution.json` 两个出口，所以「被挡下的委托具体因为什么被挡」仍要机读才答得出；补它要新增读法与一行排版预算，本轮不为此造第二条判据，登记为遗留限制 (V13 第 8 轮 A6 实测)
