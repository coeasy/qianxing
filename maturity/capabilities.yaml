      - four_wait_budgets_are_constants：SLOT_WAIT_BUDGET 60 秒、CONNECT_TIMEOUT_SECONDS 10 秒、CCXT_RESPAWN_STRIKE_BUDGET 3 与握手块沿用那颗 socket 超时都是仓内默认而非配置项，本轮按「有界」收、没有按「可调」收，与上面那条 websocket_message_budget_is_a_constant 同族 (V11 O7/O8/O9 §49.12)
