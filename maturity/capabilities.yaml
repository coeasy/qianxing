      - MAX_WEBSOCKET_MESSAGE_BYTES = 16 MiB 现在两处都问：帧头声明的长度一超预算就在读取载荷之前失败（不为收不下的消息先分配那 16 MiB），分片累计超预算报「累计」。两条常驻用例各守一格，其中分片那条两侧都有对照——整条消息恰好等于预算必须放行 (V11 N11)
      - crates/qx-cli/src/venue_runtime/binance_stream_worker.rs:88 与 :194 的停机自报同时带事件数与 reconnects=：N10 之后静默既不切断会话也不充抵重连预算，于是一条「看着活着、其实一直在重连」的流只有把这个计数印出来才看得见（O4-M1 丢掉计数只有门禁红）(V11 O4)
