      - backtest_initial_cash_and_paper_worker_cash_never_meet：strategy.initial_cash_raw（回测）与 worker.paper_initial_cash_raw（paper）是两格且互不知情，Q72 把前者做成回测唯一的声明入口并在文档注释里点名后者，但没有任何判据要求同一份配置里两格同时出现时必须是同一个数 —— 使用者完全可以回测按 A、paper 按 B 再拿两边数字互相印证（V11 Q72 §34.5 第 2 条）
      - multi_leg_chain_still_prints_no_account_line：四条链里只有它没有 `[X · Account]` 播报，因为它同时是最长的一条（`multi_builtin.rs` 498/500 行），再加 4 行就翻过 Phase 4s 的兄弟模块线；本轮给它的是拒收那一格声明 + 归因产物里的 `account_base_source`，补齐得先搬家（V11 Q72 §34.5 第 1、4 条）
      - qx_genglu_sharpe_ratio_is_not_taken_by_any_report：`sharpe_ratio()`（crates/qx-genglu/src/lib.rs:39）全仓零调用、连用例都没有——J1 那一轮读它的是 `report()`（当时住在 :76、返回 `Metrics`），而它只取 total_return 与 max_drawdown。接进报表还是删，是一处待裁决，本轮只登记 (V11 J1)。V11 Q3 把与它同族的 `Metrics`/`BasicAnalyser` 删了（那份绩效汇总在仓内有活的替代写法：`BacktestReport` 的成交数、费用、收益、回撤与期末权益），`sharpe_ratio` 从此是更路里唯一一份绩效计算，也是唯一一颗连用例都没有的那一份；同轮的删除还让 `max_drawdown`（:13）与 `total_return`（:31）失去唯一的使用者 `report()`，现在只剩同文件用例在读 ——三颗与 `BacktestReport` 的 bps 口径不是同一份算术，所以整族仍是「有实现、没接线」。:76 那一格今天属于 `total_by_strategy`，Q3 之后没有第二处删除过的东西还占着行号 (V11 J1、Q3、R4-1)

      - strategy_instance_cost_rules_are_refused_not_implemented：N5 的 cost_rules_path 与本轮其余六格做到的是「不许假装支持」，多实例各用各的费率、本金与保证金口径仍未实现。判据只长在命令行回测侧，config validate 明确不接管它——那里实例声明是真生效的，共用会把合法配置拒掉；这条边界由门禁的负向一项钉住（O2-M3 实测：把判据搬进 validate 只红门禁，用例全绿）(V11 N5/O2)
