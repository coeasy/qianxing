      - venue_endpoint_certification_requires_user_supplied_testnet_secret
      - exchange_side_precision_matrix_requires_testnet_bills
      - venue_fill_dedup_ledgers_are_unbounded_by_design：三处成交去重台账——Binance `BinanceSpotVenue.seen_fill_keys`、CCXT `CcxtProcessVenue.seen_trade_ids`、运行期 `LiveEventPipeline.seen_fills`——上界等于进程一生提交或 ingest 过的成交数，刻意不设水位。user stream 与 `trades` 查询（两个适配器）、user stream 与 reconcile 与 Outbox 补投影（运行期台账）都会把同一笔成交重投，淘汰任何一条已见键就等于允许同一笔 fill 被 trace 两次（重复记账），那是本仓库唯一不接受的失败方式；要封顶得先落成交对账的持久幂等键（P0-2 那层事务语义）。`orders`/`venue_order_ids`/`remote_ids` 与两个适配器台账共用同一个上界、同样不能淘汰；运行期 `seen_fills` 的 `rebuild_runtime_indexes` 在重启时把整本 EventLog 的 `Filled` 全插回来，所以重启也不缩小，且 `LiveEventPipeline` 是 `#[derive(Clone)]`，克隆一次多复制一整本。判据 tools/check_architecture.py 的 bounded_growth_and_reap_check 守的是「只增」而不是「有界」：Binance `seen_fill_keys.insert` 恰一处入账、CCXT `seen_trade_ids.entry` 恰一处、运行期 `seen_fills.insert` 恰三处（两条 ingest 路径各一处、重启回放一处），三个字段全词无 `remove`/`retain`/`drain`/`pop`/`clear`/`truncate`，且三处字段注释都写明「只增不减的成交幂等台账」——快照水位那几颗判据在有界处照样全绿，这一颗守的正是「别把无界悄悄改成有界、也别把淘汰悄悄加回来」(V13 R5；第三本由 V13 R6-A 纳入同族，R5 的正则 `seen_(?:fill_keys|trade_ids)\.` 不认 `seen_fills` 且只读两个适配器文件，pipeline.rs 整本不在范围内)。**修正（V13 R17，2026-10-07）：按「最新版规划」§8/§12.2 恢复 fam04 的 venue 缓存封顶（`crates/qx-adapter/src/venue_cache.rs`）之后，这条口径只剩运行期那一本成立。两个适配器的 `orders`/`venue_order_ids`/`remote_ids`/`cumulative_costs` 与去重台账改为共用一把**终态封顶**：终态订单在超过 `MAX_CACHED_ORDERS`（8_192）+ `ORDER_EVICT_HYSTERESIS`（1_024）后按 `client_id` 升序退场，`forget_orders` 级联清派生索引；未终态订单永不退场。安全性由「订单一并退场 ⇒ 重投的成交落到『本地订单不存在』出口」兜底——Binance 走 `QxError::ReconcileRequired("Binance 成交对应订单不存在")`、CCXT 走 `QxError::Permanent("CCXT 本地订单不存在")`，两者都是既有的一等回答，不会被静默收下，因此不会重复记账（这正是 R5 担心的那件事）。运行期 `LiveEventPipeline.seen_fills` **没有**共用这把封顶，仍只增不减，本条限制对它继续成立。判据 `bounded_growth_and_reap_check` 随之从「一律不许淘汰」改成「退场只许走终态封顶这一条唯一通道，且两个适配器都必须留着『订单已退场』的出口」。**

