schema_version: 1
updated_at: "2026-09-26"
default_profile: single_node

# 证据等级：
# implementation     代码/配置已存在
# code_tested        本地测试、契约测试或 Paper E2E 已通过
# sandbox_tested     真实供应商沙盒/模拟账户已通过
# production_approved 真实生产凭据、故障演练和运维审批已通过
profiles:
  single_node:
    storage: sqlite_or_files
    messaging: disabled
    intended_use: local_research_backtest_paper
  distributed:
    storage: postgres_or_files
    messaging: optional_nats
    intended_use: explicit_future_deployment

capabilities:
  deterministic_kernel:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - crates/qx-core
      - crates/qx-cli/tests/cli_dispatch.rs
      - cargo test --workspace
      - crates/qx-core/src/sourcing.rs replay is the single re-drive kernel (per-event append_checked, re-applied LedgerApplied facts, whole-log validate) and replay_facts/rebuild_ledger/verify are only its projections (V11 Q62)
      - crates/qx-core/src/sourcing.rs verify(events, &Ledger) compares the replayed ledger against the run ledger, so a mutated account with a matching digest still fails (V11 Q62)
      - tools/check_architecture.py replay_kernel_check holds 11 items over that kernel, both engine exits, the artifact choke point, the depth-chain causality slots and the named cases (V11 Q62)
      - crates/qx-protocol/src/lib.rs write_scalar_money tags presence before the value, so an uncomputed money field and a computed zero are two different state_hash inputs (V11 Q67)
      - crates/qx-protocol/tests/snapshot_single_source/optional_money.rs uncomputed_money_is_not_the_same_state_as_computed_zero walks all eight account money scalars through hash, seal/validate, both wire formats and both diff directions; the eighth one is equity_raw, added to OPTIONAL_MONEY_FIELDS by V11 Q70 (V11 Q67/Q70)
      - crates/qx-protocol/src/lib.rs AccountSnapshot.equity_raw is Option<i128> and scalar_money_raw reads all eight fields straight, so no Some(...)/unwrap_or inside that fn can fold an uncomputed amount back into a legal zero (V11 Q70)
      - crates/qx-core/src/file_lock.rs FileLock 是仓库里唯一的写锁定义点，decide_lock(age, stale_after, takeover_used) 是唯一的纯判据；registry / 多腿订单簿 / 作业队列 claim / 存储信封四处各改一行委托它，内核之外不再 remove_file 别人的锁，进程被杀之后孤儿锁会被接管而不是永久阻断四条链 (V11 D1)
      - crates/qx-core/src/file_lock.rs lock_age 以 min(mtime, now) 做基准，时钟回拨时年龄不可能为负；读不到年龄一律 Wait 而不是抢 (V11 D1 L4)
      - crates/qx-core/tests/ledger/core_facts.rs + crates/qx-core/src/ledger/fill.rs base_asset_of / fee_in_settlement_raw 是费用币种唯一的判定处：记账腿只记折算后的数，现货基准资产费用按该笔成交自己的价格定点折算（不引入外部汇率、只对 contract_size 乘数为 1 的口径开放），折不了算的按 ReconcileRequired 而不是把整条链挡在门外 (V11 D2/D5)
      - tools/check_architecture.py 把上面两条钉成常驻判据：「文件写锁 FileLock 只有一个定义点」「锁文件的抢占与释放不再各写一份」「四个消费方各委托 qx-core::file_lock」「锁的『同一场竞争只接管一次』住在 decide_lock 里，且抢锁循环把计数喂回判据」「成交费用腿只有一个记账点」「手续费币种判定住在唯一的折算函数里」「基准资产费用用成交自身价格折算」「折算只对乘数为 1 的现货口径开放」 (V11 D1/D2/D5)
      - 作业 deadline 只有一把时钟：crates/qx-scheduler/src/lib.rs 的 start_run_at 按 `started_ts + timeout_seconds` 写 deadline，与队列租约同属秒域（毫秒→秒的唯一换算入口是 lease_clock）。合流时库侧还带着"乘一千"的毫秒写法、装配处递的却是秒，两侧各自自洽、合起来一条 60 秒的作业要 16.7 小时后才判得出超时，卡死的 Running 照旧占住并发键。用例两侧都钉——started+29 未超时、started+30 超时（`run_records_deadline_for_timeout_monitoring`），只钉后一半时把单位改回毫秒并放大一千倍也能绿；门禁那一颗同时禁止 start_run_at 里出现 saturating_mul(1_000) 与 saturating_mul(1000) 两种写法。把 deadline 换回毫秒是断言红三条（run_records_deadline_for_timeout_monitoring、sweeping_a_stalled_run_gives_the_concurrency_key_back、worker_tick_sweeps_a_run_left_running_by_a_crash）加门禁红，两种字面量写法各测一次 (V11 N1 × V12 §18 TX8，W5 变异 M1/M2)
      - sweep_timed_out(now) 是超时收口的唯一入口（判定复用 is_timed_out、改写复用 mark_timed_out），生产派发每轮先扫（crates/qx-cli/src/scheduler.rs:249）：一条卡死的 Running 不再永久占着 concurrency_key。`sweeping_a_stalled_run_gives_the_concurrency_key_back` 钉「键真的还回来」，`worker_tick_sweeps_a_run_left_running_by_a_crash` 钉「崩溃留下的那行会被收掉」 (V11 N2)
      - 窗口与交易日历的判据只有 due_jobs_with_calendar 一颗：生产派发（crates/qx-cli/src/scheduler.rs:258）与库内执行面（crates/qx-scheduler/src/lib.rs:256）共用它，`JobWindow` / `TradingCalendar` 从此不是只能被 due_jobs 绕过的装饰 (V11 N3)
      - crates/qx-scheduler/src/job_spec.rs:73 的 undispatchable_by_registry 是纯判据，装配处 crates/qx-cli/src/scheduler.rs:203 的 validate_job_triggers 在载入与新建两条路径各问一遍：注册表派不动的 `Retry` / `Event` / `Manual` 声明当场拒，而不是躺在 jobs.json 里静默不入队（用例 `undispatchable_trigger_shape_fails_closed_at_assembly`）；零引用的 retry_run 随之删除 (V11 N4)
      - 两颗零生产调用的重复写法按 J1 删除：submit_order_via_gateway_with_risk（删前在 crates/qx-execution/src/lib.rs:1329，只是 submit_command_with_risk 的转发壳，全仓连用例都没有）与 complete_reconcile（删前在 crates/qx-zhenlu/src/lib.rs:1261，而 reconcile_snapshot 自己就会把状态推到 Live——留着等于允许跳过真实比对直接改状态） (V11 N6)
      - tools/check_architecture.py 的 m4_production_text()（:5828）把「活替代仍被生产走到」从「符号出现在文件文本里」改成「符号出现在该文件第一个测试模块之前」：改之前 start_run_with_manifest 的替代被钉在 SchedulerWorker::run_cron_tick 内部，而那颗住在 #[cfg(test)] 之后、零生产调用 (V11 N7)
      - qx-core/src/fenye.rs（464 行、自身文件之外零消费者）连同 lib.rs 的挂载声明一起删除，DEAD_MODULE_LANDING 钉住"分野"以模块形态复活的形状 (V11 E2)
      - crates/qx-runtime/src/pipeline.rs 的订单登记与 PostgreSQL 构造各留一颗活写法（`register_order_with_correlation`、`open_postgres_with_pool_size`），M4 删掉的十颗零调用公开写法每一颗都仍有一份被生产走到的替代；来源关联号不只钉在门禁文本上——crates/qx-execution/src/tests/gateway_port.rs 的 `control_submits_register_correlation_and_plain_submit_keeps_worker_shape` 断言两条控制面入口各自写 `control:{command_id}`、非控制面提交保持 `{worker}:submit:{client_id}`，crates/qx-execution/src/tests/recovery_and_replay.rs 断言补偿腿登记点名 worker/组/腿（`{worker}:hedge:{group}:{leg}:register`） (V11 M4)
      - crates/qx-scheduler/src/lib.rs:744 的 finish_run_with_code 只在 !success 时落 error_code：成功那条运行记录不再带着一次从没发生过的错误码外销到 /scheduler/runs，而重试判据与 NeedsIntervention 仍按同一格匹配 retryable_codes；常驻用例 a_successful_finish_refuses_an_error_code 钉住成功一侧（V11 O1）
      - crates/qx-core 不再有引擎、因果队列与时钟对象：src/engine.rs、src/queue.rs 与那份从未接线的 TestClock一并删除，src/clock.rs 只剩一句 `pub type Ts = u64;`（10 行）。时间轴口径改由两条真实推进路径承担（回测按 bar 序列推进、实盘由 crates/qx-runtime/src/pipeline.rs 的 append_at_engine 按 (ts, prio) 单调落盘），README 设计底线、crates/qx-core/Cargo.toml description、tools/validate_core.py 的「参考形状」与本方案 §1 四处来源同时改口；PRIO_* 数值仍逐项等于 qx-core/src/event.rs 的 prio（V11 P2）
      - README 对卯眼（`crates/qx-plugin`）的承诺改到与实际可达性同口径，两处（crate 表速查行、「三条容易被读过头的边界」那一节）按能力逐颗点名未接线：`sign_ed25519`（`crates/qx-plugin/src/lib.rs:194`）在全部 crate 的生产文本里零调用点；`bootstrap_plan` 与 `Profile::assemble` 已连同实现一起删除，那条事实记在模块注释（`crates/qx-plugin/src/lib.rs:15`）。接到的是另一条链：动态库字节的 detached Ed25519 由 `crates/qx-strategy/src/c_api.rs` 校验、production 配置强制公钥与签名成对，而 `qx verify` 注册的清单签名是 `fnv1a:` 自检（`crates/qx-cli/src/selfcheck.rs`）——两条口径不得混读 (V11 Q4)
      - 同一份 README 里卯眼的两颗生命周期超时改到与可达性同口径：`healthcheck_timeout_ms`（crates/qx-plugin/src/lib.rs:55）与 `shutdown_timeout_ms`（:56）只被 `validate`（:86）问非 0、被 `canonical_hash`（:143）计入指纹，仓内没有任何一处把它们换算成等待——L4 收口的是配置文件里那颗同名字段，manifest 这两颗是同一族的漏网，README 的 crate 表速查行与边界那一节各点名一颗 (V11 R4-3)
      - 常驻判据 `plugin_claim_honesty_check`（`tools/check_architecture.py:11228`）比较的是『生产文本里有没有把这两颗换算成等待的写法』与『README 引用它的那一行有没有说它走不到』，并带一颗反向排除：`config.shutdown_timeout_ms` 那条真接线不算违规——同名不同命，去掉排除之后 M4 当场红 (V11 R4-3)
      - tools/check_architecture.py plugin_claim_honesty_check 4 项：逐颗对齐（README 引用它那一行说它走不到 ⟺ 生产文本零调用点）、速查行按能力族、fnv1a 与 C ABI 不得混读、行号由判据从 README 自己印出的引用抠出来再回源码核对。把 (file, line, symbol) 硬抄进门禁只能证明门禁没写错，证不了文档没漂——Q4-M3 在第一版判据下实测 SURVIVED (V11 Q4)
      - 六份文本的行号引用共用一颗扫描器 `citation_audit`（`tools/check_architecture.py:10056`），台账侧是 `capabilities_citation_check`（`tools/check_architecture.py:10196`）、五份长文档侧是 `doc_citation_check`（`tools/check_architecture.py:10210`），逐份地板钉在 `DOC_CITATION_TARGETS`（`tools/check_architecture.py:9998`）：V11 方案书 580 引用 / 50 带名、变更日志 220/25、白皮书 410/60、V12 方案书 130/18（合流 W11 进的名册，进门禁当场实测 152 引用 / 22 带名 / 史钉豁免 13 行）、V13 方案书 74/2（第 8 轮进的名册，进的名册那刻实测 69 引用，逗号尾巴进核后涨到 93 引用 / 3 带名 / 史钉 3 行，地板因此从 50 抬到 74）、台账沿用 90/20；地板这颗的牙齿是 `maturity/evidence/v13-r8/citation_roster_guns.py`（输出同目录 `citation_roster_guns.txt`）的四发：还原裸名、还原越界号、把地板抬到实测 + 1 各咬一颗，第四发把地板抬到恰好等于实测必须绿——红来自越过真实颗数，不是改这一行把判据弄坏。复测器先探测真实颗数再放枪，地板值不手抄（手抄的那版把 90 写死，颗数一涨它就悄悄变成没咬） (V11 R6-8、V12 W11、V13 第 8 轮 B4)
      - 引用正则吃得到中文命名的文档路径：`CAP_PATHED_CITATION`（`tools/check_architecture.py:9973`）与 `CAP_BARE_PATH`（`tools/check_architecture.py:9978`）的字类从纯 ASCII 改成"首字符限 ASCII、类内收 CJK"，于是 `docs/archive/自研量化框架审计与重构方案-V12.md:171` 这类跨文档互引从"永远收不到"变成可核对。反向对照：把首字符的 ASCII 限制去掉，`tools/check_architecture.py:9973` 那一句在中文紧前时会连中文一起收成一个 token（`见文档tools/check_architecture.py`），'文件在场'那一格当场报它悬空——所以那颗限制是形状的一部分而不是冗余 (V12 W11)
      - 裸行号的归属由 `CAP_BARE_PATH`（`tools/check_architecture.py:9978`）扩到"同一行只点了文件名、没带行号"那一颗：R6-9 实测因此多量到 61 颗引用、当场判红 12 颗，其中一颗是"数字恰好落在误认文件长度之内"的假通过 (V11 R6-9)
      - 快照四张键表的行内自指 id 由一颗共用判据约束：`state_hash`（`crates/qx-protocol/src/lib.rs:296`）只吃 map 的键，行内那一份 `order_id`/`fill_id`/`transfer_id` 从不进摘要，"写侧恰好一致"因此不可能是契约。约束收在一处而不是四句 `if`：`validate`（`crates/qx-protocol/src/lib.rs:198`）里四张表共用一颗 `check_keys`（同文件 :203，四表共用的理由写在 :199 那行注释），三处调用点在 :231、:235、:239，键与行内 id 不等就抛 `ProtocolError::Invalid`（同文件 :208）。反例用例 `key_tables_reject_rows_whose_inline_id_disagrees_with_their_key`（`crates/qx-protocol/tests/snapshot_single_source/stable_json_tables.rs:113`）逐表钉两层：先断篡改之后哈希一字未动（证明这一格哈希校验抓不到），再要求报错点名自己的表与那一对键/行内 id——三张表的夹具在 :121 那份 `cases` 数组里（order 77 / fill 9 / transfer 3），逐颗改坏的循环在 :138 (V11 R7-3)
