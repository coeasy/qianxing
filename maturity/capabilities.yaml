  local_backtest:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - crates/qx-xingban
      - crates/qx-cli/src/backtests/strategy_backtest.rs
      - crates/qx-cli/src/backtests/single_strategy.rs
      - crates/qx-xingban/src/backtest.rs raw-scaled fee_price_multiplier regression
      - deploy/qianxing.runtime.strategy-backtest.example.json
      - every CLI backtest entry builds its gate via strategy_risk_gate (builtin and multi-leg legs added in V9 Phase 4)
      - backtests/mod.rs BarBacktestAssembly pins one engine default set for all three bar backtest chains
      - crates/qx-cli/src/backtests/depth.rs DepthExecutionModel feeds latency_snapshots and market_impact_bps into both L1 and L2 matching
      - crates/qx-cli/tests/depth_backtest.rs depth_execution_model_flags_change_results_and_are_recorded pins flag-to-result-and-artifact coupling
      - crates/qx-cli/src/backtests/fill_model.rs bar_fill_model is the single resolution point every Bar chain asks for its fill model
      - crates/qx-cli/src/tests/backtest_fill_model.rs each_reachable_fill_model_changes_the_result_and_is_declared pins model-to-result-and-artifact coupling
      - crates/qx-cli/src/market_spec.rs is the only place a market spec JSON is parsed or constructed, for both the Bar backtest chains and the venue workers
      - crates/qx-cli/src/tests/market_spec_single_source.rs the_backtest_chain_reads_a_ccxt_shaped_spec_to_the_same_result pins both shapes to one identical result_hash
      - crates/qx-xingban/tests/ashare_limit_anchor.rs seals the intraday limit up band to the previous session close and shows the previous-bar anchor fills on that same board (V11 Q60)
      - crates/qx-cli/src/backtests/ashare_binding.rs is the single A-share section reader covering key pairing, enabled fail-closed and the fee model built from the same snapshot (V11 Q61)
      - crates/qx-cli/tests/ashare_builtin_backtest.rs five subprocess cases pin lot-size rejection, the A-share fee model alone changing result_hash, both fail-closed rejections and both no-hook entries refusing the config (V11 Q61)
      - crates/qx-cli/src/strategy_binding.rs is the only place in the repo that assigns builtin_fast_window/slow_window/period/threshold_bps onto a BuiltinStrategyConfig (V11 Q64)
      - apply_configured_builtin_signal revalidates the merged values before any chain prints its provenance line, so a one-sided window override fails closed instead of failing later (V11 Q64)
      - single_strategy.rs depth.rs and multi_builtin.rs each print one [X · Signal] source line built by the single builtin_signal_note (V11 Q64)
      - crates/qx-cli/tests/builtin_signal_from_config.rs seven subprocess cases pin declared-windows, declared-period-and-threshold three-tier hashes, illegal pairing, one-sided recheck on three entries, cross-chain equality, depth tier and multi-leg (V11 Q64)
      - tools/check_architecture.py builtin_signal_check holds 15 items over that single reader, the four chains, the help text and each named case (V11 Q64)
      - crates/qx-cli/src/runtime_wiring.rs reject_ashare_rules_on_submit_path is the single submit-side A-share gate and reuses the backtest rejection wording (V11 Q65)
      - crates/qx-cli/src/tests/ashare_submit_guard.rs five in-process cases refuse the section at all five submit entries, keep the gate ahead of every side effect and pin the six non-submitting roles open (V11 Q65)
      - tools/check_architecture.py ashare_submit_guard_check holds 9 items over that one gate, its five call sites, the venue_runtime assembly ban, the named cases and the help text (V11 Q65)
      - crates/qx-xingban/src/backtest.rs and crates/qx-xingban/src/orderbook_backtest.rs each end run() with ReplayVerifier::verify(...)?, so a report whose facts cannot re-drive the account never reaches the caller (V11 Q62)
      - crates/qx-cli/src/backtests/artifacts.rs verifies before writing anything and refuses when replay.log_digest != result_hash; summary schema v3 publishes replay.log_digest / events / ledger_entries / run_ledger_entries instead of the old tautological replay_hash key (V11 Q62)
      - crates/qx-cli/src/tests/backtest_replay_gate.rs three in-process cases pin the published replay facts and refuse to land either an unbacked ledger entry or a same-timestamp causality regression (V11 Q62)
      - crates/qx-xingban/src/orderbook_backtest.rs puts the initial deposit on Priority::TIMER and the late fill reports plus their ledger facts on Priority::FEEDBACK, which is what makes the depth chain's fact stream replayable at all (V11 Q62)
      - crates/qx-cli/src/market_spec.rs market_value_is_product_spec is the one shape question and market_spec_source_label answers through it, so instrument_spec_version states the shape actually parsed instead of whether a spec path was passed (V11 Q63)
      - MarketSpecLoad carries spec, margin and source out of the single loader market_spec_with_margin; the strategy and depth chains publish it unchanged and the built-in chain that writes no manifest prints it as spec_source (V11 Q63)
      - crates/qx-cli/src/tests/market_spec_single_source.rs two cases walk all three reachable inputs through run_strategy_backtest and run_depth_backtest and read the landed manifest label back off disk, asserting three inputs yield three sources (V11 Q63)
      - tools/check_architecture.py market_spec_source_check holds 9 items over that single predicate, the three distinct constants, the loader-only source call, the brace-matched RunManifestIdentity blocks and the two named cases (V11 Q63)
      - crates/qx-cli/src/backtests/artifacts.rs owns the only two frame readers in the repo and derives the dataset identity back through qx-data's JsonBarFrameProvider with a column-by-column consistency check, so the published fingerprint is the one the registry verified (V11 Q66)
      - summary schema v3 carries an input block (kind/path/dataset_id/dataset_version/fingerprint) written once by input_provenance_json, and recompute_declared_backtest_input re-reads through that same reader to refuse a declared input that no longer matches or has vanished (V11 Q66)
      - RunManifest.data_fingerprint falls back to the verified dataset fingerprint instead of the engine's own bars digest; the OKX shipped example moved from data_fingerprint d1eae507fc0a5d80 (identical to its own input_event_hash) to barframe:673fd995f8625b97 (V11 Q66)
      - crates/qx-cli/src/tests/backtest_input_provenance.rs six in-process cases walk the real entries: declaration equals recomputation, tampered content after the run is refused, a missing input file is refused, one registered identity cannot carry two contents, the depth chain behaves the same shape, and a summary without an input block reports not_declared rather than verified (V11 Q66)
      - tools/check_architecture.py input_provenance_check holds 9 items plus 6 BACKTEST_ENTRY_OWNERS entries over that single reader, the v3 input block, the report exit, the fallback wording, the two distinct dataset version constants and the six named cases (V11 Q66)
      - crates/qx-cli/src/backtests/account_base.rs is the only place a backtest principal is declared, defaulted or worded: one named DEFAULT_BACKTEST_INITIAL_CASH, three source labels, one reader that fails closed on a non-positive declaration, and one note formatter shared by stdout and the summary (V11 Q72)
      - BarBacktestAssembly::new takes initial_cash as a required argument and the field is private, so a fourth chain cannot skip the question nor overwrite the answer after the fact; the whole qx-cli production tree scans clean of a from_i64(100_000) literal (V11 Q72)
      - all three single-leg chains read strategy.initial_cash_raw and print their booked principal plus source before the result line ([Strategy/Builtin/Depth · Account]); the built-in chain writes no summary, so that stdout line is its only exit for the number (V11 Q72)
      - summary schema v4 lands an account block whose two keys are taken from the account base actually booked, and a new summary-writing chain must answer the required account_base field to compile (V11 Q72)
      - crates/qx-cli/tests/backtest_account_base.rs five subprocess cases: the default is printed even when nothing is declared, the same config differing only in that one key must change fills 0 to 1 and the result_hash, a non-positive declaration exits 2, both summary chains land the principal they used, and the multi-leg entry refuses the key outright (V11 Q72)
      - tools/check_architecture.py backtest_account_base_check holds 10 items over that literal ban, the three labels, assembly privacy, the per-chain reads and prints, the fail-closed gate, the v4 account block, the schema field shape, the question-mark-carrying multi-leg refusal and the eight case names (V11 Q72)
    limitations:
      - backtest exposes only two builtins after V9 cleanup (single instrument and multi-leg)
      - queue_position_bps_is_not_a_cli_flag_because_builtin_strategies_only_emit_market_orders
      - bar_chain_virtual_trading_config_remains_unreachable_without_mark_price_input
      - deep_tier_fill_models_probabilistic_and_volume_sensitive_are_rejected_because_bar_input_cannot_carry_their_book_precondition
      - ashare_previous_close_raw_has_no_in_repo_producer_so_ex_rights_anchors_stay_unadjusted
      - the_two_bar_chains_agree_on_fills_return_and_drawdown_for_one_config_yet_still_publish_different_result_hash_so_the_hash_hides_chain_metadata_that_q1b_has_not_fingerprinted (V11 Q64 open)
      - runtime_config_validation_only_compares_the_window_pair_when_both_keys_are_present_so_single_sided_overrides_are_caught_only_by_the_post_override_recheck (V11 Q64)
      - ashare_trading_rules_now_reach_both_bar_backtest_chains_and_are_refused_loudly_by_book_and_multi_builtin (V11 Q61); paper_and_live_submit_entries_now_refuse_the_section_loudly_too_rather_than_half_wiring_the_fee_model (V11 Q65)
      - tracked_sample_artifacts_are_validated_by_nothing：跑完整套测试后 deploy/data 里 71 个被跟踪产物 0 项被改写，其中 16 份仍带着 Q62 已删除的 replay_hash 键，重 bless 只是把新数字抄进文件（V11 Q62 → Q1b）
      - no_tracked_sample_artifact_ever_loads_the_product_shaped_spec：deploy/data 下带 instrument_spec_version 的 21 份 run.json 里 3 份 ccxt 全来自真 CCXT 形状、15 份 default 没传规格，Q63 换口径后 0 项被跟踪产物改动 —— 示例集没有一份走过产品形状（V11 Q63 → Q1b）
      - the_source_label_mapping_is_not_falsifiable_by_the_static_gate：PRODUCT 分支接回 CCXT 常量时 230 项全绿，只有那两条走真实入口的行为用例问得出来；model_fingerprint 也仍不含规格内容，换一份 contract_size 不同的规格指纹不变（V11 Q63 → Q1b）
      - artifact_filenames_carry_no_summary_generation：产物路径只含 run_id 与 manifest.digest()，而 digest() 覆盖输入与模型、不含摘要自身的 schema_version，所以"只改摘要形状"的变更会让同一条示例命令原地撞旧文件并报"已存在不同内容"。Q66 落地后实测撞到 3 条集成用例（builtin_signal_from_config.rs:292、fast_backtest_manifest.rs:65/:96），撞名的 12 份本地产物移到 %TEMP% 后整树复跑 716 passed / 0 failed；缺的是一次决策：摘要世代进文件名，或给示例集一条重 bless 命令（V11 Q66 → Q67）
      - recomputation_compare_is_not_falsifiable_by_the_static_gate：把 recompute_declared_backtest_input 改成声明与声明自比时 245 项全绿，只有走真实入口的两条行为用例问得出来（V11 Q66）
      - summary_schema_is_now_v4：外部读者要改的除了 v2 的 replay_hash 与 v3 的 input 块，还有 v4 新增的 account 块（期初本金与来源两格，定点整数按字符串写）；本轮不改任何消费方脚本，示例摘要与正式摘要之间的世代差继续累积（V11 Q66 → Q72）
      - backtest_initial_cash_and_paper_worker_cash_never_meet：strategy.initial_cash_raw（回测）与 worker.paper_initial_cash_raw（paper）是两格且互不知情，Q72 把前者做成回测唯一的声明入口并在文档注释里点名后者，但没有任何判据要求同一份配置里两格同时出现时必须是同一个数 —— 使用者完全可以回测按 A、paper 按 B 再拿两边数字互相印证（V11 Q72 §34.5 第 2 条）
      - multi_leg_chain_still_prints_no_account_line：四条链里只有它没有 `[X · Account]` 播报，因为它同时是最长的一条（`multi_builtin.rs` 498/500 行），再加 4 行就翻过 Phase 4s 的兄弟模块线；本轮给它的是拒收那一格声明 + 归因产物里的 `account_base_source`，补齐得先搬家（V11 Q72 §34.5 第 1、4 条）

