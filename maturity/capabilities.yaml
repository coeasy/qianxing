      - crates/qx-cli/src/backtests/leg_funding.rs 的 `multi_leg_combined_return_bps`：多腿组合收益的唯一口径是两条腿合计盈亏 ÷ 两条腿合计本金，合计本金非正或折算越界一律报错（V11 Q71）
      - crates/qx-cli/src/tests/execution_and_multi_leg.rs 的 `multi_leg_combined_return_weights_each_leg_by_its_own_capital`：本金 3:1 的两腿按钱给 325bp 而非等权 550bp，本金相等时两口径重合，全零本金必须报错
      - crates/qx-cli/tests/multi_leg_attribution.rs 的 `combined_return_pools_both_legs_by_capital_instead_of_averaging_bps`：真实 CLI 跑仓库自带现货夹具（两腿本金实测相差 21 倍），stdout 与产物 `totals.combined_return_bps` 都等于用产物自己声明的 `accounts` 两端复算出的钱口径，且不等于两腿平均
      - crates/qx-cli/src/backtests/leg_funding.rs 的 `reject_configured_initial_cash` + `multi_builtin.rs` 的调用点：两条腿本金各按本腿行情定资，所以那条链当场拒收 `strategy.initial_cash_raw`（exit 2，文案写明本链定资规则与"改用 quantity 表达规模"），归因产物写 `accounts.account_base_source = multi-leg-funding-rule`（V11 Q72）
