      - crates/qx-core/src/event.rs + crates/qx-protocol/src/wire.rs hold the three position money fields as Option and hash/serialize them with a presence tag, so "venue did not report" is no longer the same state as "venue reported zero" (V11 Q68)
      - crates/qx-cli/src/tests/ccxt_position_facts_honesty.rs 3 cases: an unknown or missing position side is refused instead of guessed as long, flat rows are skipped before that gate, and omitted/null money stays unreported while "0" and 0 stay reported (V11 Q68)
