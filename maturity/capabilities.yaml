      - tools/check_architecture.py report_readability_check 五颗：模块在盘且在门槛内、crate 根成对挂载、模板无外链 token、保留「未连接真实交易所」声明、落盘调用点唯一
    limitations:
      - report_html_only_renders_what_the_summary_already_declares：报告与可信度面板都只印 summary.json 已有的格子（收益率/最大回撤/期末权益/期初本金/手续费/换手/成交笔数/拒单数 + 五项风险调整比率），不新增第二个指标算式来源。五项比率已随 bbfb401 进摘要与报告；仍在缺的是**数据集质量块**——摘要的 input 只带 dataset_id/version/fingerprint，不带连续性/缺失值计数，所以可信度面板的「数据质量」一行只能报待核，并在文案里点名 `qx-cli data-validate` 是这一格的产出者
      - backtest_summary_does_not_embed_the_dataset_quality_report：回测摘要在 input 块里只声明数据集身份（id/version/fingerprint），不嵌入 DatasetQualityReport；要把它接进摘要需要给回测入口加一个数据集清单路径参数并在写摘要时校验指纹，属后续工作。今天质量报告由 `crates/qx-cli/src/data_validate.rs` 的 data-validate 独立产出成 DatasetManifestV2（含 quality_report），两份产物各自成立但尚未串成一条链
      - report_html_is_opt_in_and_not_wired_into_quickstart：--html 是显式旗标，quickstart 与逐条首跑链默认不产出报告，产物份数仍是「init 10 + 回测 6」；把它并进首跑会改变既有的份数不变量与用例，属后续工作
      - grafana_dashboard_is_a_deploy_file_not_an_embedded_template：deploy/grafana/qianxing-overview.json 已落盘且有指标名用例，但它不在 qx-cli 内嵌的 DEPLOY_TEMPLATES 登记表里，所以 `qx-cli init` 不会把它拷进项目目录，要用手动或部署脚本单独铺
