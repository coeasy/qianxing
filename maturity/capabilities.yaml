      - venue_adapter_capability_and_health_surface_has_no_production_reader：`VenueAdapter` 的两格只读通告在 `crates/qx-zhenlu/src/lib.rs`（`PaperVenue`）、`crates/qx-adapter/src/binance.rs`、`crates/qx-adapter/src/ccxt.rs` 各写了一份实现，`ConnectorCapabilities` 的 market_data/user_stream/submit/cancel/replace 与 `AdapterHealth` 的 state/last_event_ts/reconnects 于是各有三套真值；但全仓按 `.capabilities(` 与 `.health(` 清点，这两格的读者只有 `crates/qx-adapter/src/binance.rs` 尾部的三颗断言，`crates/qx-cli/src/runtime_check.rs` 里那颗 `.health()` 读的是 `RuntimeSupervisor` 自己的健康快照、与本 trait 无关。「该 venue 不支持 replace」「连接已进 ReconcileRequired」今天既不参与启动校验也不参与运行期分派，sandbox/production 的分支走字面量比较（见 paper_execution 的 environment_guards_are_still_scattered_literal_comparisons）。门禁的 `zero_reference_public_surface_check` 只扫 `pub fn` 与 `pub const`，trait 方法与 trait 实现体对它不可见，所以这颗零读者不会由静态门禁报出来；接上它要先定形状——装配期一次拒（能力不足即拒配置）还是每笔下单前查（能力不足即拒单），两者报错的位置不同 (V13 R7 扫描B)

