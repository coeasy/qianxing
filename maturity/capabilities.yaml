    limitations:
      - paper_submit_queue_escapes_stay_registered_not_fixed：`run_paper_submit_order` 在 Accepted 与终态回写之间仍有两处 `?`——`enqueue_command` 与 `claim_command`。这两格失败时租约还不属于本进程，把 `Failed` 写进去会覆盖常驻 worker 对同一条命令已经做出的裁决，因此按缺陷登记而不是顺手改掉；门禁 `submit_terminal_state_check` 第 2 项把这两处钉成允许名单，新增第三处 `?` 立刻红（V13 第三十一遍 ② #273）
      - api_clock_granularity_is_per_connection_not_per_request：时间戳现在按连接读一次，而每条连接都以 `Connection: close` 收口、只服务一个请求，于是两者目前等价；换成 keep-alive 时这条限制才会真的成立
      - continuous_market_driven_paper_worker_requires_runtime_market_data_validation
      - scheduler_dispatch_is_cron_and_any_window_only：生产 tick 只把「Cron 触发 + window=Any」的 JobSpec 入队。库侧的 `due_jobs_with_calendar`/`due_event_jobs`/`due_manual_jobs` 与 `SchedulerWorker` 的 calendar/manifest 绑定入口在 qx-scheduler 之外零生产读者 —— 交易日历的 `Session` 至今没有生产生产者，事件与手工触发也没有入队者，因此这些形状现在在装载时就被拒，而不是收下之后静默不跑；接入它们需要先给出日历数据源与事件派发者 (V12 §18-B #117)
      - scheduler_run_retry_has_no_production_path：一次运行失败之后要不要重跑，生产装配里没有人决定。`dispatch_scheduled_jobs` 只把超过 deadline 的 Running 运行升级成 NeedsIntervention 并释放并发键；作业体报错由 `fail_strategy_job_run` 当场写成 `JobStatus::Failed` + `STRATEGY_JOB_FAILED`（V13 R2 第十二遍 #190，于是这一格不再只有超时升级一条出口），但 `next_retry_ts` 与 `retry_run_at`/`retry_run` 这条自动重试链仍在 qx-scheduler 之外零生产调用者（只被库内 `SchedulerWorker::run_cron_tick*` 用例路径走到），默认 `max_attempts=1` 下 `Failed` 运行的 `next_retry_ts` 恒为 `null` 并由用例钉住。交易作业失败时无法判定订单是否已经出网，自动重跑就是二次提交，因此这条链留作显式接线决策而不是顺手接上 (V12 §18-A #110 剩余 / #129；V13 R2 #190 只补终态与重投闸门，没接重试)
      - shutdown_signal_delivery_is_not_exercised：the four ladder cases drive the token through injected clocks and predicates, so what is proven is "once the token is pressed the ladder forwards it and bounds the wait"; no case raises a real signal, and on Windows SIGTERM has nothing to deliver (V12 R4-a)
      - paper_venue_has_no_t_plus_one_settlement_state_today_bought_quantity_nor_board_scoped_limit_anchors_so_the_ashare_section_is_refused_at_every_submit_entry_instead_of_only_its_fee_model (V11 Q65)
      - position_rows_have_no_producer_for_unrealized_pnl_yet：V11 Q68 made the Ledger-fallback row honest (absent instead of a fabricated 0), but computing row PnL still needs a frozen market spec on the read side
      - account_margin_raw_has_no_producer：账户级保证金占用在本层没有算点（这一层没有保证金模型），`/account/snapshot` 与 `/account/balances` 恒发布 null；null 不是 0，也不表示该账户没有保证金占用。接上它要先决定用哪把尺子，见 three_equity_rulers_still_live (V11 Q67 §28.5 立项，V13 R1-A5 拆成逐字段)
      - account_frozen_raw_has_no_producer：账户级冻结金额在本层没有算点，快照恒发布 null；A 股的"T+1 锁定数量"今天也没有生产状态，见 paper_venue_has_no_t_plus_one_settlement_state_… (V11 Q67 §28.5，V13 R1-A5 拆成逐字段)
      - account_realized_pnl_raw_has_no_producer：账户级已实现盈亏在本层没有算点——Ledger 有逐笔成交与现金，但没有把成交配对成平仓批次口径的读者，快照恒发布 null (V11 Q67 §28.5，V13 R1-A5 拆成逐字段)
      - account_unrealized_pnl_raw_has_no_producer：账户级未实现盈亏在本层没有算点，快照恒发布 null；它与持仓行的同名列是两件事，后者按交易所上报，见 position_rows_have_no_producer_for_unrealized_pnl_yet (V11 Q67 §28.5，V13 R1-A5 拆成逐字段)
      - account_funding_raw_has_no_producer：账户级资金费累计在本层没有算点——资金费流水只有对账侧的快照计数，没有进账簿，快照恒发布 null (V11 Q67 §28.5，V13 R1-A5 拆成逐字段)
      - stored_account_snapshots_predate_the_reconcile_presence_tag：V11 R10 给对账两格补了存在性标记，`state_hash` 形状随之改变，升级前落盘的账户快照会在 `from_json` 的哈希核对处被拒（有意 fail-closed），由 EventLog 重投影即可恢复；被 git 跟踪的产物侧实测不含此类快照
      - ccxt_reconcile_unknown_remote_open_order_has_no_fact_stream_entry_by_design：Q69 之后两半发现共用同一个出口，但一条远端孤单挂单没有可解析的 client_order_id，OMS 没有可标记的句柄，所以它只进报告与健康判定 (V11 Q69)
      - binance_reconcile_still_fetches_only_balances_and_orders：那条链没有 positions/funding/cashflow 取数器，Q69 之后报告里写 null 而不是 0，取数缺口本身仍在 (V11 Q69)
      - key_free_account_read_models_follow_one_default_account：无键的 /account/snapshot 与 /account/ledger 说的是配置里第一个真有账户日志的那条账户域（V11 R12 收的就是"账簿说 A、快照说 B"），其它账户必须带 account_id/venue_id 查询；账户快照在 API 服务装配时按域装载一次，不随事件流自动增补新账户
      - supervised_runtime_shutdown_trigger_is_posix_signal_only：停机触发**已经接线**，旧登记的两半断言都不成立——`crates/qx-runtime/src/supervision/shutdown.rs` 的 `install_shutdown_signals` 用 `libc::signal` 装 SIGINT/SIGTERM（依赖在 `crates/qx-runtime/Cargo.toml`），处理器只置一枚原子令牌；`wait_for_worker_finish` 见到令牌即调 `RuntimeSupervisor::request_shutdown`，`WorkerContext::should_stop`（`crates/qx-runtime/src/supervision/supervisor.rs`）随之翻真，API 的 accept 环与各 worker 循环都读它。唯一收口点是 `crates/qx-cli/src/worker_shutdown.rs` 的 `join_worker_handle`，生产侧 10 个 worker 入口逐个走它（`event_pipeline.rs`、`strategy_contract.rs`、`venue_runtime/paper_worker.rs`、`worker_entry.rs`、`workers.rs`），编排器另有 `crates/qx-orchestrator/src/lib.rs`。剩下的真限制是**平台**而不是接线：POSIX 信号语义在 Windows 上只有 Ctrl+C（SIGINT）那条腿成立，服务控制管理器停止服务发的不是 SIGTERM，本机实测过的也只有 Ctrl+C——所以「以 Windows 服务方式托管时谁去翻这枚令牌」仍是部署侧决策 (V11 R8/S2 立案；V13 R1-F 按代码事实改口，旧名 supervised_runtime_still_has_no_graceful_shutdown_trigger)
      - read_model_equity_null_carries_no_diagnostic：Q70 之后权益算不出时只报 null，看不出是哪一条持仓缺标记价；给出缺价标的清单需要新的线格式形状 (V11 Q70 §32.5 第 5 条)
      - three_equity_rulers_still_live：读模型的 equity_for（现货名义）、paper_available_margin（spec 尺子）与 strategy_contract 交给策略上下文的 available_margin_raw 仍是三把尺子，本轮只统一了"算不出即缺席"这一条 (V11 Q70 §32.5 第 4 条)
      - pipeline_metrics_publish_per_worker_process_only：`LiveEventPipeline` 的六个计数（`ingest_attempts`/`ingested_events`/`deduplicated_events`/`transient_retries`/`refreshes`/`failures`）自 V13 R2 第二十遍起有生产出口 —— `crates/qx-cli/src/pipeline_metrics_report.rs` 的 `PipelineMetricsReporter` 把 paper worker 每轮用完的 pipeline absorb 进按 worker 进程累计的总数，每个 tick 写 `worker-metrics/<worker>.prom`，`/metrics` 聚合后印出带 `worker`/`account` 标签的 `qx_pipeline_*`。量纲因此是「每个 worker 进程自启动起累计」，唯一的归零边界是进程重启；`--once` 那次运行结尾写的 `qx_worker_up` 是 0，抓取端会把这族样本连同 stale 标记一起读到。还没接线的两半：`crates/qx-cli/src/api_service.rs` 的读路径 pipeline（按请求各开一个、存活期与累计量纲不符）与 live venue worker（走 `PipelineStorage`，不经 `open_account_pipeline`，本轮没有顺手接线）。排除清单不再是手工抄写的一段：`crates/qx-cli/src/tests/pipeline_metrics_open_sites.rs` 按函数清点生产里每一处 `open_account_pipeline(`/`open_runtime_pipeline(` 站点（本轮实测 14 处），worker 循环要求并账次数与站点数逐函数相等，其余 8 项要在豁免名单与出口模块文档里同时点名——其中 `run_paper_submit_order`（`paper-submit-order`）与 `run_paper_pipeline_once` 这两个一次性入口的写入因此明确**不在**本族计数里。 (V13 §9.15 #178 立案 → §9.27 接线)
      - five_control_command_kinds_have_no_executor：`CommandKind` 八颗变体里 `ChangeRiskLimit` / `CancelOrder` / `ReconcileAccount` / `RetryJob` / `SwitchVenue` 至今没有任何派发者。第十一遍之前提交入口照样回 `Accepted`，审计与队列里留下一条永远不会往下走的记录；现在提交入口按 `CommandKind::executed()` 直接以 `Invalid` 拒绝（`ControlCommand::validate` 不看它，否则历史队列重启读不回来），能力缺口本身仍在，只是不再假装做了。接上执行者是独立决策 (V13 §9.18 #188)
      - environment_guards_are_still_scattered_literal_comparisons：闭合名单管住了「能写什么」，没管住「读了之后怎么分派」——那 14 处加固点仍是散落的 `eq_ignore_ascii_case("production")` 字面量比较，没有收成一次「环境 → 加固集合」的判定；新增第 15 处比较不会有判据提示它该进同一个集合。`sandbox`/`testnet` 的隔离性本轮仍由端点 JSON 的 `"sandbox": true` 与 `venue_id=binance-testnet` 承载，没有搬到 `environment` 上 (V13 R2 第二十三遍 #245 交下一遍)
      - websocket_cross_origin_admission_is_opt_in_with_no_warning_face：`/events/live` 的跨源判定装了但默认不生效——`crates/qx-cli/src/api_service.rs` 只在 `api.cors_allowed_origins` 非空时才调 `with_cors_allowed_origins`，空名单被 `crates/qx-api/src/admission.rs` 读成「没有浏览器准入面」，`CorsPolicy::websocket_denied` 于是对任何 `Origin` 放行。V13 R7 用重建后的真服务实测确认：不带 `Origin` 与带 `http://evil.example` 这类外域 `Origin` 的两次升级都回 101，名单非空时外来源才被拒。空名单本身是合法档位（API 按本机回环运维面设计，`deploy/README.md` 已把「跨源浏览器接入必须显式列 allowlist」写成部署条件），剩下的缺口是没有告警面——`runtime-check` 经 `validate_admission_config` 拒坏源与 0 上限，却不报告「此刻 allowlist 为空、任何跨源都能升级」，运维把端口暴露到共享网络时拿不到提示 (V13 R6 立案、R7 实测)

