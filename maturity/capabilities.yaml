      - crates/qx-storage 三本后端的 sync_control 已整体删除，R5-2 再把"独立追加一颗写入者"的写法一并删掉：链上只剩 `chain_audit` 一颗写入者，且只在各本自己的 `transact_control` 事务体里被接一次，门禁「审计链只有一个写入者 chain_audit，三本后端各自在控制面事务里接它一次，被删的 sync_control 不得复活」逐本读到事务体内核对（V11 H2、R5-2）
      - 审计链也补上了生产读者：`verify_audit_chain`（qx-storage/src/lib.rs:1499）不碰 IO、不分后端，既逐环核摘要又把状态检查点对到链尾；doctor 的 `audit_chain` 检查（qx-cli/src/doctor_report.rs）在文件与 sqlite 两本链上走它，门禁「审计链有生产读者」钉住两处落点与报告里的挂载（V11 R5-2）
      - JobQueueBackend 只剩带 fencing 的 `ack_job_at`（trait 声明 + 三本后端 = 4 处）：无 fencing 的 `ack_job`（trait + 三实现）与 Postgres 八颗 `from_storage` 已删除，门禁「队列只留有 fencing 的 ack 入口，Postgres store 只有一条构造路」逐名核对 (V11 J1)
      - 死信重放改成点查，不再是"取一页再筛"：`ConsumerStateStore`（`crates/qx-storage/src/lib.rs:693`）只留 `dead_letter`（同文件 :707）一颗入口，"刻意不是取一页再筛"这句就写在它上面那行注释里（:705）。三份后端各自交出`attempts` 最大的那一行（重放会追加新行，最大次数才是最后一次入账）：`max_by_key`（`crates/qx-storage/src/file/consumers.rs:192`）、sqlite 侧那条 `ORDER BY attempts DESC LIMIT 1`（`crates/qx-storage/src/sqlite.rs:337`）、postgres 同型的 `dead_letter`（`crates/qx-storage/src/postgres.rs:504`）。调用侧 `replay_dead_letter_from_store`（`crates/qx-cli/src/event_pipeline.rs:665`）不再需要整表，那句"找不到 … 的死信记录"（同文件 :677）也终于只在事件确实不在表里时才印出来 (V11 R7-1)
      - TEXT 里存着的 u64 在三处排序上收进同一条数值口径：`created_ts`、`enqueued_ts`、`command_id`、`run_id` 此前在 SQL 侧走字典序，三份后端给三种先后。sqlite 侧换 CAST 表达式——`ORDER BY CAST(e.created_ts AS INTEGER)`（`crates/qx-storage/src/sqlite.rs:597`）与控制队列那条 `ORDER BY CAST(c.enqueued_ts AS INTEGER)`（同文件 :1177，旁边 :1171 就是"同毫秒排在 2 前面"的现场取证）；作业队列在 Rust 侧排（`jobs.sort_by_key`，同文件 :1664），文件后端不进 SQL 就同口径排（`events.sort_by_key`，`crates/qx-storage/src/file/outbox.rs:58`；`commands.sort_by_key`，`crates/qx-storage/src/lib.rs:1220`）。Postgres 不把判据搬回应用层重排，而是补表达式索引并让旧的裸列索引让位：`qx_outbox_pending_numeric_idx`（`crates/qx-storage/src/postgres.rs:315`）与那句 `DROP INDEX IF EXISTS qx_outbox_pending_idx`（:314）——只改 `ORDER BY` 却留着旧索引，等于让规划器继续按一串没人按的键做写放大 (V11 R7-2)
      - 审计链摘要的输入形状由金色记录钉住：`audit_chain_digest_inputs_are_pinned_by_a_golden_record`（`crates/qx-storage/src/tests.rs:515`）把字段顺序、定点编码与环号的摆法记成一个字面量摘要，与同文件 :478 那颗词表钉子配对——改输入形状的人要在用例里改口，而不是在别人的机器上看到断链；这条决定同时写在写侧注释里（`crates/qx-storage/src/lib.rs:1448`） (V11 R7-7)
    limitations:
      - postgres_nats_contract_run_requires_first_ci_record_local_docker_unavailable
      - postgres_audit_chain_is_never_scanned_end_to_end：哈希链的写入侧三本后端都走（各自 `transact_control` 事务内的 `chain_audit`），读侧 `verify_audit_chain` 也有生产读者，但 doctor 承诺不触网（报告里 `network_accessed:false`），所以整链复核只覆盖文件与 sqlite 两本，postgres 那本只报「未扫描」。同一条缺口还带着两颗没人构造的入口：`PostgresAuditStore` 在仓内零构造点（连用例都没有），`AuditStore::read_entries` 的 postgres 实现因此也没有读者——接上它需要先给 doctor 一条"允许连库"的分支或一条运维命令，那是一处待裁决（V11 H3 接线后的剩余半边、R5-2）
      - postgres_migrate_and_health_check_have_no_operator_entry：`PostgresStorage::migrate()`（postgres.rs:127）与 `health_check()`（:132）零调用者。建库不缺路——schema 是在 `connect_with_pool_size` 里对第一颗 client 跑 `migrate_client`（:116）落下的；缺的是"运行中重放 DDL"与"探活"的入口，`/ready` 的依赖健康今天不看 postgres 这条 (V11 J1)
      - unfenced_file_job_ack_is_test_only：`FileJobQueue::ack(run_id, worker)`（file/jobs.rs:156）不带 fencing token，唯一调用点住在 R5-2 外置出来的用例文件 crates/qx-storage/src/tests.rs:278。trait 侧那颗同名无 fencing 入口已在 J1 删掉，这把"文件队列可以先领取后确认、不问租约"的刀只剩用例在用 (V11 J1)
      - json_state_store_pathless_variants_have_no_production_caller：`JsonStateStore` 的 update_control/save_scheduler/load_scheduler（file/state.rs:52/99/103）只被 qx-storage 自己的用例走过——控制面的生产写只走 `transact_control`（file/state.rs:65，configured_backends.rs:43/47/51 三本后端各一处），runtime 读控制面走的是 `load_control_if_exists`（crates/qx-runtime/src/lib.rs:132，该文件今天 135 行），调度状态的生产读写走带路径那批（scheduler.rs:80/101/178、api_service.rs:168、workers.rs:684）。`save_control` 与 `load_control` 那两颗无路径写法随 H2 的 sync_control 一起删掉了，不再属于这一族。同一条形状也覆盖 `SqliteEventLogStore::read_range`（sqlite.rs:2244）与 `contains_dedup_key`（:2310）——它们只被 tests/sqlite_event_log.rs 走过，是存储层留给嵌入方的读面 (V11 J1、R4-1、R5-2)
      - zero_caller_entry_gate_recognises_names_not_capabilities：J1 那三条判据按名字认。实测再叫 `serve*` 的第五颗入口一定红（J1-N1，改名也红），把不带 fencing 的确认改叫 `ack_job_unfenced` 请回来则不红（J1-N2，SURVIVED）——同 §41.7 第 4/10 条那条限制 (V11 J1)
      - numeric_ordering_of_text_u64_columns_is_pinned_by_contract_cases_not_by_a_shape_gate：这一族只有用例在挡——`file_outbox_relay_unblocks_the_tail`（`crates/qx-storage/tests/outbox_backend_semantics.rs:509`）与`sqlite_outbox_relay_unblocks_the_tail`（同文件 :517）成对，`file_backends_share_the_persistent_queue_contract`（`crates/qx-storage/tests/queue_backend_semantics.rs:182`）与 `sqlite_backends_share_the_persistent_queue_contract`（同文件 :195）成对，夹具刻意跨过 2 与 10 的数位边界。再写一处 TEXT 列的 `ORDER BY` 按字典序排，仓内没有任何东西会红；今天这一族唯一住在索引 DDL 文本里的那格是 postgres 换表达式索引，判据也不看它 (V11 R7-2)
      - postgres_dead_letter_point_query_is_never_driven：`ConsumerStateStore`（`crates/qx-storage/src/lib.rs:693`）三本后端都实现了 `dead_letter`，可驱动它的契约腿在本地只有 file 与 sqlite 会跑——postgres 那两条（`crates/qx-storage/tests/outbox_backend_semantics.rs:358`、同文件 :371）挂着 `#[ignore = "requires QX_TEST_POSTGRES_DSN"]`，与 postgres 那本审计链"整链从未被扫过"是同一条限制（见上面 postgres_audit_chain_is_never_scanned_end_to_end） (V11 R7-1、H3)

  canonical_order_risk_decision:
