      - crates/qx-cli/src/tests/reexport_zero_reader_surface.rs 门面 `pub use` 那一行不算读者：整棵树里只有「自己的定义行 + 那行再导出」的公共面即判红 —— 架构门禁按名字在源码里找读者，而那行再导出本身就含这个名字，所以这类死面在门禁侧恒绿（#206 的盲区本体，修门禁归协调侧）。本轮据此删掉 `run_binance_user_stream_live` 与 `run_binance_user_stream_testnet` 两条端点预设包装、`DEFAULT_WS_HOST` 与 `TESTNET_WS_HOST` 两份常量、没有一处调用点的中间层委托 `run_binance_user_stream_with_config`（V13 R2 #206）
      - crates/qx-adapter/src/lib.rs 的 MAX_WEBSOCKET_MESSAGE_BYTES 与 MAX_WEBSOCKET_FRAMES_PER_POLL 是拼帧循环的两条出口：分片永不置 fin 时按总长封顶，对端持续续帧或塞 ping 时按单次读窗消费的帧数封顶，越界各自具名拒绝，否则调用方的停机令牌在这条 poll 里永远读不到（V13 R2 第十四遍 #213，判据在 crates/qx-adapter/src/tests.rs）
    limitations:
      - testnet_acceptance_has_not_run_with_real_credentials_yet
      - venue_endpoint_certification_requires_user_supplied_testnet_secret
      - exchange_side_precision_matrix_requires_testnet_bills
      - venue_fill_dedup_ledgers_are_unbounded_by_design：三处成交去重台账——Binance `BinanceSpotVenue.seen_fill_keys`、CCXT `CcxtProcessVenue.seen_trade_ids`、运行期 `LiveEventPipeline.seen_fills`——上界等于进程一生提交或 ingest 过的成交数，刻意不设水位。user stream 与 `trades` 查询（两个适配器）、user stream 与 reconcile 与 Outbox 补投影（运行期台账）都会把同一笔成交重投，淘汰任何一条已见键就等于允许同一笔 fill 被 trace 两次（重复记账），那是本仓库唯一不接受的失败方式；要封顶得先落成交对账的持久幂等键（P0-2 那层事务语义）。`orders`/`venue_order_ids`/`remote_ids` 与两个适配器台账共用同一个上界、同样不能淘汰；运行期 `seen_fills` 的 `rebuild_runtime_indexes` 在重启时把整本 EventLog 的 `Filled` 全插回来，所以重启也不缩小，且 `LiveEventPipeline` 是 `#[derive(Clone)]`，克隆一次多复制一整本。判据 tools/check_architecture.py 的 bounded_growth_and_reap_check 守的是「只增」而不是「有界」：Binance `seen_fill_keys.insert` 恰一处入账、CCXT `seen_trade_ids.entry` 恰一处、运行期 `seen_fills.insert` 恰三处（两条 ingest 路径各一处、重启回放一处），三个字段全词无 `remove`/`retain`/`drain`/`pop`/`clear`/`truncate`，且三处字段注释都写明「只增不减的成交幂等台账」——快照水位那几颗判据在有界处照样全绿，这一颗守的正是「别把无界悄悄改成有界、也别把淘汰悄悄加回来」(V13 R5；第三本由 V13 R6-A 纳入同族，R5 的正则 `seen_(?:fill_keys|trade_ids)\.` 不认 `seen_fills` 且只读两个适配器文件，pipeline.rs 整本不在范围内)

