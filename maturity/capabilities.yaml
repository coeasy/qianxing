      - crates/qx-cli/src/main.rs

  ashare_json_provider:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - python/qianxing_ashare
      - crates/qx-data/src/provider.rs
      - crates/qx-provider/src/lib.rs

  ashare_corporate_action_ledger:
    implementation: true
    code_tested: true
    sandbox_tested: false
