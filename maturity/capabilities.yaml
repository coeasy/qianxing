      - numeric_ordering_of_text_u64_columns_is_pinned_by_contract_cases_not_by_a_shape_gate：这一族只有用例在挡——`file_outbox_relay_unblocks_the_tail`（`crates/qx-storage/tests/outbox_backend_semantics.rs:639`）与`sqlite_outbox_relay_unblocks_the_tail`（同文件 :647）成对，`file_backends_share_the_persistent_queue_contract`（`crates/qx-storage/tests/queue_backend_semantics.rs:182`）与 `sqlite_backends_share_the_persistent_queue_contract`（同文件 :195）成对，夹具刻意跨过 2 与 10 的数位边界。停摆那一族同形状跨 8 与 14：`assert_parked_outbox_has_an_operator_exit`（`crates/qx-storage/tests/outbox_backend_semantics.rs:294`）与 `assert_parked_rows_yield_the_page_head`（`crates/qx-storage/tests/outbox_backend_semantics.rs:358`）两颗 helper 的夹具各写 `OUTBOX_MAX_ATTEMPTS` 与 `+ 6`，于是 sqlite 的 `CAST(attempts AS INTEGER)` 与 postgres 的 `::numeric` 有了间接读者——摘掉任一处 CAST 会让用例红，摘掉夹具里的 `+ 6` 会让门禁红（V13 第 8 轮 A4）。仍没有形状判据读 SQL 文本本身：再写一处 TEXT 列的 `ORDER BY` 按字典序排，仓内没有任何东西会红；今天这一族唯一住在索引 DDL 文本里的那格是 postgres 换表达式索引，判据也不看它 (V11 R7-2、V13 第 8 轮 A4)
