      - crates/qx-core/src/venue.rs VenueFamily::parse / parse_option is the single place that turns a worker's `venue_id` into a venue family; the 19 worker-level spellings it replaced (5 byte-identical copies in crates/qx-orchestrator/src/lib.rs, 3 in qx-cli, plus 10 Paper-side variants whose None branch pointed in opposite directions) are now forbidden fingerprints, and tools/check_architecture.py venue_identity_check pins one definition, the 11-file consumer registry and the three family semantics (V13 R1-A3)
      - crates/qx-orchestrator/src/tests.rs worker_plan_routes_only_the_exact_paper_venue_to_the_local_worker drives that single source from a consumer: `" Paper "` still routes to paper-worker, while `paper-proxy` makes plan_workers fail instead of sending a credential-bearing worker to local paper matching (V13 R1-A3)
      - crates/qx-cli/src/venue_runtime/worker_runtime.rs worker_settlement_currency and settlement_currency_among_workers now both fall back to crates/qx-core/src/identity.rs DEFAULT_SETTLEMENT_CURRENCY, so a worker that omits `settlement_currency` and the account log whose writers all omit it answer with the same word as the backtest assembly (V13 R1-A4)
      - crates/qx-cli/src/tests/settlement_currency_single_source.rs every_settlement_currency_fallback_reads_the_same_default drives the real paper template with every declared currency removed and declaring_the_default_currency_matches_declaring_nothing refuses a second answer when a spec states the default explicitly (V13 R1-A4)
    limitations:
      - continuous_market_driven_paper_worker_requires_runtime_market_data_validation
      - scheduler_dispatch_is_cron_and_any_window_only：生产 tick 只把「Cron 触发 + window=Any」的 JobSpec 入队。库侧的 `due_jobs_with_calendar`/`due_event_jobs`/`due_manual_jobs` 与 `SchedulerWorker` 的 calendar/manifest 绑定入口在 qx-scheduler 之外零生产读者 —— 交易日历的 `Session` 至今没有生产生产者，事件与手工触发也没有入队者，因此这些形状现在在装载时就被拒，而不是收下之后静默不跑；接入它们需要先给出日历数据源与事件派发者 (V12 §18-B #117)
      - scheduler_run_retry_has_no_production_path：一次运行失败之后要不要重跑，生产装配里没有人决定。`dispatch_scheduled_jobs` 只把超过 deadline 的 Running 运行升级成 NeedsIntervention 并释放并发键；`finish_run_with_code` 在 CLI 侧唯一的调用点以 success=true 收口，于是 `JobStatus::Failed`、`next_retry_ts` 与 `retry_run_at` 这条自动重试链（同族那颗绕过退避窗口的 `retry_run` 已随 V11 N4 删掉、钉在门禁的零复活名册里）在 qx-scheduler 之外零生产调用者（只被库内 `SchedulerWorker::run_cron_tick*` 用例路径走到）。交易作业失败时无法判定订单是否已经出网，自动重跑就是二次提交，因此这条链留作显式接线决策而不是顺手接上 (V12 §18-A #110 剩余 / #129)
      - shutdown_signal_delivery_is_not_exercised：the six ladder cases drive the token through injected clocks and predicates, so what is proven is "once the token is pressed the ladder forwards it and bounds the wait"; no case raises a real signal, and on Windows SIGTERM has nothing to deliver (V12 R4-a)
      - paper_venue_has_no_t_plus_one_settlement_state_today_bought_quantity_nor_board_scoped_limit_anchors_so_the_ashare_section_is_refused_at_every_submit_entry_instead_of_only_its_fee_model (V11 Q65)
      - position_rows_have_no_producer_for_unrealized_pnl_yet：V11 Q68 made the Ledger-fallback row honest (absent instead of a fabricated 0), but computing row PnL still needs a frozen market spec on the read side
      - account_margin_raw_has_no_producer：账户级保证金占用在本层没有算点（这一层没有保证金模型），`/account/snapshot` 与 `/account/balances` 恒发布 null；null 不是 0，也不表示该账户没有保证金占用。接上它要先决定用哪把尺子，见 three_equity_rulers_still_live (V11 Q67 §28.5 立项，V13 R1-A5 拆成逐字段)
      - account_frozen_raw_has_no_producer：账户级冻结金额在本层没有算点，快照恒发布 null；A 股的"T+1 锁定数量"今天也没有生产状态，见 paper_venue_has_no_t_plus_one_settlement_state_… (V11 Q67 §28.5，V13 R1-A5 拆成逐字段)
      - account_realized_pnl_raw_has_no_producer：账户级已实现盈亏在本层没有算点——Ledger 有逐笔成交与现金，但没有把成交配对成平仓批次口径的读者，快照恒发布 null (V11 Q67 §28.5，V13 R1-A5 拆成逐字段)
      - account_unrealized_pnl_raw_has_no_producer：账户级未实现盈亏在本层没有算点，快照恒发布 null；它与持仓行的同名列是两件事，后者按交易所上报，见 position_rows_have_no_producer_for_unrealized_pnl_yet (V11 Q67 §28.5，V13 R1-A5 拆成逐字段)
      - account_funding_raw_has_no_producer：账户级资金费累计在本层没有算点——资金费流水只有对账侧的快照计数，没有进账簿，快照恒发布 null (V11 Q67 §28.5，V13 R1-A5 拆成逐字段)
      - stored_account_snapshots_predate_the_reconcile_presence_tag：V11 R10 给对账两格补了存在性标记，`state_hash` 形状随之改变，升级前落盘的账户快照会在 `from_json` 的哈希核对处被拒（有意 fail-closed），由 EventLog 重投影即可恢复；被 git 跟踪的产物侧实测不含此类快照
      - ccxt_reconcile_unknown_remote_open_order_has_no_fact_stream_entry_by_design：Q69 之后两半发现共用同一个出口，但一条远端孤单挂单没有可解析的 client_order_id，OMS 没有可标记的句柄，所以它只进报告与健康判定 (V11 Q69)
      - binance_reconcile_still_fetches_only_balances_and_orders：那条链没有 positions/funding/cashflow 取数器，Q69 之后报告里写 null 而不是 0，取数缺口本身仍在 (V11 Q69)
      - key_free_account_read_models_follow_one_default_account：无键的 /account/snapshot 与 /account/ledger 说的是配置里第一个真有账户日志的那条账户域（V11 R12 收的就是"账簿说 A、快照说 B"），其它账户必须带 account_id/venue_id 查询；快照本身由投影桥每轮从磁盘重装（V11 G1）
      - account_snapshot_refresh_follows_the_boot_config：每轮重装会重读事件与对账报告，配置里已声明的账户只要日志出现就在下一轮进读模型，但"有哪些账户域"仍取 boot 那份 `RuntimeConfig.workers`——运行中往拓扑新增一个 worker 需要重启 (V11 G1)
      - process_supervisor_stop_token_has_no_writer：worker 侧那枚令牌有人翻了（停机阶梯把终止信号转成 `RuntimeSupervisor::request_shutdown`，`supervise_workers` 自己也在 `wait_for_children` 那一跳读 `shutdown_signalled()`），剩下的这一格搬到 `supervise` 入口自带的那颗 `ShutdownToken` 上——`ShutdownToken::request` 的唯一生产调用点在 `RuntimeSupervisor::request_shutdown` 里，而父进程监督器不是 `RuntimeSupervisor`，于是那颗令牌恒为 false：K4 的接线格子钉的是"读的是真令牌而不是常量判据"，可翻它的人要等"部署侧还有什么该让这一圈停下"给出答案才存在 (V11 R8/S2/J2/K4，V12 R4-a/W9 改口)
      - read_model_equity_null_carries_no_diagnostic：Q70 之后权益算不出时只报 null，看不出是哪一条持仓缺标记价；给出缺价标的清单需要新的线格式形状 (V11 Q70 §32.5 第 5 条)
      - three_equity_rulers_still_live：读模型的 equity_for（现货名义）、paper_available_margin（spec 尺子）与 strategy_contract 交给策略上下文的 available_margin_raw 仍是三把尺子，本轮只统一了"算不出即缺席"这一条 (V11 Q70 §32.5 第 4 条)
      - keyless_snapshot_envelope_no_projection_fallback_still_has_no_teeth：L2 已把主路径钉住——把 `snapshot_envelope_for_query` 里那颗 `projection.events.digest()` 换成编来的数，`crates/qx-api/tests/snapshot_envelope_lineage.rs` 与「快照信封的摘要取那份被投影的事件源」同时红（断言红 + 门禁红）。剩下的只有无键分支"拿不到那份镜像投影就宁可不给信封"这一格：改回 `(Some(snapshot), 0)` 之后两侧仍全绿（V11 §47.8 变异表的 L2-M3 一行记着这次实测），因为用例的两条读路都有镜像好的投影，"有快照、没投影"这个状态从进程外造不出来。原登记（V11 F1-N6 §41.7 第 1 条）到此收窄为这一格 fallback (V11 L2 复核)
      - stream_key_gate_order_is_pinned_by_the_static_check_only：F1-N4（把 `/stream` 的先判键挪到 101 升级之后）只留下一条静默流，端到端用例看不出差别，只有门禁红 (V11 F1 §41.7 第 3 条)
      - job_owner_claim_bypass_is_pinned_by_the_static_check_only：E7-M7（领取端绕开共用判据、退回只认自己 id）之后单 worker 的端到端形状没有变化，只有「通配 owner 只有一个常量，领取判据不再就地比较 `"*"`」红 (V11 E7 §41.7 第 3 条)
      - control_audit_live_read_is_pinned_by_the_static_check_only：把 H1 那条端到端用例削成只写装配前的一笔，用例全绿、只有「用例在装配服务前后各走完一次命令生命周期」红（H1-N1）；整份用例文件消失时门禁以异常退出而非判据红（H1-N2，§41.7 第 9 条）
      - projection_refresher_panic_branch_has_no_permanent_counterexample：守卫在 panic 时同样 `Drop` 并报停摆是构造性保证，用例只驱动了「停机 + 正常退出」那两支的共同出口；真造一次 panic 要接管 panic hook，本轮不为此加机制 (V11 I1 §44.7 第 1 条)
      - query_port_trait_read_points_have_no_production_consumer_here：`query_port()` 在仓内只被用例调用，三格现读的红利要等嵌入式装配或进程内读面真的出现才兑现；今天的守门人只有用例与门禁 (V11 I2 §41.7 第 6 条)
      - query_port_partial_provider_change_is_untested：逐格用例只覆盖 provider 的成功与失败两面，"只有报告格前进、另两格停在旧值"那一面由 `load_api_query_models` 整体返回一个 `Result` 兜着 (V11 I2 §44.7 第 2 条)
      - sqlite_only_build_has_no_worker_metric_writer：该组合下 `/ready` 如实报 503，不是回归，但"部署到 sqlite-only 就会看到 503"这件事只在代码注释里，没有 runbook (V11 §41.7 第 5 条)
      - served_once_and_tls_entry_points_are_test_only：`serve_once`（`crates/qx-api/src/lib.rs:1849`）与 `serve_once_tls`（同文件 :1862）已是 `pub(crate)`，只被 `crates/qx-api/src/tests.rs` 的三条用例调用（:940 / :960 / :986），生产走到的是 `serve` 与 `serve_tls_mtls_with_stores` 两颗；留着它们是因为"单请求"这颗在明文与 TLS 两侧都还没有替代写法 (V11 J1、V12 §19 #135)
      - api_serve_tls_termination_is_pinned_by_the_static_check_only：J2-N1 实测——把 mTLS 那条生产调用点（strategy_contract.rs:823）的实参换成 `&|| false`，只有门禁红，明文侧那条常驻用例咬不到另一颗入口；给 mTLS 补同形状的终止性用例需要一套真实证书夹具，本轮没有为此新增依赖 (V11 J2)
      - accepted_socket_nonblocking_reset_has_no_teeth_on_this_platform：拿掉 `accept_polling` 里那句 `stream.set_nonblocking(false)` 复位，本机（Windows + rustc 1.98）的常驻用例与全部测试仍绿，只有「两条长驻入口都把同一个 stop 交给同一颗循环」那一项红（J2-M3 实测）——各平台对被接出的流是否继承监听套接字的非阻塞模式并不一致，这一颗在跨平台真机之前买不到更多证据，按防御性复位保留 (V11 J2)
      - live_connection_slots_are_a_constant_and_have_no_idle_deadline：这一格替掉 V11 M2 登记的 `websocket_event_stream_exits_only_on_client_or_bus`：那处登记的两条缺口都已在 V11 R7-e 收口，剩下的只有常量与空闲期限两件事。`/events/live` 的循环每圈先问停机令牌（`crates/qx-api/src/lib.rs:2094`），置起就 `Ok(())` 返回、线程与那一格长连接名额一起归还；长连接在起线程之前领一格（定义 :1952、领格那一行 :1956），上界 64（`MAX_LIVE_CONNECTIONS`:2271），领不到当场回 503 `too_many_live_connections` 并计 `connections_rejected_total`（`reject_overloaded`:2430）。这一格由用例把上界调成 1 才撞得到门——生产的 64 格要 64 颗线程，那是夹具的代价而不是判据。一条开着而静默的流只在下一次停机、写失败（`configure_connection` 带 10 秒写超时，:2283）或对端 close 时退，服务端自己没有空闲期限可依据；64 同样是常量、本轮零新配置项。两侧各有钉着的用例：`websocket_stream_terminates_on_the_stop_token_without_client_close`（crates/qx-api/src/tests.rs:1116）与 `live_connection_ceiling_refuses_and_gives_the_slot_back`（crates/qx-api/src/tests.rs:1063） (V11 M2 → R7-e)

      - cancel_order_has_no_executor_yet：P1 拒的是「没人执行的种类」，CancelOrder 由此不可受理；「撤单该由谁执行」这条链本身仍未接，是产品口径而不是连通性缺口，本轮没有替它决定 (V11 P1 §50.6)
      - acceptance_and_recovery_are_two_different_predicates：判据搬进结构性 validate 会让已落盘的历史命令读不回来（P1-M2 实测断言红 + 门禁红两项），但「受理处与恢复读侧必须是两颗不同的判据」这一形状本身由门禁数出来，而不是由某一条用例断言 (V11 P1)
      - snapshot_history_cap_value_is_pinned_by_the_gate_only：那三条用例各自按 MAX_SNAPSHOT_HISTORY 自己填窗口，把界从 1_024 抬到 65_536 之后 3 颗仍全绿（R4-6-M-c，仅门禁红，单轮耗时 0.02 秒涨到 56.26 秒）——用例钉的是『有界、且按最近写入退场』这个形状，具体数值只有门禁的文本锁钉得住，数值飘了不会有用例红。反过来，去掉『把重装摘要挪回队尾』那一步是断言红加门禁红（R4-6-M-b）：判据原先只数 `position(...)` 与 `push_back(...)` 两颗，补上 `remove` 那一格之后才咬得住『找到了旧位置却没把它退出来』这种半修法 (V11 R4-6)
      - audit_window_rollover_turns_unknown_command_into_a_full_runtime_stop：R5-1 的有界窗口把终态命令移出主表之后，worker 若在那之后回报，控制面只能回 `UnknownCommand`；`QueuedControlCommand`（crates/qx-storage/src/lib.rs:1104）没有重试计数，worker 拿到 Err 就以非零码退出，`supervise_workers`（crates/qx-orchestrator/src/lib.rs:224）的循环在子进程退出时 `return Err`（:284，那一格的报告文字在 :285）停掉其余 worker——实测后果是一次整店停机，不是静默空转。要让控制面为窗口之外的身份作证就得留永久墓碑表，而那正好把 R5-1 收住的有界窗口重新打开；且 `UnknownCommand` 与"状态文档被回滚成旧版本"在生产里同形，改成静默跳过等于给后者开门。本轮按实测改口后只登记不修 (V11 R6-5，§54.5)
      - control_audit_summary_same_source_is_pinned_by_the_gate_only：R7-8-M5 与 M6 实测——把降级在两半各写一遍（行为等价）与摘掉常驻用例里读摘要那一半，两颗的用例档全绿，只有本轮新增的那颗同源判据红（`tools/check_architecture.py:6312`）。同族的 M4 首跑是 SURVIVED：当时的用例只读流水那一半，补上"同一请求里摘要也要跟着现读"之后重跑才落到断言红（两份日志都在 `maturity/evidence/v11-r7/` 下，mut_r7b_r78.txt 与 mut_r7b_r78b.txt）。同族形状见上面 control_audit_live_read_is_pinned_by_the_static_check_only (V11 R7-8)
      - alert_rule_file_has_no_reader_outside_the_gate：`deploy/prometheus/qianxing-alerts.yml` 八条规则在仓内没有执行者——Prometheus 服务器在部署侧，仓里唯一读它的是门禁。所以「名册里有这一条」不等于「这一条会触发」：A5 补的 `QianxingApiConnectionRejections`（:66）与 `QianxingOutboxParkedEvents`（:76）只保证被点名的计数住在自己的渲染器体内，触发与否要到部署侧抓一份 `/metrics` 原文才算，本轮不使用任何外部服务或凭据，`sandbox_tested` 与 `production_approved` 照旧 false。这句话也不能反着读：抓不到样本 ≠ 不会触发，也可能是那条链还没起 worker 或没开 nats 特性 (V13 第 8 轮 A5)
