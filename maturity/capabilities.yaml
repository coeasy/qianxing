      - worker_metric_render_bodies_have_no_test_reader：`RelayMetricTotals::render`（`crates/qx-cli/src/event_pipeline.rs:117`）与 `ConsumerMetricTotals::render`（:164）只有生产调用点（:213/:223/:241 与 :478/:492/:511），而 `WorkerMetricsSink`（:77）的 `path`/`worker_id` 是私有的、构造点写在 nats 那两条 run 入口里（:289/:590），常驻用例要直接调 `render` 就得先为测试开一层生产面——本轮不加，改由门禁 `alert_names_render_inside_their_bodies_check`（`tools/check_architecture.py:13079`）按渲染器窗口数文本。牙齿实测：改名（A2）、两格换位（A3）、把真换行写成字面量 `\n`（A4）与「规则点名的指标只写在注释里」（A5）四发各自打红，日志 `maturity/evidence/v13-r8/a5_alert_render_guns.txt`（4 发里 4 咬、SURVIVED 0，每发的其余红行逐颗点名）；隔离对照那颗把同一发注入交给还原后的整份文本读法，判据是**红面集合相等**——对照红的面必须等于 A5 那一发的其余红，多一颗少一颗都不算通过（1 颗，通过）。这一批的第一遍落在 `a5_alert_render_guns_run1_pre-final-bytes.txt` 与 `a6_report_readout_guns_run1_mixed-a5-abort.txt` 两处存档里：前者的基线 sha 记着它打的是 C8 落地之前的门禁与告警字节，后者的 A2–A5 四行都记成 SURVIVED——成因是当轮 cargo 腿撞上过期 binary 守卫（15 颗失败），不是判据无牙；补 `cargo build -p qx-cli --features nats` 重链、再按最终字节整批重放才分得清。同族另一格：整段在 `#[cfg(feature = "nats")]` 里（:94/:140），默认特性构建连 `qx_outbox_relay_parked` 这颗 gauge 都不存在，只有 CI 的 nats 腿会把它编出来 (V13 第 8 轮 A5、A3)

