schema_version: 1
updated_at: "2026-10-04"
default_profile: single_node

# 证据等级：
# implementation     代码/配置已存在
# code_tested        本地测试、契约测试或 Paper E2E 已通过
# sandbox_tested     真实供应商沙盒/模拟账户已通过
# production_approved 真实生产凭据、故障演练和运维审批已通过
profiles:
  single_node:
    storage: sqlite_or_files
    messaging: disabled
    intended_use: local_research_backtest_paper
  distributed:
    storage: postgres_or_files
    messaging: optional_nats
    intended_use: explicit_future_deployment

capabilities:
  deterministic_kernel:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - crates/qx-core
      - crates/qx-cli/tests/cli_dispatch.rs
      - cargo test --workspace
      - crates/qx-core/src/sourcing.rs replay is the single re-drive kernel (per-event append_checked, re-applied LedgerApplied facts, whole-log validate) and replay_facts/rebuild_ledger/verify are only its projections (V11 Q62)
      - crates/qx-core/src/sourcing.rs verify(events, &Ledger) compares the replayed ledger against the run ledger, so a mutated account with a matching digest still fails (V11 Q62)
      - tools/check_architecture.py replay_kernel_check holds 11 items over that kernel, both engine exits, the artifact choke point, the depth-chain causality slots and the named cases (V11 Q62)
      - crates/qx-protocol/src/lib.rs write_scalar_money tags presence before the value, so an uncomputed money field and a computed zero are two different state_hash inputs (V11 Q67)
      - crates/qx-protocol/tests/snapshot_single_source/optional_money.rs uncomputed_money_is_not_the_same_state_as_computed_zero walks all eight account money scalars through hash, seal/validate, both wire formats and both diff directions; the eighth one is equity_raw, added to OPTIONAL_MONEY_FIELDS by V11 Q70 (V11 Q67/Q70)
      - crates/qx-protocol/src/lib.rs AccountSnapshot.equity_raw is Option<i128> and scalar_money_raw reads all eight fields straight, so no Some(...)/unwrap_or inside that fn can fold an uncomputed amount back into a legal zero (V11 Q70)
      - crates/qx-protocol/src/lib.rs ACCOUNT_SNAPSHOT_SCHEMA_VERSION is the one known-version constant and both entry points gate on it (validate and from_json), so a snapshot declaring a self-consistent future version no longer walks in; previously only "top level agrees with header" was asked (V12 R2)
      - crates/qx-protocol/src/tests.rs five cases: a self-consistent schema_version=7 is refused at every entry, a declared header copy that is not the same integer is refused instead of being rewritten, an absent header copy is the stored shape and still round-trips, the constant agrees with both served and repository contracts, and a future-version document this build cannot even deserialize is refused as a version problem rather than a missing-field error (V12 R2, V12 §13.3)
      - tools/check_architecture.py snapshot_contract_version_check gates that single constant declaration, the two entry gates, the header-normalization order and the named cases (V12 R2)
      - crates/qx-protocol/src/lib.rs publishes the contract by include_str! of schemas/account-snapshot-v1.json, so the served /schema body and the repository contract are one text instead of two hand-copied ones; the constant, the repository contract and the Python bridge are the three places that must stay on the same version number (V12 A2)
      - crates/qx-protocol/src/wire.rs fold_stable_order_row is the only read-side fold from the hand-written stable order row (display instrument, numeric side/status codes) back to the struct's serde shape, and side_code/order_status_code/ALL_SIDES/ALL_ORDER_STATUSES live only there, so an unknown code is refused instead of guessed as Buy (V12 TX5)
      - crates/qx-protocol/src/tests.rs rows_keyed_by_integer_still_produce_and_recover_valid_json puts an order/fill/transfer row into a snapshot, reads the whole document back through from_json, and refuses a tampered side=9 / status=99 (V12 TX5)
      - tools/check_architecture.py snapshot_row_wire_check holds 6 items over the three quoted row keys, the single fold call site, the code table being absent from the crate root and present once in wire.rs, the read-side ban on unwrap_or and .or(Some, and the named cases (V12 TX5)
    limitations:
      - three_kernel_invariants_are_pinned_by_text_only：log.validate() inside the kernel, the deposit's Priority::TIMER slot and the engines' `)?;` propagation all stay green when mutated, because the negative cases call the kernel directly instead of driving run() (V11 Q62 §25.3)
      - fills_and_transfers_rows_have_no_read_side_fold：TX5 folds order rows only, because fill/transfer rows already deserialize through their derived shape; a future row that carries a code column needs its own fold and the gate has one call-site slot for it (V12 TX5)

  event_fact_metadata:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - crates/qx-core/src/event.rs
      - crates/qx-core/src/sourcing.rs
      - crates/qx-runtime/src/pipeline.rs
      - EventMetadata schema v2 source_kind replay/digest tests
      - crates/qx-api/tests/event_cursor_after_semantics.rs both_event_read_chains_answer_the_same_cursor_the_same_way drives the in-memory and the SQLite read chains with one cursor and demands the same sequence list, after both were fixed on "strictly greater than after" (V12 R4-g)
      - crates/qx-api/tests/event_cursor_after_semantics.rs stale_or_ahead_cursors_are_rejected_on_both_chains keeps the guard symmetrical instead of only tightening the chain that was wrong (V12 R4-g)
      - crates/qx-core/src/event.rs 的 EventKind 删掉 `Timer` 与 `MarketBar` 两颗零构造变体（含摘要里 1、2 两格标签）：全仓没有任何生产构造点能把它们写进日志，却有三处下游臂（`digest` 摘要、`crates/qx-api/src/lib.rs` 的账户投影、`crates/qx-runtime/src/pipeline.rs` 的恢复忽略）长期为它们空跑——「bar 可以从事件日志重放」是词汇表里承诺了但无人兑现的事实（V13 R2 第二十二遍 #239）
      - crates/qx-cli/src/tests/event_kind_variant_ledger.rs 四条：变体集合按**花括号配平**枚举而不是单行 `Name,`（`EventKind` 的 14 颗里 13 颗是 `Name {` 跨行形状）；每颗变体都要有一处生产构造点（`src/tests/**` 与文件尾 `#[cfg(test)] mod tests` 都不算，模式匹配臂也不算，故一条永不命中的 `| EventKind::X { .. }` 会被判成零生产者）；退役的两颗在全仓不留任何引用；摘要标签两两不同且不许复用 1、2 两个退役标签位。构造点台账本轮实测 29 处，用例地板钉在 29 (V13 R2 第二十二遍 #239)
      - crates/qx-cli/src/tests/enum_variant_surface.rs 两条：把上一遍立案的门禁盲区变成判据——按**花括号配平**清点全仓 `pub enum`（本轮实测 枚举 77 本 / 变体 389 颗），对门禁单行扫描看不见的 142 颗逐颗要求生产限定名引用（`Enum::Variant`，或 `impl Enum` 块体内的 `Self::Variant`），允许清单本轮为**空**（实测「盲且零引用」= 0 颗）；另加三块防空转地板（389/77/142）与「四本整盲的枚举各自至少贡献一颗」（`EventKind`/`RuntimeExternalEvent`/`StorageError`/`QxError`），扫描口径退化时先在这里红，而不是让判据对着空集合自证（`logs/s566_enum_surface_run1.txt`）。本轮**没有改动** `tools/check_architecture.py`，门禁口径归协调者 (V13 R2 第二十三遍 #243，接住第二十二遍立案的 #241/#242)
    limitations:
      - external_adapter_fine_grained_source_taxonomy_pending
      - cross_process_schema_registry_pending
      - enum_variant_producer_check_cannot_see_struct_style_variants：门禁 `tools/check_architecture.py` 的变体扫描仍是单行的（一行 `Name,` 才算变体，且遇到枚举体内第一个 `^\s*}` 就停），全仓按花括号配平可解析 389 颗而门禁只认到 247 颗（后者 = 389 − 142，由打印行推出），**142 颗不在门禁判据里**（`logs/s566_enum_surface_run1.txt` 打印行「枚举=77 变体全量=389 门禁盲点=142 盲且零引用=0」）。第二十三遍只在**仓库侧**补了 `crates/qx-cli/src/tests/enum_variant_surface.rs` 这把配平的尺子（对那 142 颗逐颗要求生产限定名引用，允许清单为空，另有三块地板防空转），**没有**改门禁脚本本身——门禁口径归协调者，且 #141 的三条缺口（私有枚举/非线格式间接生产者/`use` 单名写法）仍未定。所以「每颗变体都有生产者」今天由仓库侧判据兜住，门禁自身的单行口径仍是那条没修的盲区 (V13 R2 第二十三遍 #243，接 #241/#141)
      - snapshot_header_trading_day_is_written_empty_yet_hashed_and_exported：`AccountSnapshot::new`（`crates/qx-protocol/src/lib.rs`）是 `SnapshotHeader` 的唯一生产构造点，它把 `trading_day` 写成空串，全仓没有任何赋值点或判读点把交易日历接到这一格；可它照旧进 `state_hash()`（同一个文件里逐字段 write_text 的第五格）、照旧进稳定 JSON 的 header 键集与 `schemas/account-snapshot-v1.json`。后果是「按交易日定位快照」在读侧只能由 `as_of` 推断，header 那一格是个恒空的定位符——改它的含义等于改哈希（要升 schema 世代），不改它就永远要在文档里解释「快照带交易日」这一格为什么从不带值 (V13 R7 扫描B)

  storage_consistency_contract:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - crates/qx-runtime/src/runtime_config/schema.rs StorageConsistency/StorageRuntimeConfig contract
      - crates/qx-runtime/src/runtime_config/topology_tests.rs storage consistency matches backend topology
      - crates/qx-cli/src/config_commands.rs runtime-check/status JSON
      - crates/qx-storage/tests/outbox_backend_semantics.rs file/SQLite/PostgreSQL lease+fencing+retry
      - crates/qx-storage/tests/nats_jetstream.rs publish/consume/dedup and input validation
      - deploy/qianxing.runtime.messaging.example.json
      - deploy/qianxing.runtime.postgres.example.json
      - .github/workflows/ci.yml service-backends job (postgres:16 + nats -js service containers)
      - crates/qx-storage/tests/snapshot_rows_persist.rs file_snapshot_store_recovers_a_snapshot_that_has_rows + sqlite_snapshot_store_recovers_a_snapshot_that_has_rows save a sealed snapshot that carries one order / fill / transfer row and load it back through load_json, asserting the row keys survive as strings and the snapshot equals itself after from_json (V12 TX5)
      - cargo test -p qx-storage --features sqlite is the only way the SQLite half of that file compiles in, because rusqlite sits behind the sqlite feature and the default profile builds the case out silently (V12 TX5)
      - crates/qx-runtime/tests/event_log_open_faces.rs 三条用例钉住打开 EventLog 的两条语义：read_only_open_never_touches_the_outbox_but_still_reads_every_fact 要求读面一个 Outbox 文件都不写但事实全部读得到，write_face_open_still_reprojects_the_crash_gap 要求写面照样补齐上次崩溃留下的投递缺口，segmented_backend_keeps_the_same_face_split 要求分段后端沿用同一分面 (V13 R2 第十七遍 #169a)
      - crates/qx-storage/tests/outbox_projection_cursor.rs projection_cursor_skips_only_the_already_delivered_prefix 只放行游标之后的前缀缺口，projection_rejects_names_the_shared_charset_rule_rejects 让 log_name 走与分段同一条字符集规则而不是内联副本 (V13 R2 第十七遍 #169b)
      - crates/qx-api/tests/api_projection_prefix_lookup.rs reprojecting_an_unchanged_log_skips_the_whole_prefix / every_prefix_position_reports_its_own_drift / global_compat_projection_keeps_the_same_prefix_verdicts 把「这条事实投影过没有」的前缀核对改成按序号二分，并让账户级与全局兼容两条投影给出同一个裁决 (V13 R2 第十七遍 #169c)
      - crates/qx-cli/src/tests/event_log_face_wiring.rs 数的是装配形状：每个打开点必须显式挑面（`OutboxRecovery` 的 `ReadOnly` / `ReprojectOnOpen` 与 `open_read_only` / `open_configured` 的配对份数），并把装配层所在的 `crates/qx-cli/src/runtime_wiring/pipeline_storage.rs` 与其挂载两行一起核对——行为用例对两条面都绿，只有形状判据能看见读调用点偷偷回到写面构造器 (V13 R2 第十七遍 #169a)
      - deploy/README.md 的「事件日志的读面与写面」一节写出哪些入口走读面、哪些走写面，以及 N=500/1000/2000/4000 两档实测（logs/s377_pass17_probe_read_open.txt、logs/s381_read_open_after.txt）
      - crates/qx-runtime/src/pipeline/backend_switch.rs 把「换 EventLog 后端」关成 fail-closed：单文件写 {name}.json、分段写 {name}.manifest.json + segments/，两套形状在同一 storage.root 下互不相交，而三条打开入口原先把「自己那份文件不在」一律当成首次启动（logs/s406_pass18_backend_switch_probe_before.txt 实测读到 0 条事实、现金 0、下一条 append 拿 seq 0，同一目录并存 5 条与 1 条两本账）。闸门只看当前配置没选中的那套文件后端有没有非空历史，空占位文件不算历史，报错点名被留下的那本历史并写出两条出路（logs/s407_pass18_backend_switch_probe_after.txt）(V13 R2 第十八遍 #226)
      - crates/qx-runtime/tests/event_log_backend_switch.rs 六条用例全是行为：两个方向都拒绝且不动磁盘（拒绝后旧历史摘要逐字可读、不建出 segments/ 目录）、read_face_open_is_refused_too 要求读面同样拒绝、the_gate_does_not_fire_on_a_fresh_root_or_an_unrelated_log_name 守住首次启动与同目录别的日志名、the_database_gate_sees_both_file_backends 要求数据库那侧看得见两套文件形状、same_backend_open_still_recovers_the_crash_gap 确认拒绝路径没把恢复逻辑一起带走 (V13 R2 第十八遍 #226)
      - crates/qx-cli/src/tests/account_event_log_identity.rs 的 switching_event_log_backend_refuses_to_start_an_account_from_an_empty_book 走真实编排链：只改 storage.event_log_segment_events 一个字段即被拒，换成 storage.backend: sqlite 同样被拒且报错点名 .json 而不是先报 feature 未启用（闸门与 feature 检查的先后由此钉住）；调用点在 crates/qx-cli/src/runtime_wiring/pipeline_storage.rs (V13 R2 第十八遍 #226)
      - crates/qx-runtime/src/runtime_config/schema.rs 的 event_log_segment_events 文档写出「改这个字段等于换一本账、留史会当场拒绝、分段换来的是归档抓手与摘要校验而不是更省的稳态写入」，deploy/README.md 的「换 EventLog 后端会被当场拒绝」一节给出报错原文与两条出路 (V13 R2 第十八遍 #226)
    limitations:
      - postgres_nats_contract_run_requires_first_ci_record_local_docker_unavailable
      - event_log_steady_state_tick_cost_is_linear_in_log_length：读面分面之后，写面链路的稳态单价仍与日志总长度成正比——logs/s403_pass18_steady_probe_flat.txt 里 N 从 1000 涨到 8000 时 refresh() 空转从 0.01149s/tick 到 0.09007s/tick、重复事实不落盘从 0.01172s/tick 到 0.09505s/tick、一次 register_order 追加从 0.04560s/tick 到 0.34747s/tick（三个口径每翻倍档倍率全在 1.90–2.03，即严格线性），Outbox 文件累计到 8006；paper 循环里行情桥与恢复桥各开一个 pipeline，所以还要加一份「另一个进程刚追加过、本进程重放到最新」的整本重放——logs/s405_pass18_steady_probe_cross_worker.txt 里 N=8000 时它比「空转读+只写」之和多出 0.02705s/tick（N=1000 时同一差值 0.00320s）。LiveEventPipeline::ingest_once 每次追加仍先 self.clone() 整份状态（V13 R2 第十七遍立案、第十八遍量具落实，登记为 task #225）
      - event_log_has_no_retention_or_compaction_trigger：事件日志只有增长，没有保留、压缩或归档策略，也没有上限；storage.event_log_segment_events 决定的是恢复与归档粒度（分段后端可用，段由 manifest 摘要校验），不决定日志总长度，今天没有任何轮转触发者。分段也不是这笔价钱的出路：logs/s404_pass18_steady_probe_segmented_vs_flat.txt 同一份日志同一稳态 tick，N=8000 一次真实追加单文件 0.34309s/tick、分段 500 是 0.41688s/tick、分段 5000 是 0.41737s/tick（贵两成以上），磁盘合计三档只差 0.01% 量级
      - snapshot_store_surface_has_three_backends_and_no_production_assembly：`SnapshotStore` 的 save/load_json 有三份实现——`FileSnapshotStore`（`crates/qx-protocol/src/lib.rs`）、`SqliteSnapshotStore`（`crates/qx-storage/src/sqlite.rs`）、`PostgresSnapshotStore` （`crates/qx-storage/src/postgres.rs`），各自带 `qx_snapshots` 建表、重复内容幂等与哈希复核；但生产链没有任何一处装配它们，三份的构造点只在测试里（`crates/qx-protocol/src/tests.rs`、`crates/qx-storage/tests/snapshot_rows_persist.rs` 与 `crates/qx-storage/src/sqlite.rs` 尾部那颗 `#[test]`）。今天账户快照的对外形状只活在 `qx-api` 进程内的 `publish_snapshot()` 与 `snapshot_history`，跨进程读回靠 EventLog 重投影，所以 `stored_account_snapshots_predate_the_reconcile_presence_tag` 那条讲的「升级前落盘的快照」在当前代码里找不到写入者——它说的是历史产物，不是今天的链路。接上落盘要先定写入者（worker 每轮、outbox relay 还是 doctor 触发）与保留策略，并给三份实现留一份 (V13 R7 扫描B)
      - job_queue_backend_trait_methods_have_no_production_caller：`JobQueueBackend` 的五个 trait 方法（`enqueue_job`/`available_jobs`/`claim_job`/`ack_job_at`/`recover_expired_leases`）在生产链零调用者——生产队列面是 `qx-cli/src/configured_backends.rs` 的 `ConfiguredJobQueue` 枚举，按 `match` 臂调各后端类型的**固有**方法（`enqueue`/`available`/`claim`/`ack_at`/`recover_expired`），两套接口并行存在、名字还不同。trait 唯一的多态消费者是 `crates/qx-storage/tests/queue_backend_semantics.rs` 的 `assert_job_queue_semantics(queue: &dyn JobQueueBackend)`，它靠同一份断言代码逐个跑 file/SQLite/Postgres 三后端，所以这是刻意的后端一致性契约而不是死面。改名或删掉 trait 之前得先让那三个固有方法组与 trait 方法组收敛成一份；反过来把 `ConfiguredJobQueue` 改成走 `dyn JobQueueBackend` 也要先定枚举为什么存在（它持有的是配置相关的后端构造器，不是裸 trait 对象）(V13 R7)

  canonical_order_risk_decision:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - crates/qx-risk/src/lib.rs
      - crates/qx-risk/src/rules.rs single notional formula
      - crates/qx-execution/src/lib.rs CanonicalRiskPort
      - backtest/paper/live share one RuleSet (crates/qx-cli/src/runtime_wiring.rs strategy_risk_gate)
    limitations:
      - RiskGate remains a thin facade over RuleSet for legacy call sites
      - order_risk_projection_fields_have_no_production_reader：`OrderRiskDecision` 的三格投影
        （`projected_position_raw` / `projected_margin_raw` / `reference_price_raw`）每笔订单都算，
        但生产消费者只有 `qx-execution` 的两个 `RiskPort` 实现，它们只读 `allowed` / `violations` /
        `rule_set_version`；三格目前只有 `crates/qx-risk/tests/risk_parity.rs` 与 qx-risk 用例读者，
        充当「三条入口判定一致」的对照面，不进任何回测产物、运行清单或 API 读模型，
        所以「这一单成交后仓位与保证金会变成多少」今天读不到产物（V13 §9.12 #171）
      - signal_confidence_is_computed_forwarded_then_dropped_at_merge：策略侧真在算这一格——`crates/qx-strategy/src/builtin.rs` 按成交量累加、`crates/qx-strategy/src/lib.rs` 按均线差绝对值、`crates/qx-strategy/src/c_api.rs` 把 FFI 决策里的原值带出，`crates/qx-runtime/src/strategy_contract/contract.rs` 写进契约输出，`crates/qx-cli/src/strategy_contract.rs` 再读进 `Signal.confidence`；可是 `SignalMerger::merge`（`crates/qx-zhenlu/src/lib.rs`）产出的 `TargetPosition` 没有这一格，合并即丢，全仓也没有任何阈值、缩放或排序读它（排序只读 `priority`）。标度还是三套口径：契约用例写 500/800/1_000 当千分制，`crates/qx-runtime/tests/strategy_contract_schema.rs` 的样例写定点原始量纲，内置策略写裸成交量。而 `schemas/strategy_api_v1.schema.json` 把 confidence 列进 required，外部读者必须给值、给了又什么都不影响——这是「必填但无读者」的形状，比纯粹的冗余更容易骗过对接方。要接上它得先定标度与阈值归谁，再决定它进 `TargetPosition`（进而在仓位与产物里可见）还是就地删掉声明 (V13 R7 扫描B)

