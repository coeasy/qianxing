      - external_unknown_result_recovery_requires_reconcile_worker。**续修（V13 R8-B，2026-10-04）：补单闸门的档位已补齐。**`crates/qx-execution/src/lib.rs` 的 `submit()` 原先对已存在的同 `client_id` 订单只挡两类——已确认（`is_terminal()` 或 `Accepted|Working|PartiallyFilled|Filled`，回 `ALREADY_APPLIED`）与已出网但未确认（`Submitted|Unknown`，转 `ReconcileRequired` 并 Err）。`OrderStatus` 共 11 个变体，`CancelPending` 掉出两个分支后直接落到 `venue.submit_order`；而迁移表（`qx-core/src/order.rs` 的 `can_transition_to`）里 `CancelPending` 只能走到 `Cancelled|Filled|Unknown`，`Submitted` 非法，所以对一条撤单在途的订单补发等于用同一个 `client_order_id` 再下一单。已并入 reconcile 闸门，错误信息带上状态名。`PendingSubmit` 刻意放行：只有真的调过 `venue.submit_order` 才会把状态推离 `PendingSubmit`（回包归约，或 Err 与空回包分支经 `mark_reconcile` 转 `Unknown`），所以停在 `PendingSubmit` 等价于「已登记但远端从未收到」（注册后出网前失败、或跨重启恢复），补发是恢复动作而非重复下单；`Accepted` 属 `semantic_replay`，EventLog 按 `correlation_id` 去重，所以这条路径不会重复记账 (V13 R8-B)
