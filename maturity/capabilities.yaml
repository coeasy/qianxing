      - plugin_ffi_calls_have_no_bound：C ABI 那一侧的时间维度什么都没有界——`CAbiStrategy::from_vtable` 逐颗验过 `abi_version` 与 `create`/`on_init`/`on_event`/`free_decision`/`destroy` 的非空，`decode_decision` 又界住 intents 的长度与 schema/身份/数量/价格，可这些全是字节形状上的界；此后每一次 vtable 调用都是宿主线程上的同步 `unsafe` 直路（`crates/qx-cli/src/strategy_host.rs` 的 `invoke_c_abi_strategy` 被回测那一格 `crates/qx-cli/src/strategy_contract.rs` 与作业那一格 `crates/qx-cli/src/workers.rs` 直接调用），插件在 `on_event` 里不返回就把那颗线程永远占住，那颗循环的停机令牌只在两次调用之间被读，`DynamicCAbiStrategy` 手里的 `libloading::Library` 也随之永不卸载。上面 C8 那三格泵超时救不到这一格：泵量的是父进程等子进程应答的那段，进程内调用没有可取消的中间层。把 `on_event` 换成可超时的写法要先把插件的应答搬进通道，而通道只把「没答上」变成一次超时，超时之后 `free_decision`/`destroy`/库卸载与调用方缓冲复用都是未定义行为——唯一 Sound 的边界是进程边界，那是独立一轮的工程量。所以这一格今天只有登记，门禁与用例都不替它作保 (V13 第 8 轮 C3)

