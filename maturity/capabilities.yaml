      - silent_stream_has_no_liveness_deadline：N10 之后 Idle 不再切断会话，于是一条半开、永不 tick、也不 FIN 的连接会一直占着那颗线程与那条 socket。每一圈读阻塞 10 秒（不是忙等）、停机令牌每圈都问得到，但仓内没有应用层 keepalive 期限可依据；与 M2 那格 websocket_event_stream_exits_only_on_client_or_bus 同族 (V11 N10)
