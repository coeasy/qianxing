      - runtime_component_paths_are_json_manifest_boundary

  multi_leg_execution:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - crates/qx-zhenlu/src/lib.rs
      - crates/qx-execution/src/lib.rs
      - crates/qx-application/src/lib.rs
      - crates/qx-cli/src/main.rs
