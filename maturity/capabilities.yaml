schema_version: 1
updated_at: "2026-09-19"
default_profile: single_node

# 证据等级：
# implementation     代码/配置已存在
# code_tested        本地测试、契约测试或 Paper E2E 已通过
# sandbox_tested     真实供应商沙盒/模拟账户已通过
# production_approved 真实生产凭据、故障演练和运维审批已通过
profiles:
  single_node:
    storage: sqlite_or_files
    messaging: disabled
    intended_use: local_research_backtest_paper
  distributed:
    storage: postgres_or_files
    messaging: optional_nats
    intended_use: explicit_future_deployment

capabilities:
  deterministic_kernel:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - crates/qx-core
      - crates/qx-cli/tests/cli_dispatch.rs
      - cargo test --workspace

  event_fact_metadata:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - crates/qx-core/src/event.rs
      - crates/qx-core/src/sourcing.rs
      - crates/qx-runtime/src/pipeline.rs
      - EventMetadata schema v2 source_kind replay/digest tests
    limitations:
      - external_adapter_fine_grained_source_taxonomy_pending
      - cross_process_schema_registry_pending

  storage_consistency_contract:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - crates/qx-runtime/src/runtime_config/schema.rs StorageConsistency/StorageRuntimeConfig contract
      - crates/qx-runtime/src/runtime_config/schema_tests.rs storage consistency matches backend topology
      - crates/qx-cli/src/config_commands.rs runtime-check/status JSON
      - crates/qx-storage/tests/outbox_backend_semantics.rs file/SQLite/PostgreSQL lease+fencing+retry
      - crates/qx-storage/tests/nats_jetstream.rs publish/consume/dedup and input validation
      - deploy/qianxing.runtime.messaging.example.json
      - deploy/qianxing.runtime.postgres.example.json
      - .github/workflows/ci.yml service-backends job (postgres:16 + nats -js service containers)
    limitations:
      - postgres_nats_contract_run_requires_first_ci_record_local_docker_unavailable

  canonical_order_risk_decision:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - crates/qx-risk/src/lib.rs
      - crates/qx-risk/src/rules.rs single notional formula
      - crates/qx-execution/src/lib.rs CanonicalRiskPort
      - backtest/paper/live share one RuleSet (crates/qx-cli/src/runtime_wiring.rs strategy_risk_gate)
    limitations:
      - RiskGate remains a thin facade over RuleSet for legacy call sites

  local_backtest:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - crates/qx-xingban
      - crates/qx-cli/src/backtests/strategy_backtest.rs
      - crates/qx-cli/src/backtests/single_strategy.rs
      - crates/qx-xingban/src/backtest.rs raw-scaled fee_price_multiplier regression
      - deploy/qianxing.runtime.strategy-backtest.example.json
      - every CLI backtest entry builds its gate via strategy_risk_gate (builtin and multi-leg legs added in V9 Phase 4)
      - backtests/mod.rs BarBacktestAssembly pins one engine default set for all three bar backtest chains
      - crates/qx-cli/src/backtests/depth.rs DepthExecutionModel feeds latency_snapshots and market_impact_bps into both L1 and L2 matching
      - crates/qx-cli/tests/depth_backtest.rs depth_execution_model_flags_change_results_and_are_recorded pins flag-to-result-and-artifact coupling
      - crates/qx-cli/src/backtests/fill_model.rs bar_fill_model is the single resolution point every Bar chain asks for its fill model
      - crates/qx-cli/src/tests/backtest_fill_model.rs each_reachable_fill_model_changes_the_result_and_is_declared pins model-to-result-and-artifact coupling
    limitations:
      - backtest exposes only two builtins after V9 cleanup (single instrument and multi-leg)
      - queue_position_bps_is_not_a_cli_flag_because_builtin_strategies_only_emit_market_orders
      - bar_chain_virtual_trading_config_remains_unreachable_without_mark_price_input
      - deep_tier_fill_models_probabilistic_and_volume_sensitive_are_rejected_because_bar_input_cannot_carry_their_book_precondition

  cli_scenario_init:
    implementation: true
    code_tested: true
    sandbox_tested: false
    production_approved: false
    evidence:
      - crates/qx-cli/src/config_commands.rs
      - docs/工业化易用性收口指南-V1.md
    limitations:
      - generated_ccxt_project_still_requires_user_credentials_and_external_sandbox
      - generated_multi_venue_project_does_not_provide_atomic_cross_venue_submission

