      - 死信重放改成点查，不再是"取一页再筛"：`ConsumerStateStore`（`crates/qx-storage/src/lib.rs:697`）只留 `dead_letter`（同文件 :711）一颗入口，"刻意不是取一页再筛"这句就写在它上面那行注释里（:709）。三份后端各自交出`attempts` 最大的那一行（重放会追加新行，最大次数才是最后一次入账）：`max_by_key`（`crates/qx-storage/src/file/consumers.rs:192`）、sqlite 侧那条 `ORDER BY attempts DESC LIMIT 1`（`crates/qx-storage/src/sqlite.rs:337`）、postgres 同型的 `dead_letter`（`crates/qx-storage/src/postgres.rs:491`）。调用侧 `replay_dead_letter_from_store`（`crates/qx-cli/src/event_pipeline.rs:661`）不再需要整表，那句"找不到 … 的死信记录"（同文件 :673）也终于只在事件确实不在表里时才印出来 (V11 R7-1)
      - TEXT 里存着的 u64 在三处排序上收进同一条数值口径：`created_ts`、`enqueued_ts`、`command_id`、`run_id` 此前在 SQL 侧走字典序，三份后端给三种先后。sqlite 侧换 CAST 表达式——`CAST(e.created_ts AS INTEGER)`（`crates/qx-storage/src/sqlite.rs:600`）与控制队列那条 `ORDER BY CAST(c.enqueued_ts AS INTEGER)`（同文件 :1207，旁边 :1201 就是"同毫秒排在 2 前面"的现场取证）；作业队列在 Rust 侧排（`jobs.sort_by_key`，同文件 :1694），文件后端不进 SQL 就同口径排（`group.sort_by_key`，`crates/qx-storage/src/file/outbox.rs:66`；`commands.sort_by_key`，`crates/qx-storage/src/lib.rs:1224`）。Postgres 不把判据搬回应用层重排，而是补表达式索引并让旧的裸列索引让位：`qx_outbox_pending_numeric_idx`（`crates/qx-storage/src/postgres.rs:302`）与那句 `DROP INDEX IF EXISTS qx_outbox_pending_idx`（:301）——只改 `ORDER BY` 却留着旧索引，等于让规划器继续按一串没人按的键做写放大 (V11 R7-2)
      - 审计链摘要的输入形状由金色记录钉住：`audit_chain_digest_inputs_are_pinned_by_a_golden_record`（`crates/qx-storage/src/tests.rs:530`）把字段顺序、定点编码与环号的摆法记成一个字面量摘要，与同文件 :493 那颗词表钉子配对——改输入形状的人要在用例里改口，而不是在别人的机器上看到断链；这条决定同时写在写侧注释里（`crates/qx-storage/src/lib.rs:1452`） (V11 R7-7)
      - crates/qx-storage/tests/snapshot_rows_persist.rs file_snapshot_store_recovers_a_snapshot_that_has_rows + sqlite_snapshot_store_recovers_a_snapshot_that_has_rows save a sealed snapshot that carries one order / fill / transfer row and load it back through load_json, asserting the row keys survive as strings and the snapshot equals itself after from_json (V12 TX5)
      - cargo test -p qx-storage --features sqlite is the only way the SQLite half of that file compiles in, because rusqlite sits behind the sqlite feature and the default profile builds the case out silently (V12 TX5)
    limitations:
      - postgres_nats_contract_run_requires_first_ci_record_local_docker_unavailable
      - postgres_audit_chain_is_never_scanned_end_to_end：哈希链的写入侧三本后端都走（各自 `transact_control` 事务内的 `chain_audit`），读侧 `verify_audit_chain` 也有生产读者，但 doctor 承诺不触网（报告里 `network_accessed:false`），所以整链复核只覆盖文件与 sqlite 两本，postgres 那本只报「未扫描」。同一条缺口还带着两颗没人构造的入口：`PostgresAuditStore` 在仓内零构造点（连用例都没有），`AuditStore::read_entries` 的 postgres 实现因此也没有读者——接上它需要先给 doctor 一条"允许连库"的分支或一条运维命令，那是一处待裁决（V11 H3 接线后的剩余半边、R5-2）
