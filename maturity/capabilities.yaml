`（crates/qx-api/src/lib.rs:1408，唯一能在不真起 TLS 对端的情况下注入可信身份的入口，两处授权判据用例都靠它；生产 serve 的身份来自对端证书，走的是同一颗 `handle_inner`）。文件状态侧：`load_json_at`（crates/qx-storage/src/file/state.rs:39，`read_json_file` 那颗统一读入口的公开面，存储单写路径判据认的就是它）。这 21 颗一颗都不删：Q3 删掉的是"同一份工作有第二种写法"（`Metrics`/`BasicAnalyser`/`run_batch`），而这一批每一颗都是仓内唯一的一份写法或唯一持有某个夹具的那一份；接不接线记在 §51 的待裁决里，代价由同一颗行号判据付——它把这 21 颗逐颗钉在定义行上；V11 R4-4 用同一把尺子又量出策略侧的一颗同族孤儿 `Strategy::on_order_update`（`crates/qx-strategy/src/lib.rs:323` 的 trait 默认实现与 `crates/qx-strategy/src/c_api.rs:167` 的 vtable 槽位，再加上 `cpp/include/qianxing_strategy.h` 的 C 声明和 c_api.rs:565 的转发实现——四处齐全，运行时却只把行情事件喂给 `on_event`，零派发。对面 Python 契约里连订单回报的载荷都还没有，接线要先连带补那一格，因此按同一口径登记为未接线的唯一实现而不删；这一颗的代价多付一条双向判据「策略的订单回报回调仍然零派发」，哪天装配处真的开始派发它，就先红在那里，逼着把这条登记与文档一起改口；V11 R7-6 用同一把尺子量第 5 轮扫描 B，逐颗复核后留下 15 颗「零生产调用 + 仓内唯一写法」：因子侧 `incremental_against`（crates/qx-factor/src/execution_plan.rs:140）与 `FactorIncrementalProvenance`（crates/qx-factor/src/execution_plan.rs:41，是已登记的 `materialize_incremental` 唯一的 provenance 生产者，所以那条链整条走不到）、`materialize`（crates/qx-factor/src/materializer.rs:162，与窗口增量那颗是两种形状不是同一件事写两遍）、`compute_momentum`（crates/qx-factor/src/lib.rs:130）、`mark_event_verified`（crates/qx-factor/src/lib.rs:892，运行清单 event-verified 那一格唯一的写入者）；数据侧 `CacheKey`（crates/qx-data/src/cache.rs:7）与 `DataCache`（crates/qx-data/src/cache.rs:29，进程内按指纹暂存 bar 的这一份是唯一的，`venue_cache.rs` 那把封顶管的是订单不是 bar）、`IncrementalMergeReport`（crates/qx-data/src/incremental.rs:7，`merge_bars` 是活的而第二个返回值在 storage.rs:35 被丢弃——裁剪它是公开签名变更，要先定增量落盘要不要报复用量）；核心侧 `MarginState`（crates/qx-core/src/trading.rs:281，保证金清算在链上由星板那份保证金撮合模型判定）；观星侧 `put_quotes`（crates/qx-guanxing/src/lib.rs:351）与 `quotes_as_of`（crates/qx-guanxing/src/lib.rs:371，quotes 表唯一的读缝，与已登记的 `bars_as_of` 是同胞）；针路侧 `open_orders`（crates/qx-zhenlu/src/oms.rs:131，同名命中都落在 CCXT `fetch_open_orders` 那串文本上，不是这颗）与 `fee_descriptor`（crates/qx-zhenlu/src/lib.rs:1226，`fee_model` 是私有字段、这颗是它唯一公开出口，注释此前替「运行清单与配置校验会读它」作保、本轮改到与实际可达性同口径）；运行时侧 `primary_seq`（crates/qx-runtime/src/pipeline.rs:275，三处写入零处读）；协议侧 `TransferSnapshot`（crates/qx-protocol/src/wire.rs:74，连同快照 `transfers` 那张键表：JSON Schema 必填、生产链从不写入，V11 R7-3 之后它的行内 `transfer_id` 至少与键一致了）。这一批的代价同样由那颗行号判据付（它把这 15 颗连同上面 21 颗逐颗钉在定义行上），而双向性只有 `on_order_update` 那一颗有——其余各颗若哪天被接上，先红在行号钉不住或登记与事实相反，而不是当场红 (V11 M4、Q3、R4-4、R7-6)。同批的 `DataSchemaVersion` 不属于这一类：它只是 `DATA_SCHEMA_VERSION` 那格事实的第二种写法（结构体 `major` 无人读、唯一的到达路径是 `lib.rs` 那句 `pub use`），按 Q3 口径删掉，且已被「已删的零调用公开写法不得以原名回来」那颗钉住
      - scheduler_calendar_and_retry_still_have_no_production_writer：N3 把判据接上了，可 `qx_scheduler::TradingCalendar` 在仓内没有任何写入者（只有 default() 与用例里的 insert），一份真实交易日历由谁落盘、按什么口径更新是仓外决定；重试要重投就得让同一作业带着新的 attempt 再进队列，而 FileJobQueue 按 run_id 落盘、重投直接撞 Conflict，retry_run_at 因此仍是只有用例走得到的入口（同一形状见上一条「库内执行面按设计保留」的登记） (V11 N3/N4b)
      - rest_venue_adapter_has_no_production_caller：`RestVenue`（crates/qx-adapter/src/lib.rs:968，impl 在 :1006 / :1233 / :1364）是仓内 `Venue` + `VenueAdapter` 那对 trait 唯一的通用 HTTP 实现，实现齐了却只有同文件用例（:1910 / :1981 / :2023 / :2075 四处）调用过。按 J1 的「唯一实现的孤儿」留下并就地登记，没有替它编一个调用方 (V11 第 2 轮扫描 B、R4-1)
      - projection_envelope_validate_has_no_caller：`ProjectionEnvelope::validate()`（crates/qx-protocol/src/lib.rs:78）零调用者——仓内四颗 `.validate()?` 生产读者都属于 QueuedJob / QifiEnvelope，不是这一颗。接它要连「读侧要不要在反序列化之后重问一遍身份字段」一起定，本轮按待裁决登记，也没有为它补一条把调用点重抄一遍的假用例 (V11 第 2 轮扫描 A)
      - oms_order_table_has_no_cap_like_the_venue_cache：封顶住在两个 venue 适配器共用的那份缓存判据里（MAX_CACHED_ORDERS crates/qx-adapter/src/venue_cache.rs:18，退场函数 evict_stale_terminal_orders 同文件第 25 行），而常驻归约器里那份 `Oms { orders: BTreeMap<u64, Order> }`（定义在 crates/qx-zhenlu/src/oms.rs:14，被 crates/qx-runtime/src/pipeline.rs:444 长期持有）没有同款上界，而且刻意不去共用：那条退场规则的前提是『被退场的订单再有回报就走 ReconcileRequired』，前提在实盘 ingest 一侧成立（crates/qx-runtime/src/pipeline.rs:1390 认不到本地订单就是升级对账），在冷启动回填一侧不成立——rebuild_runtime_indexes（crates/qx-runtime/src/pipeline.rs:1224）按事件顺序把整条 EventLog 重放进 OMS，其中第 1244 行对 `apply_fill(fill)` 直接打问号上抛，于是退掉一笔早期终态订单就等于把它之后每一笔成交都变成『订单不存在』。照抄封顶的净效果不是省内存，是把代价从内存换成一份再也打不开的长日志。要给 OMS 加界，得先定回填怎么跳过已退订单——那是一处仓外决定，本轮不单方面改形状；两半各有一颗判据（『没有偷偷共用那把封顶』与『回填打上抛问号、实盘才升级对账』），谁统一这两半就两红一起，逼着回来改这条登记 (V11 N9、R4-8)

      - run_error_code_semantics_is_pinned_by_a_case_only：门禁没有「成功一侧不许落 error_code」这一项，这一格只有 a_successful_finish_refuses_an_error_code 在咬。O1-M1 那次实测的门禁红是 M4 行号锁被四行删除连带（红的是「行号逐条仍指到定义本身」），不是 O1 自己的牙齿——等行数的 O1-M2 只红用例（V11 O1 §49.11 第 1 条）
      - python_reference_shape_is_not_compared_by_itself：tools/validate_core.py 与 Rust 不再有对应实现（engine/queue 已删，那两个类只是它自用的参考形状），把它的 PRIO_POST 从 9 改成 8 时该脚本自身仍然绿（P2-M6 实测），跨语言比对是门禁那一项在做的，不是脚本 (V11 P2)
      - gate_text_counts_a_comment_as_one_more_implementation：按文本计数的判据分不清代码与注释——把落盘判据抄进一行注释就被数成第二处写法（P2-M7 实测同时红两项）。这一族判据保的是「同一判据不被写第二份」，不保「第二份是活的」 (V11 P2)
      - oms_cap_gate_recognises_writings_not_a_cap：那条『没有偷偷共用那把封顶』按 venue 侧的四个写法认（退场函数名、那份容量常量名、`const MAX_` 前缀、`.retain(` 级联派生索引）。实测另起一套形状的界——`const OMS_ORDER_RESIDENCE` 配 while 循环逐个 remove——27 颗 qx-zhenlu 用例与整道门禁同时全绿（R4-8-M-neg，SURVIVED）：这一格挡得住顺手抄那份封顶（R4-8-M-d 仅门禁红），挡不住另立名目的界。真正的兜底是那条两半不对称，它钉的是回填与实盘对同一问题的两种回答（R4-8-M-e 断言红、R4-8-M-f 仅门禁红）；要给 OMS 加界仍然得先回答『回填怎么跳过已退订单』 (V11 R4-8)
      - doc_line_reference_orphans_stay_unaudited：一行里既没有带行号的引用、也没有能唯一解析的文件名时，那颗裸行号仍无人核对——R6-9 之后四份文本剩 349 颗（方案书 242 / 变更日志 101 / 台账 5 / 白皮书 1），R7 轮按同一条规则复测总数仍是 349（方案书 241 / 变更日志 102 / 台账 5 / 白皮书 1），两颗一降一升的不对称各有出处、记在 V11 §55.11；另一格是跨行折行会让点名绑不上（判据按行扫描），所以引用与名字必须写在同一行 (V11 R6-9、R7-10)
      - inline_key_id_agreement_is_pinned_by_a_case_not_by_a_shape_gate：R7-3 之后再生一张带行内自指 id 的键表、却不在 `validate` 里问那颗 `check_keys`（`crates/qx-protocol/src/lib.rs:203`），仓内没有任何门禁会红——挡住它的只有`key_tables_reject_rows_whose_inline_id_disagrees_with_their_key`（`crates/qx-protocol/tests/snapshot_single_source.rs:775`）那一颗常驻用例，而它在门禁侧只被用例数地板钉着（`SNAPSHOT_CORE_CASE_FILE`，`tools/check_architecture.py:2182`）：地板挡"整批被删"，不挡"少一张表"。两处漏接各有反例实测断言红——M6a 让 `validate` 漏掉 fills 那张表、M6b 把 orders 那半边改去问外键 `client_order_id`（V11 R7-3，§55.12）
      - takeover_age_refresh_is_pinned_by_the_gate_only：R7-9-M7 与 M8 实测——把 `Takeover` 支或 `Wait` 支改回"自己再 `age_of` 一次"（`crates/qx-core/src/file_lock.rs:148`、:162），`-p qx-core file_lock` 那 9 条用例全绿（行为等价：抖动之外两次读的是同一个数），红的只有门禁两项：「锁的『同一场竞争只接管一次』住在 decide_lock 里，且抢锁循环把计数喂回判据、只按判据交出的年龄说话」（`tools/check_architecture.py:7598`）与「接管动手前复读年龄、只在仍然够老时才删」（同文件 :4260）。同族形状见上面 takeover_count_feedback_is_pinned_by_the_gate_only (V11 R7-9)
