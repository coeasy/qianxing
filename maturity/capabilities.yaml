      - crates/qx-api/tests/account_projection_identity.rs 一条用例三向钉住那条判定：本账户的无 venue 事实必须全投影、换账户必须拒（订单与账簿各一次）、带显式 venue 的成交仍必须守住交易所边界。R13 的修复此前只有一轮临时验证，生产代码本轮零改动 (V11 R13 → T1)
      - crates/qx-protocol/src/lib.rs ACCOUNT_SNAPSHOT_JSON_SCHEMA 是 include_str!("../../../schemas/account-snapshot-v1.json")：仓库那份文件是权威，第二份手抄在编译期没有退路；ACCOUNT_SNAPSHOT_SCHEMA_VERSION 与 from_json 的版本闸门让「按别的版本自洽封存」的文档被拒，而不是被当 v1 解出来 (V11 S10 → T3)
      - crates/qx-protocol/tests/snapshot_schema_contract.rs 六条用例与 tools/check_architecture.py account_snapshot_schema_check 的 8 项：契约只有一份文本、键集合等于写侧产物、可空声明逐项等于协议类型（Q70 起权益也可空）、协议名与版本号同源、路由发出的就是它、对面 Python 同宽、六条判据各有常驻用例 (V11 T3)
      - crates/qx-cli/src/worker_entry.rs configured_reconcile_worker_id resolves the reconcile default by role + venue binding, and zero or several candidates both fail closed with the candidates listed：字面量 reconciler-main 遇改名拓扑报「找不到 worker」，遇同名 execution worker 会真跑一次下单执行 (V11 S12 → T4)
      - crates/qx-cli/src/tests/reconcile_worker_identity.rs 五条用例：改名的 reconciler 解析得到、关掉的报错只说口径缺失而不提字面量名、两个候选不挑第一个、paper 腿不是 Binance 候选、四份发布示例各自解析出自己的名字 (V11 T4)
      - crates/qx-cli/src/strategy_contract.rs configured_api_worker_id resolves the API worker by role and both spawn sites use that id：此前字面量 "api" 遇上任何改名的合法拓扑就让 serve 在启动瞬间死于"未知 worker" (V11 S1)
      - crates/qx-cli/src/tests/runtime_api_worker_identity.rs 两条用例：改名后的 api worker 能注册而字面量不能，且没有启用的 api worker 时解析报错而不是回落别的 worker (V11 S1)
      - crates/qx-cli/src/workers.rs scheduler 与 strategy 两个生产循环轮询 context.should_stop()：修之前它们是生产里唯二永不自然结束的循环 (V11 S2)
      - crates/qx-api/src/lib.rs ApiQueryModels + with_query_models_provider，crates/qx-cli/src/api_service.rs 把 provider 装到 /scheduler/runs、/account/ledger、/reconcile/reports：三个只读运维端点读的是磁盘/日志现状，读不到报 503，不再念开机那一刻 (V11 S3)
      - crates/qx-cli/src/tests/api_query_models_live.rs 两条用例：boot 之后落盘的对账报告与追加的成交都必须读得到 (V11 S3)
      - crates/qx-cli/src/tests/mod.rs assert_binary_fresh guards both binary lookups：`cargo test --bin` 走的是 option_env! 取不到值的回落分支且不重链 qx-cli.exe，缺这道守卫时一条变异会被过期 binary 判成"通过" (V11 S6)
      - deploy/README.md serve 端点表 + tools/check_architecture.py api_surface_doc_check：17 条路由与文档集合逐一相等，未列路径 404 的兜底口径也在门禁里 (V11 S7)
      - crates/qx-cli/src/api_service.rs publishes equity_raw straight from Ledger::equity_for, so an account holding a position without a mark price reports null instead of its remaining cash (V11 Q70)
      - crates/qx-api/src/lib.rs balances_endpoint_publishes_absent_money_as_null_not_zero covers both sides of the balances route: a computed zero stays 0, and a snapshot whose equity could not be computed prints null (V11 Q70)
    limitations:
      - continuous_market_driven_paper_worker_requires_runtime_market_data_validation
      - paper_venue_has_no_t_plus_one_settlement_state_today_bought_quantity_nor_board_scoped_limit_anchors_so_the_ashare_section_is_refused_at_every_submit_entry_instead_of_only_its_fee_model (V11 Q65)
      - position_rows_have_no_producer_for_unrealized_pnl_yet：V11 Q68 made the Ledger-fallback row honest (absent instead of a fabricated 0), but computing row PnL still needs a frozen market spec on the read side
      - account_level_unrealized_pnl_margin_frozen_realized_pnl_and_funding_raw_still_have_no_producer (V11 Q67 §28.5, restated after Q68)
      - stored_account_snapshots_predate_the_reconcile_presence_tag：V11 R10 给对账两格补了存在性标记，`state_hash` 形状随之改变，升级前落盘的账户快照会在 `from_json` 的哈希核对处被拒（有意 fail-closed），由 EventLog 重投影即可恢复；被 git 跟踪的产物侧实测不含此类快照
      - ccxt_reconcile_unknown_remote_open_order_has_no_fact_stream_entry_by_design：Q69 之后两半发现共用同一个出口，但一条远端孤单挂单没有可解析的 client_order_id，OMS 没有可标记的句柄，所以它只进报告与健康判定 (V11 Q69)
      - binance_reconcile_still_fetches_only_balances_and_orders：那条链没有 positions/funding/cashflow 取数器，Q69 之后报告里写 null 而不是 0，取数缺口本身仍在 (V11 Q69)
      - key_free_account_read_models_follow_one_default_account：无键的 /account/snapshot 与 /account/ledger 说的是配置里第一个真有账户日志的那条账户域（V11 R12 收的就是"账簿说 A、快照说 B"），其它账户必须带 account_id/venue_id 查询；账户快照在 API 服务装配时按域装载一次，不随事件流自动增补新账户
      - supervised_runtime_still_has_no_graceful_shutdown_trigger：V11 S2 让 scheduler 与 strategy 两个循环也读停机令牌，可 `RuntimeSupervisor::request_shutdown` 在生产里依然零调用者，仓库也没有信号处理依赖——出口有了，谁去翻这枚令牌仍是部署侧决策 (V11 R8/S2)
      - read_model_equity_null_carries_no_diagnostic：Q70 之后权益算不出时只报 null，看不出是哪一条持仓缺标记价；给出缺价标的清单需要新的线格式形状 (V11 Q70 §32.5 第 5 条)
      - three_equity_rulers_still_live：读模型的 equity_for（现货名义）、paper_available_margin（spec 尺子）与 strategy_contract 交给策略上下文的 available_margin_raw 仍是三把尺子，本轮只统一了"算不出即缺席"这一条 (V11 Q70 §32.5 第 4 条)

