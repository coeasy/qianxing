      - tracked_sample_artifacts_are_validated_by_nothing：跑完整套测试后 deploy/data 里 71 个被跟踪产物 0 项被改写，其中 16 份仍带着 Q62 已删除的 replay_hash 键，重 bless 只是把新数字抄进文件（V11 Q62 → Q1b）
      - no_tracked_sample_artifact_ever_loads_the_product_shaped_spec：deploy/data 下带 instrument_spec_version 的 21 份 run.json 里 3 份 ccxt 全来自真 CCXT 形状、15 份 default 没传规格，Q63 换口径后 0 项被跟踪产物改动 —— 示例集没有一份走过产品形状（V11 Q63 → Q1b）
      - the_source_label_mapping_is_not_falsifiable_by_the_static_gate：PRODUCT 分支接回 CCXT 常量时 230 项全绿，只有那两条走真实入口的行为用例问得出来；model_fingerprint 也仍不含规格内容，换一份 contract_size 不同的规格指纹不变（V11 Q63 → Q1b）
      - artifact_filenames_carry_no_summary_generation：产物路径只含 run_id 与 manifest.digest()，而 digest() 覆盖输入与模型、不含摘要自身的 schema_version，所以"只改摘要形状"的变更会让同一条示例命令原地撞旧文件并报"已存在不同内容"。Q66 落地后实测撞到 3 条集成用例（builtin_signal_from_config.rs:292、fast_backtest_manifest.rs:65/:96），撞名的 12 份本地产物移到 %TEMP% 后整树复跑 716 passed / 0 failed；缺的是一次决策：摘要世代进文件名，或给示例集一条重 bless 命令（V11 Q66 → Q67）
      - recomputation_compare_is_not_falsifiable_by_the_static_gate：把 recompute_declared_backtest_input 改成声明与声明自比时 245 项全绿，只有走真实入口的两条行为用例问得出来（V11 Q66）
      - summary_schema_is_now_v4：外部读者要改的除了 v2 的 replay_hash 与 v3 的 input 块，还有 v4 新增的 account 块（期初本金与来源两格，定点整数按字符串写）；本轮不改任何消费方脚本，示例摘要与正式摘要之间的世代差继续累积（V11 Q66 → Q72）
      - integration_backtest_cases_write_into_the_repo：#255 把 `storage.data_dir` 收成一条口径（相对值按进程当前目录解析，init 生成的项目把绝对落点钉进配置）之后，被 git 跟踪的 `deploy/data/**` 不再被写脏——本轮终树整跑 `git status --porcelain -- deploy/data` 为 0 行；但用例把启动目录当临时目录这一面没变：`cargo test` 的进程目录就是包目录，去掉 init 绝对化的那一跑立刻在 `crates/qx-cli/data/**` 写出 26 条未跟踪产物（终树整跑为 0 条，靠的是用例各改各的落点而不是仓库有一条收口判据）。缺的仍是一次决策：用例的 data_dir 一律落到 %TEMP%，还是给仓库加一条"跑完清干净"的收口判据（V12 §13.6 → V13 R2 #255）
      - multi_leg_chain_still_prints_no_account_line：四条链里只有它没有 `[X · Account]` 播报，因为它同时是最长的一条（`multi_builtin.rs` 498/500 行），再加 4 行就翻过 Phase 4s 的兄弟模块线；本轮给它的是拒收那一格声明 + 归因产物里的 `account_base_source`，补齐得先搬家（V11 Q72 §34.5 第 1、4 条）
      - backtest_report_max_drawdown_raw_has_no_reader：`BacktestReport.max_drawdown_raw`（`crates/qx-xingban/src/backtest.rs`）是 `max_drawdown_bps` 的定点原值伴生格，逐 bar 累加后写进报告，但全仓没有任何读者——摘要只发布 `max_drawdown_bps`（`crates/qx-cli/src/backtests/artifacts.rs`），读模型也只念 `max_drawdown_bps`（`crates/qx-cli/src/report_readout.rs`）。保留原值格是为了不丢精度地暴露原始量纲，接上它（例如进摘要的 `metrics` 块）之前按 #118 先例登记 (发布审计 第2轮)

