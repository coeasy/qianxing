      - doc_line_reference_orphans_stay_unaudited：一行里既没有带行号的引用、也没有能唯一解析的文件名时，那颗裸行号仍无人核对——R6-9 之后四份文本剩 349 颗（方案书 242 / 变更日志 101 / 台账 5 / 白皮书 1），R7 轮按同一条规则复测总数仍是 349（方案书 241 / 变更日志 102 / 台账 5 / 白皮书 1），两颗一降一升的不对称各有出处、记在 V11 §55.11；W4 轮按同一条规则复测 349 → 316（方案书 216 / 变更日志 99 / 台账 0 / 白皮书 1，另有 25 颗落在「史」钉行内），减号几乎全部来自同名歧义引用改成唯一路径后落进判据（V11 §56.2）；同名候选这一族本轮起有常驻判据了——`citation_audit`（`tools/check_architecture.py:10056`）里那份 `not ambiguous`：一份 `path:line` 能在多份同名文件里落到一行时直接红，不再跳过空行与点名两格；另一格是跨行折行会让点名绑不上（判据按行扫描），所以引用与名字必须写在同一行。W11 轮 V12 方案书进名册后按同一颗 `count` 复测（复测器 `maturity/evidence/v12-w11/orphan_after_v12.py`，复用 v11-r7 那份不另开口径）：316 → 334，多出的 18 颗全在 V12 自己身上（另有 4 颗落在史钉行内），另外四份逐份一字未动（方案书 216 / 变更日志 99 / 台账 0 / 白皮书 1）；同一轮另量到一类扫描面之外的引用：`路径:行` 写得清清楚楚、两颗正则却一个字都收不到，实测 4 颗——`docs/archive/自研量化框架重构方案-V11.md:532` 与 `CHANGELOG.md:4196` 的 `.github/workflows/ci.yml:211`、`docs/archive/自研量化框架审计与重构方案-V12.md:262` 的 `ci.yml:232`、同文件 :259 的 `.gitignore:15`，成因是首字符限 ASCII（点开头收不进）加上 `CAP_CITATION_EXTS`（`tools/check_architecture.py:9972`）当时既没有 `.yml` 也没有无扩展名条目。W10 轮把这四颗逐颗打开目标行、读到该行确实印着被指的东西之后才改口，新落点 V11:532 / CHANGELOG:4318（同轮那次插入把它自己顶下去 58 行，所以落点只能插入后回读定位）/ V12:262 与 :259。白名单这一格 V13 第 8 轮 B 组补了一半：`.yml` 进了 `CAP_CITATION_EXTS`、`.github` 进了名册扫描面，实测今天仓内有 10 颗 `.yml` 的行号引用被解析、0 颗解析失败（判据 `ci_citation_coverage_check`，`tools/check_architecture.py:12937`）；无扩展名那一半没补，`.gitignore:15` 这类引用至今仍在核对面之外。同一轮把这四颗的目标行又逐颗打开重读：三颗 ci.yml 的落点在这几轮里漂走了（for-loop 那块今天实测 216-225、`cpp-sdk` 作业块实测 237-243，本轮按实测改口写进 V11:532、V12:262 与 CHANGELOG 那一行），`.gitignore:15` 那颗仍逐字正确。漂移本身至今没有任何判据会报红——门禁只问「引用有没有主、数字在不在被引文件的行数之内、那一行空不空」，本格的缺口未闭。同一形状的另一格在 V13 第 8 轮 A1/A2 量到：引用有主、数字在那份文件的行数之内、那一行也不空——这三格门禁都问，『那一行说的是不是文案指的东西』却没人问。台账第 489 行两颗调用点引用就这么绿着说假话，两颗还各有成因：WSS 那颗写成 136 行，从写下那天起就指着握手头校验的那段闭包（HEAD 版本里真实落点已经是 142），从未被任何判据读过一眼；plain HTTP 那颗写成 657 行，在 HEAD 上是正确的，本轮 C5 在同一份文件里往上插了 39 行才把它顶偏到 696。本轮把台账 427/489/497/498/675 五行的每一颗引用逐颗打开目标行读原文改口，并把这套人工读法搬成可复跑的取证器 `maturity/evidence/v13-r8/citation_readout.py`——它只摊原文不判红，因为「这一行是不是在说这件事」问不出正则。要让判据认内容就得给每一颗引用配一颗字面量钉子，那要另一轮才做得完。 (V11 R6-9、R7-10、W4、V12 W11、W10、V13 第 8 轮 A1/A2)
      - inline_key_id_agreement_is_pinned_by_a_case_not_by_a_shape_gate：R7-3 之后再生一张带行内自指 id 的键表、却不在 `validate` 里问那颗 `check_keys`（`crates/qx-protocol/src/lib.rs:203`），仓内没有任何门禁会红——挡住它的只有`key_tables_reject_rows_whose_inline_id_disagrees_with_their_key`（`crates/qx-protocol/tests/snapshot_single_source/stable_json_tables.rs:113`）那一颗常驻用例，而它在门禁侧只被用例数地板钉着（`SNAPSHOT_CORE_CASE_FILE`，`tools/check_architecture.py:3659`）：地板挡"整批被删"，不挡"少一张表"。两处漏接各有反例实测断言红——M6a 让 `validate` 漏掉 fills 那张表、M6b 把 orders 那半边改去问外键 `client_order_id`（V11 R7-3，§55.12）
      - takeover_age_refresh_is_pinned_by_the_gate_only：R7-9-M7 与 M8 实测——把 `Takeover` 支或 `Wait` 支改回"自己再 `age_of` 一次"（`crates/qx-core/src/file_lock.rs:143`、:157），`-p qx-core file_lock` 那 9 条用例全绿（行为等价：抖动之外两次读的是同一个数），红的只有门禁两项：「锁的『同一场竞争只接管一次』住在 decide_lock 里，且抢锁循环把计数喂回判据、只按判据交出的年龄说话」（`tools/check_architecture.py:11717`）与「接管动手前复读年龄、只在仍然够老时才删」（同文件 :7350）。同族形状见上面 takeover_count_feedback_is_pinned_by_the_gate_only (V11 R7-9)
      - expect_unwrap_counts_depend_on_the_ruler_they_declare：门禁核对的是行号与文件在场，不问「这串计数按哪把尺子数」——三把尺子下的 `.unwrap(` 读数各差一个量级（当期值由 `maturity/evidence/v13-r8/expect_unwrap_ruler.txt` 打印），文档抄哪一把必须自己在句子里说清，改口径不会让任何判据红。本轮把三把尺子并排打印，为的是下一句改口时有人能复跑而不必信抄写 (V13 第 8 轮 B5)
      - capabilities_ledger_is_never_parsed_as_yaml：本台账名为 YAML 却没有任何一方按 YAML 读过它——`yaml.safe_load` 在第 59 行当场失败（全文件 738 行、563 条 `- ` 条目里 6 条以反引号开头，而反引号不是 YAML 的标量引号）。门禁读它用的是自己的行解析（`tools/check_architecture.py` 的 `ledger_list_items` 按缩进数 evidence 与 limitations 条目），README 台账那几格与「证据路径全部存在」都从这份行解析里出，所以把某条目改成另一种 YAML 写法、门禁照旧绿。全仓唯一一处 `import yaml` 在 `maturity/evidence/v13-r8/r8_measures.py`，它存在的目的就是把上面那个失败行号数出来，pyyaml 因此是取证的临时探针而不是项目依赖。本轮按登记处置而不重排那 738 行：重排会作废落在本文件里的每一颗行号锚点 (V13 第 8 轮 #221)
      - ledger_evidence_paths_have_partial_prefix_coverage：台账 410 条证据行里 337 条以「门禁会去核对存在性」的那组前缀开头，其余 73 条不以那组前缀开头——其中 39 条行内仍点到带前缀的路径 token、被那颗逐 token 的核对覆盖，剩下 34 条今天没有任何判据核对它们指向的东西在不在场。V13 第 8 轮把 `.github/` 加进这组前缀（`CAP_LEDGER_PATH_PREFIX`），于是 7 条以 `.github/` 开头的证据行（去重 1 个路径 token）从那一刻起才被逐 token 核对；同一轮把 `capabilities_check` 里那条逐 token 核对的正则从「手抄的第二份前缀清单」改成从这颗常量派生——实测那串七个前缀的字面清单在整个门禁文件里只剩 1 处，「改一份不会让另一份红」的形状因此没了落脚点。缺口照旧登记：那 34 条连一颗带前缀的路径 token 都没有的证据行、以及散文里不带前缀的简写指针，仍只由写它的人负责 (V13 第 8 轮 #221)
