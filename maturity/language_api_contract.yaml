# 语言/API 契约映射表（方案《牵星Qianxing-多语言SDK全能力升级与重构实施方案-2026-10-11》§2 基线复核产物）
#
# 目的：把「一个应用用例在每种语言面里叫什么、走哪条 HTTP 路由」写成机读的一行，由
# `language_api_contract_check` 与四处事实逐格对账。
#
# 为什么需要它：`maturity/app_use_cases.yaml` 已经把用例与 Rust 的 `cases/` 目录、`pub use`、
# 九项文档表三处对上了，但**一个字都没提另外三种语言面**。于是新增一个用例时，Rust 侧三处齐全、
# 门禁全绿，而 Python 远端门面与 C++ 头文件可以静默地少一个入口——集成方要到运行时才知道
# 「这个方法不存在」。方案 §8 要求「跨语言同一 Run」，前提是四种语言面**逐一对应**：
# 用例存在却没有一条语言腿能走到它，与「语言腿多出一个没人认领的入口」是同一类孤儿的两面。
#
# 取值口径（每格里的名字都必须在盘；门禁逐格核，且反向也核）：
#   rust          —— `crates/qx-app/src/cases/<use_case>.rs` 里的 `pub fn` 名。
#   python_native —— `python/qianxing/app.py` 的模块级函数（进程内 Rust 扩展）。
#   python_remote —— `AppClient` / `TradeWorkflowClient` 的公开方法（HTTP 门面）。
#   cpp_remote    —— `cpp/include/qianxing_app.hpp` 里 `AppClient` 的公开方法（HTTP 门面）。
#   http          —— 该用例在 qx-api 上占用的路由；异步用例同时列同步与 `/start` 两条。
#   `[]` 表示该用例不在这条腿（交易控制只在远端门面上，进程内扩展不暴露它）。
schema_version: 1
kind: language-api-contract
updated_at: "2026-10-13"

# 进程内扩展的模块级公开函数里不属于任何「用例入口」的那些。
# 写成显式名册而不是「排除 doctor 之外」这类规则：规则会把将来新加的同形状函数一起放行，
# 名册则要求有人为每一条回答一次「它为什么不是用例入口」。
python_native_helpers:
  - name: doctor
    note: "能力探测：报告本次安装里哪些 Rust 应用入口可用；不是用例，是安装自检"
  - name: list_builtin_strategies
    note: "策略发现：从共享 qx-strategy 返回名称、说明、信号旋钮和多腿限制；不执行回测用例"

# 客户端公开面里属于 run 生命周期、不属于任何用例的方法。
cpp_lifecycle_methods:
  - name: run_events
    note: "C++ 远端门面按单次 Run 读取持久化的 Rust 生命周期事件"
  - name: get_live_events
    note: "C++ 远端门面按服务端序号游标读取实时事件"
  - name: run_status
    note: "运行状态读取（GET /app/runs/{run_id}）；不是用例，是 run 生命周期的读面"
  - name: cancel_run
    note: "运行取消（POST /app/runs/{run_id}/cancel）；不是用例，是 run 生命周期的写面"
  - name: start_paper_algo_execution
    note: "Paper TWAP/VWAP 父单持久化启动生命周期入口"
  - name: get_paper_algo_execution
    note: "Paper TWAP/VWAP 父单状态读取生命周期入口"
  - name: cancel_paper_algo_execution
    note: "Paper TWAP/VWAP 父单取消生命周期入口"
  - name: list_paper_algo_executions
    note: "Paper TWAP/VWAP 活跃父单分页生命周期入口"

python_remote_lifecycle_methods:
  - name: events
    note: "Python 远端 RunHandle 按单次 Run 读取持久化生命周期事件，支持同步/异步"
  - name: get_live_events
    note: "Python 远端门面按服务端序号游标读取实时事件"
  - name: start_paper_algo_execution
    note: "Paper TWAP/VWAP 父单持久化启动生命周期入口"
  - name: get_paper_algo_execution
    note: "Paper TWAP/VWAP 父单状态读取生命周期入口"
  - name: cancel_paper_algo_execution
    note: "Paper TWAP/VWAP 父单取消生命周期入口"
  - name: list_paper_algo_executions
    note: "Paper TWAP/VWAP 活跃父单分页生命周期入口"

rust_remote_lifecycle_methods:
  - name: get_run_events
    note: "Rust 远端门面按单次 Run 读取持久化生命周期事件"
  - name: start_paper_algo_execution
    note: "Rust 远端门面调用服务端 Paper TWAP/VWAP 持久化启动入口"
  - name: get_paper_algo_execution
    note: "Rust 远端门面读取 Paper TWAP/VWAP 父单状态"
  - name: cancel_paper_algo_execution
    note: "Rust 远端门面调用服务端 Paper TWAP/VWAP 取消入口"
  - name: list_paper_algo_executions
    note: "Rust 远端门面分页读取 Paper TWAP/VWAP 父单"
  - name: get_live_events
    note: "Rust 远端门面按服务端序号游标读取实时事件"
  - name: run_multi_market_backtest
    note: "Rust 远端门面调用共享账户多市场 Bar 回测"
  - name: start_multi_market_backtest
    note: "Rust 远端门面启动共享账户多市场 Bar 回测"

