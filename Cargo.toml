[workspace]
resolver = "2"
members = [
    "crates/qx-core",
    "crates/qx-application",
    "crates/qx-domain",
    "crates/qx-data",
    "crates/qx-fenye",
    "crates/qx-guanxing",
    "crates/qx-xingban",
    "crates/qx-zhenlu",
    "crates/qx-oms",
    "crates/qx-orchestrator",
    "crates/qx-genglu",
    "crates/qx-plugin",
    "crates/qx-factor",
    "crates/qx-portfolio",
    "crates/qx-risk",
    "crates/qx-protocol",
    "crates/qx-provider",
    "crates/qx-scheduler",
    "crates/qx-control",
    "crates/qx-datastruct",
    "crates/qx-storage",
    "crates/qx-api",
    "crates/qx-adapter",
    "crates/qx-runtime",
    "crates/qx-execution",
    "crates/qx-python",
    "crates/qx-strategy",
    "crates/qx-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Qianxing Quant"]
repository = "https://github.com/coeasy/qianxing"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qx-core = { path = "crates/qx-core" }
qx-domain = { path = "crates/qx-domain" }
qx-data = { path = "crates/qx-data" }
qx-portfolio = { path = "crates/qx-portfolio" }
qx-risk = { path = "crates/qx-risk" }

[profile.release]
opt-level = 3
lto = true
