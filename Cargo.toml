[workspace]
resolver = "2"
members = [
    "crates/qx-core",
    "crates/qx-data",
    "crates/qx-guanxing",
    "crates/qx-xingban",
    "crates/qx-zhenlu",
    "crates/qx-orchestrator",
    "crates/qx-genglu",
    "crates/qx-plugin",
    "crates/qx-factor",
    "crates/qx-risk",
    "crates/qx-protocol",
    "crates/qx-provider",
    "crates/qx-scheduler",
    "crates/qx-control",
    "crates/qx-datastruct",
    "crates/qx-storage",
    "crates/qx-api",
    "crates/qx-adapter",
    "crates/qx-runtime",
    "crates/qx-execution",
    "crates/qx-python",
    "crates/qx-strategy",
    "crates/qx-spec",
    "crates/qx-cli",
    # 跨 crate 契约用例宿主（方案 §5.4 P1-12）：纯测试 crate，无生产代码，无人依赖它。
    # 放进 workspace 是为了它仍被 `cargo test --workspace` 跑到、并计入全仓用例地板。
    "crates/contract-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Qianxing Quant"]
repository = "https://github.com/coeasy/qianxing"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qx-core = { path = "crates/qx-core" }
qx-data = { path = "crates/qx-data" }
qx-risk = { path = "crates/qx-risk" }

[profile.release]
opt-level = 3
lto = true
