[build-system]
requires = ["setuptools>=68", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "qianxing-bridge"
version = "0.1.0"
description = "Qianxing JSON/DataStruct bridge"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.4.0",
    # Windows 没有系统 IANA 时区库；`qianxing_ashare` 导入时即解析 Asia/Shanghai。
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
ccxt-pro = [
    "ccxtpro>=1.0.0",
]
a-share-akshare = [
    "akshare>=1.16.0",
]
a-share-baostock = [
    "baostock>=0.8.9",
]
a-share-easy-tdx = [
    "easy-tdx>=0.1.0",
]
a-share = [
    "akshare>=1.16.0",
    "baostock>=0.8.9",
    "easy-tdx>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
# 只打包发布的命名空间：`pip wheel` 会在 `python/build/lib` 里留下上一次构建的副本，
# 不加 include 时它们会被再次发现成 `build.lib.qianxing_bridge` 并递归进wheel。
include = [
    "qianxing_bridge*",
    "qianxing_ccxt*",
    "qianxing_ashare*",
    "qianxing_strategy*",
]

[tool.setuptools.package-data]
qianxing_bridge = [
    "_qianxing_native*.pyd",
    "_qianxing_native*.so",
    "_qianxing_native*.dll",
    "_qianxing_native*.dylib",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
