groups:
  - name: qianxing-runtime
    rules:
      - alert: QianxingWorkerDown
        expr: qx_worker_up == 0
        for: 30s
        labels:
          severity: critical
          service: qianxing
        annotations:
          summary: "Qianxing worker is down"
          description: "worker={{ $labels.worker }} reported down or has a stale heartbeat."

      - alert: QianxingWorkerHeartbeatStale
        expr: time() - qx_worker_heartbeat_timestamp_seconds > 30
        for: 30s
        labels:
          severity: critical
          service: qianxing
        annotations:
          summary: "Qianxing worker heartbeat is stale"
          description: "worker={{ $labels.worker }} has not written a heartbeat within 30 seconds."

      - alert: QianxingWorkerMetricsStale
        expr: qx_worker_metrics_stale == 1
        for: 30s
        labels:
          severity: critical
          service: qianxing
        annotations:
          summary: "Qianxing worker metrics file is stale"
          description: "worker={{ $labels.worker }} has no fresh metrics sample."

      - alert: QianxingOutboxPublishFailures
        expr: increase(qx_outbox_relay_publish_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: qianxing
        annotations:
          summary: "Qianxing Outbox publish failures"
          description: "worker={{ $labels.worker }} has publish failures in the last 5 minutes."

      - alert: QianxingConsumerDeadLetters
        expr: increase(qx_event_consumer_dead_lettered_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: qianxing
        annotations:
          summary: "Qianxing consumer produced dead letters"
          description: "worker={{ $labels.worker }} dead-lettered events in the last 5 minutes."

      - alert: QianxingConsumerAckFailures
        expr: increase(qx_event_consumer_ack_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: qianxing
        annotations:
          summary: "Qianxing consumer ACK failures"
          description: "worker={{ $labels.worker }} could not acknowledge JetStream messages."

      - alert: QianxingReconcileMetricsUnavailable
        expr: qx_reconcile_metrics_available == 0
        for: 1m
        labels:
          severity: critical
          service: qianxing
        annotations:
          summary: "Qianxing reconciliation reports are unavailable"
          description: "The API could not read durable reconciliation reports; absence must not be treated as a clean account."

      - alert: QianxingReconcilerReportMissing
        expr: qx_reconcile_report_present == 0
        for: 30s
        labels:
          severity: critical
          service: qianxing
        annotations:
          summary: "Qianxing reconciler has no durable report"
          description: "worker={{ $labels.worker }} account={{ $labels.account }} venue={{ $labels.venue }} has no report for its configured identity."

      - alert: QianxingReconcileReportStale
        expr: time() - qx_reconcile_report_observed_timestamp_seconds > 60
        for: 30s
        labels:
          severity: critical
          service: qianxing
        annotations:
          summary: "Qianxing reconciliation report is stale"
          description: "worker={{ $labels.worker }} account={{ $labels.account }} venue={{ $labels.venue }} has not reconciled for over 60 seconds."

      - alert: QianxingReconcileOrderIssues
        expr: qx_reconcile_order_issues > 0
        for: 30s
        labels:
          severity: critical
          service: qianxing
        annotations:
          summary: "Qianxing reconciliation found order issues"
          description: "worker={{ $labels.worker }} account={{ $labels.account }} venue={{ $labels.venue }} reports {{ $value }} unresolved order issues."

      - alert: QianxingReconcileBalanceDiscrepancies
        expr: qx_reconcile_balance_discrepancies > 0
        for: 30s
        labels:
          severity: critical
          service: qianxing
        annotations:
          summary: "Qianxing reconciliation found balance discrepancies"
          description: "worker={{ $labels.worker }} account={{ $labels.account }} venue={{ $labels.venue }} reports {{ $value }} unresolved balance discrepancies."

      # 这一条读的是状态量而不是增量：`qx_outbox_relay_parked` 是"库里现在还有几条已用尽
      # 投递预算"，relay 每轮原样写出，所以判据是 > 0 而不是 increase(...)。用尽预算的事件
      # 不再被投递、也不再占住页首，只会静静留在 outbox 里——没有这一条，它们在运维面上
      # 就等于消失了（V11 K2 计数、R7-d 改成不问页数的状态量）。
      - alert: QianxingOutboxParkedEvents
        expr: qx_outbox_relay_parked > 0
        for: 5m
        labels:
          severity: critical
          service: qianxing
        annotations:
          summary: "Qianxing Outbox has parked events"
          description: "worker={{ $labels.worker }} has {{ $value }} events past the relay retry budget; they are no longer delivered and stay in the outbox until an operator claims or acks them."
