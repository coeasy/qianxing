[package]
name = "qx-python"
description = "牵星 Python 原生扩展与 Arrow C Data Interface 边界"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_qianxing_native"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
qx-datastruct = { version = "0.2.1", path = "../qx-datastruct" }
# T2-2/G1：`app_*` 三条入口调的是 `qx-app` 的应用层用例（Python 侧不另写一份业务）。
qx-app = { version = "0.2.1", path = "../qx-app" }
qx-data = { version = "0.2.1", path = "../qx-data" }
qx-core = { version = "0.2.1", path = "../qx-core" }
qx-provider = { version = "0.2.1", path = "../qx-provider" }
qx-strategy = { version = "0.2.1", path = "../qx-strategy" }
qx-xingban = { version = "0.2.1", path = "../qx-xingban" }
serde = { workspace = true }
serde_json = { workspace = true }
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }

[build-dependencies]
pyo3-build-config = "0.29.2"
