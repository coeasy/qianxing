[package]
name = "qx-python"
description = "牵星 Python 原生扩展与 Arrow C Data Interface 边界"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_qianxing_native"
crate-type = ["cdylib"]

[dependencies]
qx-datastruct = { path = "../qx-datastruct" }
# T2-2/G1：`app_*` 三条入口调的是 `qx-app` 的应用层用例（Python 侧不另写一份业务）。
qx-app = { path = "../qx-app" }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }
